<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Base de Dados EJC Califórnia</title>
<link rel="stylesheet" href="../design_system_unzip/ejc_claude/styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
  html,body{margin:0;height:100%}
  html,body{min-height:100%}
  body{background:linear-gradient(160deg,var(--bg-top) 0%,var(--bg) 55%);display:flex;align-items:flex-start;justify-content:center;padding:22px}
  svg.lucide{width:1em;height:1em;display:block;stroke-width:1.8}
  #root{width:100%;max-width:1300px}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:99px}
  input::placeholder{color:var(--text-3)}

    body{padding:0}
    input,select,textarea{font-size:16px !important} /* evita zoom automático no iOS */
    .hide-mobile{display:none !important}
  }

</head>
<body>
<div id="root"></div>
<script type="text/plain" id="appcode">
const { useState, useEffect, useRef } = React;

/* ---------- responsividade ---------- */
function useIsMobile(bp=760){
  const [m,setM]=useState(typeof window!=="undefined" && window.innerWidth<bp);
  useEffect(()=>{
    const on=()=>setM(window.innerWidth<bp);
    on();
    window.addEventListener("resize",on);
    return ()=>window.removeEventListener("resize",on);
  },[bp]);
  return m;
}

/* ---------- Icon ---------- */
function Icon({ name, size = 20 }) {
  return <span style={{ fontSize: size, display: "inline-flex" }}><i data-lucide={name}></i></span>;
}
function useLucide(){ useEffect(() => { if (window.lucide) window.lucide.createIcons(); }); }

/* ---------- primitives (mirror of the DS components) ---------- */
function IconButton({ variant="default", size=42, label, children, ...r }){
  const v = variant==="dark" ? {background:"var(--brand-brown)",color:"var(--on-brand)",boxShadow:"var(--shadow-sm)"}
    : variant==="soft" ? {background:"var(--surface-2)",color:"var(--text-2)"}
    : {background:"var(--surface)",color:"var(--text)",boxShadow:"var(--shadow-sm)"};
  return <button aria-label={label} title={label} {...r} style={{width:size,height:size,borderRadius:"var(--r-pill)",border:"none",cursor:"pointer",display:"inline-flex",alignItems:"center",justifyContent:"center",...v}}>{children}</button>;
}
function Button({ variant="primary", children, iconLeft, style, ...r }){
  const v = variant==="secondary" ? {background:"var(--surface)",color:"var(--text)",boxShadow:"var(--shadow-sm)"}
    : variant==="ghost" ? {background:"transparent",color:"var(--text-2)"}
    : {background:"var(--brand-brown)",color:"var(--on-brand)",boxShadow:"var(--shadow-sm)"};
  return <button {...r} style={{display:"inline-flex",alignItems:"center",gap:8,fontFamily:"var(--font-sans)",fontWeight:600,fontSize:14,padding:"10px 18px",borderRadius:"var(--r-pill)",border:"none",cursor:"pointer",...v,...style}}>{iconLeft}{children}</button>;
}
const TONES={neutral:["var(--surface-2)","var(--text-2)"],brand:["var(--brand-brown-soft)","var(--brand-brown)"],yellow:["var(--brand-yellow-soft)","var(--on-yellow)"],success:["var(--success-soft)","var(--success)"],warning:["var(--warning-soft)","var(--warning)"],danger:["var(--danger-soft)","var(--danger)"],info:["var(--info-soft)","var(--info)"]};
function Badge({ tone="neutral", dot, children }){
  const [bg,fg]=TONES[tone]||TONES.neutral;
  return <span style={{display:"inline-flex",alignItems:"center",gap:6,background:bg,color:fg,fontSize:12,fontWeight:600,padding:"5px 11px",borderRadius:99,whiteSpace:"nowrap"}}>{dot&&<span style={{width:6,height:6,borderRadius:"50%",background:"currentColor"}}/>}{children}</span>;
}
function Tag({ color="var(--cat-brown)", children }){
  return <span style={{display:"inline-flex",alignItems:"center",gap:7,background:"var(--surface-2)",fontSize:13,fontWeight:500,color:"var(--text)",padding:"5px 11px",borderRadius:99,whiteSpace:"nowrap"}}><span style={{width:8,height:8,borderRadius:"50%",background:color}}/>{children}</span>;
}
function Avatar({ src, name="", size=44, ring }){
  const initials=name.split(" ").filter(Boolean).slice(0,2).map(n=>n[0]).join("").toUpperCase();
  return <span style={{width:size,height:size,borderRadius:"50%",overflow:"hidden",display:"inline-flex",alignItems:"center",justifyContent:"center",background:"var(--brand-brown-soft)",color:"var(--brand-brown)",fontWeight:700,fontSize:size*0.36,flex:"0 0 auto",boxShadow:ring?"0 0 0 3px var(--surface),0 0 0 5px var(--brand-yellow)":"var(--shadow-xs)"}}>{src?<img src={src} alt={name} style={{width:"100%",height:"100%",objectFit:"cover"}}/>:initials}</span>;
}
function Card({ title, subtitle, action, children, style, pad="var(--card-pad)" }){
  return <section style={{background:"var(--surface)",borderRadius:"var(--r-lg)",boxShadow:"var(--shadow-sm)",padding:pad,...style}}>
    {(title||action)&&<header style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16,gap:12}}>
      <div>{title&&<h3 style={{margin:0,fontSize:17,fontWeight:600,color:"var(--text)"}}>{title}</h3>}{subtitle&&<p style={{margin:"3px 0 0",fontSize:13,color:"var(--text-2)"}}>{subtitle}</p>}</div>{action}</header>}
    {children}</section>;
}
function SearchInput({ placeholder, value, onChange, autoFocus, minWidth=200, maxWidth=440 }){
  return <div style={{display:"flex",alignItems:"center",gap:10,background:"var(--surface)",borderRadius:99,padding:"11px 18px",boxShadow:"var(--shadow-sm)",minWidth,flex:1,maxWidth}}>
    <span style={{color:"var(--text-3)",display:"inline-flex",fontSize:18}}><Icon name="search" size={18}/></span>
    <input autoFocus={autoFocus} value={value} onChange={e=>onChange&&onChange(e.target.value)} placeholder={placeholder} style={{border:"none",outline:"none",background:"transparent",flex:1,fontFamily:"var(--font-sans)",fontSize:14,color:"var(--text)"}}/>
  </div>;
}
function Select({ label, value }){
  return <button style={{display:"inline-flex",alignItems:"center",gap:8,borderRadius:99,border:"none",cursor:"pointer",padding:"10px 16px",fontSize:14,fontWeight:600,color:"var(--text)",background:"var(--surface)",boxShadow:"var(--shadow-sm)"}}>{label&&<span style={{color:"var(--text-3)",fontWeight:500}}>{label}</span>}<span>{value}</span><span style={{color:"var(--text-3)",display:"inline-flex",fontSize:15}}><Icon name="chevron-down" size={15}/></span></button>;
}
function StatusDot({ active }){
  return <Badge tone={active?"success":"neutral"} dot>{active?"Ativo":"Inativo"}</Badge>;
}

/* ---------- domain data ---------- */
const MJC_TEAMS=["Ficha","Montagem","Finanças","Palestra","Pós"];
const MJC_ICON={"Ficha":"clipboard-list","Montagem":"layout-grid","Finanças":"wallet","Palestra":"mic","Pós":"sparkles"};
const MJC_COLOR={"Ficha":"var(--cat-blue)","Montagem":"var(--cat-terracotta)","Finanças":"var(--cat-olive)","Palestra":"var(--cat-plum)","Pós":"var(--cat-yellow)"};

// tabs de montagem: Coordenação Geral, Sala, Compras, depois o resto em ordem alfabética
const MONTAGEM_TABS=["Coordenação Geral","Sala","Compras","Acolhida","Cafezinho","Cozinha","Liturgia Externa","Liturgia Interna","Moita","Ordem e Limpeza","Recepção ao Palestrante","Secretaria","Tios Circulistas","Visitação Externa"];

const EJC_YEARS=["XXXI EJC (2026)","XXX EJC (2025)","XXIX EJC (2024)","XXVIII EJC (2023)","XXVII EJC (2022)","XXVI EJC (2019)","XXV EJC (2018)","XXIV EJC (2017)","XXIII EJC (2016)","XXII EJC (2015)","XXI EJC (2014)","XX EJC (2013)","XIX EJC (2012)","XVIII EJC (2011)","XVII EJC (2010)","XVI EJC (2009)","XV EJC (2008)","XIV EJC (2007)","XIII EJC (2006)","XII EJC (2005)","XI EJC (2004)","X EJC (2003)","IX EJC (2002)","VIII EJC (2001)","VII EJC (2000)","VI EJC (1999)","V EJC (1998)","IV EJC (1997)","III EJC (1996)","II EJC (1995)","I EJC (1993)"];
// extrai o ano numérico de um item do EJC_YEARS, ex: "XXVIII EJC (2023)" -> 2023
const anoDoEjc = s => { const m=/\((\d{4})\)/.exec(s||""); return m?parseInt(m[1]):null; };

const mjcColor = t => MJC_COLOR[t] || "var(--cat-brown)";

// ---------- Supabase (banco + autenticação reais) ----------
const supabase = window.supabase.createClient(
  "https://lmxepyuclguashzafzak.supabase.co",
  "sb_publishable_cz1KBhLLi2GuflJ7QfMgCw_di_8f2Ol"
);

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const StoreContext=React.createContext(null);
const useStore=()=>React.useContext(StoreContext);

// ---------- mapeamento: linha do banco <-> forma usada nas telas ----------
function rowToJovem(r){
  return { id:r.id, user_id:r.user_id, ts:new Date(r.created_at).getTime(), n:r.nome, tel:r.telefone, mjc:r.mjc, ejc:r.ejc, end:r.endereco, inst:r.instrumento, ativo:r.ativo, foto:r.foto, ficha:r.ficha };
}
function jovemToRow(j){
  const row={ nome:j.n, telefone:j.tel, mjc:j.mjc, ejc:j.ejc, endereco:j.end, instrumento:j.inst, ativo:j.ativo, foto:j.foto||null, ficha:j.ficha };
  if(j.user_id) row.user_id=j.user_id;
  return row;
}
function rowToTio(r){ return { id:r.id, user_id:r.user_id, ts:new Date(r.created_at).getTime(), n:r.nome, tel:r.telefone, ejc:r.ejc, end:r.endereco, ativo:r.ativo }; }
function tioToRow(t){ return { nome:t.n, telefone:t.tel, ejc:t.ejc, endereco:t.end, ativo:t.ativo }; }
function rowToMontagem(r){ return { id:r.id, nome:r.nome, autor:r.autor, visib:r.visibilidade, cells:r.cells||{} }; }
function montagemToRow(m){ return { nome:m.nome, autor:m.autor, visibilidade:m.visib }; }
function rowToForm(r){ return { id:r.id, nome:r.nome, favorito:r.favorito, sistema:r.sistema, campos:r.campos||[] }; }
function rowToDirigente(r){ return { id:r.id, user_id:r.user_id, nome:r.nome, email:r.email, cargo:r.cargo }; }

// campos-resumo derivados da ficha
function fichaToFields(f){
  const mjc = f.mjcAtual && f.mjcAtual!=="Não estou em nenhuma" ? f.mjcAtual : "—";
  const ejc = f.fezCalifornia ? (f.anoEjc||"—") : (f.qualEjc||"—");
  const inst = f.musico && (f.instrumentos||[]).length ? f.instrumentos.join(", ") : null;
  return { n:(f.nome||"").trim()||"Sem nome", tel:f.whats||"—", mjc, ejc, end:f.endereco||"—", inst, foto:f.foto||null, ficha:f };
}
// converte a Ficha preenchida numa nova linha da base
function formToJovem(f){
  return { ativo:true, ...fichaToFields(f) };
}

/* ---------- autenticação (Supabase Auth) ----------
   O papel (admin/membro) é resolvido consultando a tabela `dirigentes`: existe linha com
   user_id = auth.uid() → é dirigente (admin); senão é membro e só enxerga a própria linha
   em `jovens` (garantido pelas políticas de RLS no banco, não só pela UI). */
const Auth={
  async login(email,senha){
    const { error } = await supabase.auth.signInWithPassword({ email:(email||"").trim(), password:senha });
    if(error) return { ok:false, error: /invalid login credentials/i.test(error.message) ? "E-mail ou senha incorretos." : error.message };
    return { ok:true };
  },
  async signup(email,senha){
    const { data, error } = await supabase.auth.signUp({ email:(email||"").trim(), password:senha });
    if(error) return { ok:false, error: /already registered|already exists/i.test(error.message) ? "Este e-mail já tem conta. Faça login." : error.message };
    return { ok:true, needsConfirm: !data.session };
  },
  async logout(){ await supabase.auth.signOut(); },
  // envia e-mail com link pra redefinir a senha (usuário deslogado)
  async requestReset(email){
    const redirect = window.location.origin + window.location.pathname;
    const { error } = await supabase.auth.resetPasswordForEmail((email||"").trim().toLowerCase(), { redirectTo: redirect });
    if(error) return { ok:false, error: /rate limit/i.test(error.message) ? "Muitas tentativas em pouco tempo — espere alguns minutos e tente de novo." : error.message };
    return { ok:true };
  },
  // define a nova senha (usuário já autenticado — via link de recuperação ou logado na plataforma)
  async updatePassword(senha){
    const { error } = await supabase.auth.updateUser({ password:senha });
    if(error) return { ok:false, error:error.message };
    return { ok:true };
  },
};

function StoreProvider({ user, children }){
  const [jovens,setJovens]=useState([]);
  const [tios,setTios]=useState([]);
  const [montagens,setMontagens]=useState([]);
  const [formularios,setFormularios]=useState([]);
  const [dirigentes,setDirigentes]=useState([]);
  const [loading,setLoading]=useState(true);
  const isAdmin = user.role==="admin";

  useEffect(()=>{
    let active=true;
    (async ()=>{
      setLoading(true);
      const [jRes,tRes,mRes,fRes,dRes] = await Promise.all([
        supabase.from("jovens").select("*").order("created_at",{ascending:false}),
        isAdmin ? supabase.from("tios").select("*").order("created_at",{ascending:false}) : Promise.resolve({data:[]}),
        isAdmin ? supabase.from("montagens").select("*").order("created_at",{ascending:false}) : Promise.resolve({data:[]}),
        supabase.from("formularios").select("*"),
        isAdmin ? supabase.from("dirigentes").select("*") : Promise.resolve({data:[]}),
      ]);
      if(!active) return;
      setJovens((jRes.data||[]).map(rowToJovem));
      setTios((tRes.data||[]).map(rowToTio));
      setMontagens((mRes.data||[]).map(rowToMontagem));
      setFormularios((fRes.data||[]).map(rowToForm));
      setDirigentes((dRes.data||[]).map(rowToDirigente));
      setLoading(false);
    })();
    return ()=>{ active=false; };
  },[user.id]);

  const api={
    jovens, tios, montagens, formularios, dirigentes, loading,
    addJovem: async (j)=>{
      const { data, error } = await supabase.from("jovens").insert(jovemToRow(j)).select().single();
      if(!error) setJovens(l=>[rowToJovem(data),...l]);
      return { data: data?rowToJovem(data):null, error };
    },
    updateJovem: async (id,patch)=>{
      const { data, error } = await supabase.from("jovens").update(jovemToRow(patch)).eq("id",id).select().single();
      if(!error) setJovens(l=>l.map(j=>j.id===id?rowToJovem(data):j));
      return { data: data?rowToJovem(data):null, error };
    },
    // convida um novo dirigente: cria o convite (user_id ainda nulo) e manda um e-mail de acesso.
    // quando a pessoa entrar pela primeira vez com esse e-mail, o AuthedGate reivindica o convite
    // automaticamente (ligando user_id) e a obriga a completar a própria ficha.
    inviteDirigente: async (d)=>{
      const email = (d.email||"").trim().toLowerCase();
      const { data, error } = await supabase.from("dirigentes").insert({ nome:d.nome, email, cargo:d.cargo }).select().single();
      if(error) return { data:null, error };
      setDirigentes(l=>[...l,rowToDirigente(data)]);
      const redirect = window.location.origin + window.location.pathname;
      const { error: otpError } = await supabase.auth.signInWithOtp({ email, options:{ emailRedirectTo: redirect } });
      return { data: rowToDirigente(data), error: otpError||null };
    },
    // corrige um convite ainda pendente (ex: e-mail digitado errado) e reenvia o link de acesso
    updateDirigenteConvite: async (id,d)=>{
      const email = (d.email||"").trim().toLowerCase();
      const { data, error } = await supabase.from("dirigentes").update({ nome:d.nome, email, cargo:d.cargo }).eq("id",id).select().single();
      if(error) return { data:null, error };
      setDirigentes(l=>l.map(x=>x.id===id?rowToDirigente(data):x));
      const redirect = window.location.origin + window.location.pathname;
      const { error: otpError } = await supabase.auth.signInWithOtp({ email, options:{ emailRedirectTo: redirect } });
      return { data: rowToDirigente(data), error: otpError||null };
    },
    removeDirigente: async (id)=>{
      const { error } = await supabase.from("dirigentes").delete().eq("id",id);
      if(!error) setDirigentes(l=>l.filter(d=>d.id!==id));
      return { error };
    },
    addMontagem: async (m)=>{
      const { data, error } = await supabase.from("montagens").insert(montagemToRow(m)).select().single();
      if(error) return null;
      const row=rowToMontagem(data); setMontagens(l=>[row,...l]); return row;
    },
    setMontagemCell: async (montId,tab,rowKey,person)=>{
      const m=montagens.find(x=>x.id===montId); if(!m) return;
      const tabCells={...(m.cells[tab]||{})};
      if(person) tabCells[rowKey]=person; else delete tabCells[rowKey]; // person null → remove da equipe
      const newCells={...m.cells,[tab]:tabCells};
      const { data, error } = await supabase.from("montagens").update({cells:newCells}).eq("id",montId).select().single();
      if(!error) setMontagens(l=>l.map(x=>x.id===montId?rowToMontagem(data):x));
    },
    addForm: async (f)=>{
      const { data, error } = await supabase.from("formularios").insert({ nome:f.nome, favorito:false, sistema:false, campos:f.campos||[] }).select().single();
      if(!error) setFormularios(l=>[...l,rowToForm(data)]);
    },
    updateForm: async (id,patch)=>{
      const { data, error } = await supabase.from("formularios").update({ nome:patch.nome, campos:patch.campos }).eq("id",id).select().single();
      if(!error) setFormularios(l=>l.map(f=>f.id===id?rowToForm(data):f));
    },
    deleteForm: async (id)=>{
      const { error } = await supabase.from("formularios").delete().eq("id",id);
      if(!error) setFormularios(l=>l.filter(f=>f.id!==id));
    },
    setFavorito: async (id)=>{
      setFormularios(l=>l.map(f=>({...f,favorito:f.id===id})));
      await supabase.from("formularios").update({favorito:false}).neq("id",id);
      await supabase.from("formularios").update({favorito:true}).eq("id",id);
    },
  };
  return <StoreContext.Provider value={api}>{children}</StoreContext.Provider>;
}

/* ======================================================================
   HEADER
   ====================================================================== */
function Header({ title, sub, right }){
  return <div style={{display:"flex",alignItems:"center",gap:16,marginBottom:24,flexWrap:"wrap"}}>
    <div style={{marginRight:"auto"}}>
      <div className="mono-overline">EJC CALIFÓRNIA · BH</div>
      <h1 style={{margin:"4px 0 0",fontSize:28,fontWeight:800,letterSpacing:"-.02em",color:"var(--text)"}}>{title}</h1>
      {sub&&<p style={{margin:"4px 0 0",fontSize:14,color:"var(--text-2)"}}>{sub}</p>}
    </div>
    {right}
  </div>;
}

/* ======================================================================
   INÍCIO (página principal)
   ====================================================================== */
function Inicio({ onNovo, onOpenPerson, onOpenTeam }){
  const { jovens } = useStore();
  const ultimos = [...jovens].sort((a,b)=>(b.ts||0)-(a.ts||0)).slice(0,3);
  const counts = MJC_TEAMS.reduce((o,t)=>{o[t]=jovens.filter(j=>j.mjc===t&&j.ativo).length;return o;},{});
  const totalAtivos = jovens.filter(j=>j.ativo).length;
  return <div>
    <Header title="Início" sub="Visão geral da base de dados do MJC"
      right={<><SearchInput placeholder="Buscar pessoa..." maxWidth={360}/>
        <Button variant="primary" iconLeft={<Icon name="user-plus" size={18}/>} onClick={onNovo}>Cadastrar pessoa</Button></>}/>

    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(300px,1fr))",gap:20,alignItems:"start"}}>
      {/* Últimos 3 cadastros */}
      <Card title="Últimos cadastros" subtitle="As 3 pessoas mais recentes" action={<Select value="Ver todos"/>}>
        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          {ultimos.length===0 && <div style={{padding:"28px",textAlign:"center",color:"var(--text-3)",fontSize:14}}>Nenhum cadastro ainda.</div>}
          {ultimos.map((p,i)=>(
            <div key={p.id||i} onClick={()=>onOpenPerson&&onOpenPerson(p)} title="Ver ficha" style={{display:"flex",alignItems:"center",gap:14,background:"var(--surface-2)",borderRadius:"var(--r-md)",padding:"12px 16px",cursor:"pointer"}}>
              <Avatar src={p.foto} name={p.n} size={48}/>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontWeight:700,fontSize:15,color:"var(--text)",display:"inline-flex",alignItems:"center",gap:6}}>{p.n}<Icon name="chevron-right" size={15}/></div>
                <div style={{display:"flex",alignItems:"center",gap:8,marginTop:5,flexWrap:"wrap"}}>
                  <span style={{fontSize:13,color:"var(--text-2)",display:"inline-flex",alignItems:"center",gap:5}}><Icon name="phone" size={13}/>{p.tel}</span>
                  <Tag color={mjcColor(p.mjc)}>{p.mjc}</Tag>
                </div>
              </div>
              <StatusDot active={p.ativo}/>
            </div>
          ))}
        </div>
      </Card>

      {/* Quantidade por equipe do MJC */}
      <Card title="Pessoas por equipe do MJC">
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          {MJC_TEAMS.map(t=>(
            <div key={t} onClick={()=>onOpenTeam&&onOpenTeam(t)} title={"Ver jovens da equipe "+t} style={{display:"flex",alignItems:"center",gap:12,background:"var(--surface-2)",borderRadius:"var(--r-md)",padding:"11px 14px",cursor:"pointer"}}>
              <span style={{width:38,height:38,borderRadius:99,background:MJC_COLOR[t],color:"#fff",display:"inline-flex",alignItems:"center",justifyContent:"center"}}><Icon name={MJC_ICON[t]} size={18}/></span>
              <div style={{flex:1,fontWeight:600,fontSize:15}}>{t}</div>
              <span style={{fontWeight:800,fontSize:20,letterSpacing:"-.02em"}}>{counts[t]}</span>
              <Icon name="chevron-right" size={16}/>
            </div>
          ))}
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"8px 6px 0",borderTop:"1px solid var(--hairline)",marginTop:4}}>
            <span style={{fontSize:13,color:"var(--text-2)",fontWeight:600}}>Total ativos</span>
            <span style={{fontWeight:800,fontSize:18}}>{totalAtivos}</span>
          </div>
        </div>
      </Card>
    </div>
  </div>;
}

/* ======================================================================
   JOVENS (tabela)
   ====================================================================== */
function PeopleTable({ rows, onNovo, kind="jovem", onOpenPerson, teamFilter, onClearTeam }){
  const [q,setQ]=useState("");
  const team = teamFilter||null;
  const list=rows.filter(r=>r.n.toLowerCase().includes(q.toLowerCase()) && (!team || r.mjc===team));
  const cols = kind==="jovem"
    ? ["","Nome","Telefone","Equipe do MJC","EJC que fez","Status"]
    : ["","Casal","Telefone","Vínculo","Endereço","Status"];
  return <Card pad="0" style={{overflow:"hidden"}}>
    <div style={{display:"flex",alignItems:"center",gap:12,padding:"16px 18px",flexWrap:"wrap"}}>
      <SearchInput placeholder={kind==="jovem"?"Buscar jovem...":"Buscar casal..."} value={q} onChange={setQ} maxWidth={340}/>
      {kind==="jovem" && team
        ? <button onClick={onClearTeam} title="Limpar filtro" style={{display:"inline-flex",alignItems:"center",gap:8,border:"none",cursor:"pointer",fontFamily:"var(--font-sans)",fontSize:14,fontWeight:600,padding:"9px 14px",borderRadius:"var(--r-pill)",background:"var(--brand-brown)",color:"var(--on-brand)",boxShadow:"var(--shadow-sm)"}}><span style={{color:"var(--brand-yellow-soft)",fontWeight:500}}>Equipe:</span> {team} <Icon name="x" size={15}/></button>
        : <Select label="Equipe" value="Todas"/>}
      <Select label="Status" value="Todos"/>
      <div style={{marginLeft:"auto"}}>
        <Button variant="primary" iconLeft={<Icon name="user-plus" size={18}/>} onClick={onNovo}>{kind==="jovem"?"Adicionar jovem":"Adicionar casal"}</Button>
      </div>
    </div>
    <div style={{overflowX:"auto"}}>
      <table style={{width:"100%",borderCollapse:"collapse",fontSize:14}}>
        <thead>
          <tr style={{textAlign:"left"}}>
            {cols.map((c,i)=><th key={i} style={{padding:"12px 18px",fontSize:12,fontWeight:700,color:"var(--text-3)",textTransform:"uppercase",letterSpacing:".04em",background:"var(--surface-2)",whiteSpace:"nowrap"}}>{c}</th>)}
            <th style={{background:"var(--surface-2)"}}></th>
          </tr>
        </thead>
        <tbody>
          {list.map((r,i)=>(
            <tr key={i} style={{borderBottom:"1px solid var(--hairline)"}}>
              <td style={{padding:"10px 18px"}}><Avatar src={r.foto} name={r.n} size={38}/></td>
              <td style={{padding:"10px 18px",fontWeight:600,whiteSpace:"nowrap"}}>
                <button onClick={()=>onOpenPerson&&onOpenPerson(r)} title="Ver ficha completa" style={{border:"none",background:"transparent",cursor:"pointer",font:"inherit",fontWeight:600,color:"var(--brand-brown)",padding:0,display:"inline-flex",alignItems:"center",gap:5}}>{r.n}</button>
              </td>
              <td style={{padding:"10px 18px",color:"var(--text-2)",whiteSpace:"nowrap"}}>{r.tel}</td>
              <td style={{padding:"10px 18px"}}>{kind==="jovem"?<Tag color={mjcColor(r.mjc)}>{r.mjc}</Tag>:<span style={{color:"var(--text-2)"}}>{r.ejc}</span>}</td>
              <td style={{padding:"10px 18px",color:"var(--text-2)",whiteSpace:"nowrap",maxWidth:220,overflow:"hidden",textOverflow:"ellipsis"}}>{kind==="jovem"?r.ejc:r.end}</td>
              <td style={{padding:"10px 18px"}}><StatusDot active={r.ativo}/></td>
              <td style={{padding:"10px 18px"}}><IconButton label="Ver ficha" size={34} variant="soft" onClick={()=>onOpenPerson&&onOpenPerson(r)}><Icon name="chevron-right" size={16}/></IconButton></td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
    {list.length===0 && <div style={{padding:"40px",textAlign:"center",color:"var(--text-3)"}}>{q?('Nenhum resultado para "'+q+'".'):team?("Ninguém na equipe "+team+" ainda."):"Nenhum cadastro ainda."}</div>}
  </Card>;
}
function Jovens({ onNovo, onOpenPerson, teamFilter, onClearTeam }){
  const { jovens } = useStore();
  const sub = teamFilter
    ? jovens.filter(j=>j.mjc===teamFilter).length+" jovens na equipe "+teamFilter
    : jovens.length+" jovens cadastrados";
  return <div>
    <Header title="Jovens" sub={sub}/>
    <PeopleTable rows={jovens} onNovo={onNovo} kind="jovem" onOpenPerson={onOpenPerson} teamFilter={teamFilter} onClearTeam={onClearTeam}/>
  </div>;
}
function Tios({ onNovo, onOpenPerson }){
  const { tios } = useStore();
  return <div>
    <Header title="Tios" sub={tios.length+" casais cadastrados"}/>
    <PeopleTable rows={tios} onNovo={onNovo} kind="tio" onOpenPerson={onOpenPerson}/>
  </div>;
}

/* ======================================================================
   MONTAGEM
   ====================================================================== */
// estrutura de linhas da planilha — varia por equipe. "casal" = 2 linhas (as duas pessoas do casal).
// "flex" = seção com adicionar/remover livre até `count` pessoas (equipes comuns).
const COORD_JOVENS={label:"Jovens coordenadores",count:2,tone:"var(--brand-brown)",kind:"jovem"};
const CASAL_COORD={label:"Casal de tios coordenadores",count:2,tone:"var(--cat-plum)",kind:"casal"};
const TEAM_STRUCTS={
  "Coordenação Geral":[
    COORD_JOVENS,
    CASAL_COORD,
  ],
  "Sala":[
    COORD_JOVENS,
    CASAL_COORD,
    {label:"Casal de animadores",count:2,tone:"var(--cat-terracotta)",kind:"casal"},
    {label:"Casal mini bar",count:2,tone:"var(--cat-olive)",kind:"casal"},
    {label:"Casal boa vontade",count:2,tone:"var(--cat-blue)",kind:"casal"},
    {label:"Músicos",count:3,tone:"var(--cat-plum)",kind:"jovem"},
  ],
  "Compras":[
    COORD_JOVENS,
    CASAL_COORD,
    {label:"Equipe",count:4,tone:"var(--cat-blue)",kind:"jovem"},
  ],
};
// equipes comuns: coordenação + tios apoio + equipe livre de até 30 pessoas
const DEFAULT_STRUCT=[
  COORD_JOVENS,
  CASAL_COORD,
  {label:"Tios apoio",count:3,tone:"var(--cat-terracotta)",kind:"casal"},
  {label:"Equipe",count:30,tone:"var(--cat-blue)",kind:"jovem",flex:true},
];
const estruturaDaEquipe = tab => TEAM_STRUCTS[tab] || DEFAULT_STRUCT;

function AddPersonCell({ pool, onPick }){
  const [open,setOpen]=useState(false);
  const [q,setQ]=useState("");
  const results=pool.filter(p=>p.n.toLowerCase().includes(q.toLowerCase())).slice(0,5);
  if(!open) return <button onClick={()=>setOpen(true)} style={{display:"inline-flex",alignItems:"center",gap:7,background:"transparent",border:"none",cursor:"pointer",color:"var(--brand-brown)",fontWeight:600,fontSize:13,fontFamily:"var(--font-sans)",padding:"6px 4px"}}><Icon name="plus" size={15}/>Adicionar pessoa</button>;
  return <div style={{position:"relative",minWidth:220}}>
    <div style={{display:"flex",alignItems:"center",gap:8,background:"var(--surface)",borderRadius:99,padding:"7px 12px",boxShadow:"var(--shadow-sm)"}}>
      <Icon name="search" size={15}/>
      <input autoFocus value={q} onChange={e=>setQ(e.target.value)} placeholder="Escreva o nome..." onBlur={()=>setTimeout(()=>setOpen(false),150)} style={{border:"none",outline:"none",background:"transparent",flex:1,fontFamily:"var(--font-sans)",fontSize:13}}/>
    </div>
    {q && <div style={{position:"absolute",top:"calc(100% + 6px)",left:0,right:0,background:"var(--surface)",borderRadius:"var(--r-md)",boxShadow:"var(--shadow-md)",zIndex:20,overflow:"hidden"}}>
      {results.length?results.map((p,i)=>(
        <div key={i} onMouseDown={()=>onPick(p)} style={{display:"flex",alignItems:"center",gap:10,padding:"9px 12px",cursor:"pointer"}} onMouseEnter={e=>e.currentTarget.style.background="var(--surface-2)"} onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
          <Avatar src={p.foto} name={p.n} size={30}/><span style={{fontSize:13,fontWeight:600}}>{p.n}</span>
        </div>
      )):<div style={{padding:"12px",fontSize:13,color:"var(--text-3)"}}>Ninguém encontrado.</div>}
    </div>}
  </div>;
}

function MontagemSheet({ montagem, onBack }){
  const { jovens, setMontagemCell } = useStore();
  const [tab,setTab]=useState(MONTAGEM_TABS[0]);
  const setPerson=(rowKey,person)=>setMontagemCell(montagem.id,tab,rowKey,person);
  const teamData=(montagem.cells&&montagem.cells[tab])||{};
  const pool=jovens; // pool de busca (jovens)
  const sections=estruturaDaEquipe(tab);

  // equipes (abas) em que a pessoa já está, exceto a aba atual — pra avisar de duplicidade
  const equipesDaPessoa=(personId)=>{
    if(!personId||!montagem.cells) return [];
    return MONTAGEM_TABS.filter(t=>t!==tab).filter(t=>Object.values(montagem.cells[t]||{}).some(p=>p&&p.id===personId));
  };

  let rowIdx=0;
  const filledRow=(rowKey,person)=>{
    rowIdx++;
    const outras=equipesDaPessoa(person.id);
    const alerta=outras.length>0;
    return <tr key={rowKey} style={{borderBottom:"1px solid var(--hairline)",background:alerta?"color-mix(in oklch, var(--danger-soft) 45%, transparent)":"transparent"}}>
      <td style={{padding:"8px 14px",color:"var(--text-3)",fontWeight:700}}>{rowIdx}</td>
      <td style={{padding:"8px 14px"}}><Avatar src={person.foto} name={person.n} size={34}/></td>
      <td style={{padding:"8px 14px",whiteSpace:"nowrap"}}>
        <div style={{display:"inline-flex",flexDirection:"column",gap:3,...(alerta?{border:"2px solid var(--brand-red)",borderRadius:"var(--r-sm)",padding:"4px 9px"}:{})}}>
          <span style={{fontWeight:600}}>{person.n}</span>
          {alerta && <span style={{fontSize:11,color:"var(--brand-red)",fontWeight:700,display:"inline-flex",alignItems:"center",gap:4}}><Icon name="alert-triangle" size={12}/>Já está em: {outras.join(", ")}</span>}
        </div>
      </td>
      <td style={{padding:"8px 14px",color:"var(--text-2)",whiteSpace:"nowrap"}}>{person.tel}</td>
      <td style={{padding:"8px 14px",color:"var(--text-2)",whiteSpace:"nowrap"}}>{person.ejc}</td>
      <td style={{padding:"8px 14px",color:"var(--text-2)",maxWidth:220,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{person.end}</td>
      <td style={{padding:"8px 14px"}}>{person.inst?<Tag color="var(--cat-plum)">{person.inst}</Tag>:<span style={{color:"var(--text-3)"}}>—</span>}</td>
      <td style={{padding:"8px 14px",textAlign:"right"}}><IconButton label="Remover da equipe" size={30} variant="soft" onClick={()=>setPerson(rowKey,null)}><Icon name="x" size={15}/></IconButton></td>
    </tr>;
  };
  const addRow=(rowKey)=>{
    rowIdx++;
    return <tr key={rowKey} style={{borderBottom:"1px solid var(--hairline)"}}>
      <td style={{padding:"8px 14px",color:"var(--text-3)",fontWeight:700}}>{rowIdx}</td>
      <td colSpan={7} style={{padding:"8px 14px"}}><AddPersonCell pool={pool} onPick={p=>setPerson(rowKey,p)}/></td>
    </tr>;
  };

  return <div>
    <Header title={montagem.nome}
      sub={"Responsável: "+montagem.autor+" · "+montagem.visib}
      right={<Button variant="secondary" iconLeft={<Icon name="arrow-left" size={16}/>} onClick={onBack}>Voltar às montagens</Button>}/>

    {/* Abas de equipes (estilo Excel) */}
    <div style={{display:"flex",gap:6,overflowX:"auto",paddingBottom:10,marginBottom:14}}>
      {MONTAGEM_TABS.map(t=>{const active=t===tab;return(
        <button key={t} onClick={()=>setTab(t)} style={{whiteSpace:"nowrap",border:"none",cursor:"pointer",fontFamily:"var(--font-sans)",fontSize:13,fontWeight:active?700:500,padding:"9px 15px",borderRadius:"var(--r-sm) var(--r-sm) 0 0",background:active?"var(--surface)":"var(--surface-2)",color:active?"var(--brand-brown)":"var(--text-2)",boxShadow:active?"var(--shadow-sm)":"none",borderBottom:active?"3px solid var(--brand-brown)":"3px solid transparent"}}>{t}</button>
      );})}
    </div>

    <Card pad="0" style={{overflow:"hidden"}}>
      <div style={{overflowX:"auto"}}>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:13,minWidth:900}}>
          <thead>
            <tr>
              {["#","Foto","Nome","Telefone","EJC que fez","Endereço","Instrumento",""].map((c,i)=>(
                <th key={i} style={{padding:"11px 14px",textAlign:"left",fontSize:11,fontWeight:700,color:"var(--text-3)",textTransform:"uppercase",letterSpacing:".04em",background:"var(--surface-2)",whiteSpace:"nowrap"}}>{c}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {sections.map((sec)=>{
              // linhas preenchidas dessa seção (chaves "<label>-<i>")
              const filledKeys=Object.keys(teamData).filter(k=>k.startsWith(sec.label+"-")&&teamData[k]).sort((a,b)=>(+a.split("-").pop())-(+b.split("-").pop()));
              return <React.Fragment key={sec.label}>
                <tr><td colSpan={8} style={{padding:"10px 14px",background:"var(--surface-2)"}}>
                  <span style={{display:"inline-flex",alignItems:"center",gap:8,fontSize:12,fontWeight:700,color:sec.tone,textTransform:"uppercase",letterSpacing:".04em"}}>
                    <span style={{width:8,height:8,borderRadius:"50%",background:sec.tone}}/>{sec.label}
                    {sec.flex && <span style={{color:"var(--text-3)",fontWeight:600,textTransform:"none",letterSpacing:0}}>· {filledKeys.length}/{sec.count}</span>}
                  </span>
                </td></tr>
                {sec.flex
                  ? <>
                      {filledKeys.map(k=>filledRow(k,teamData[k]))}
                      {filledKeys.length<sec.count && addRow(sec.label+"-"+(filledKeys.length?(+filledKeys[filledKeys.length-1].split("-").pop())+1:0))}
                    </>
                  : Array.from({length:sec.count}).map((_,k)=>{
                      const rowKey=sec.label+"-"+k;
                      const person=teamData[rowKey];
                      return person?filledRow(rowKey,person):addRow(rowKey);
                    })}
              </React.Fragment>;
            })}
          </tbody>
        </table>
      </div>
    </Card>
    <p style={{fontSize:12,color:"var(--text-3)",marginTop:12,display:"flex",alignItems:"center",gap:6}}>
      <Icon name="alert-triangle" size={14}/>Se alguém já estiver em outra equipe, o nome fica destacado em vermelho com o aviso. Use o × pra remover da equipe. A planilha começa zerada.
    </p>
  </div>;
}

function NovaMontagemModal({ onClose, onCreate }){
  const [nome,setNome]=useState("");
  const [autor,setAutor]=useState("");
  const [visib,setVisib]=useState("Todos com acesso");
  return <div style={{position:"fixed",inset:0,background:"rgba(42,36,31,.32)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:50}} onClick={onClose}>
    <div onClick={e=>e.stopPropagation()} style={{width:440,maxWidth:"92vw",background:"var(--surface)",borderRadius:"var(--r-xl)",boxShadow:"var(--shadow-lg)",padding:"26px"}}>
      <h3 style={{margin:"0 0 4px",fontSize:20,fontWeight:800}}>Fazer montagem</h3>
      <p style={{margin:"0 0 20px",fontSize:14,color:"var(--text-2)"}}>Crie uma nova montagem para organizar as equipes.</p>
      <label style={{display:"block",fontSize:13,fontWeight:600,marginBottom:6}}>Nome da montagem</label>
      <input autoFocus value={nome} onChange={e=>setNome(e.target.value)} placeholder="Ex: Montagem XXXI EJC (2026)" style={{width:"100%",border:"none",background:"var(--surface-2)",borderRadius:"var(--r-md)",padding:"12px 14px",fontSize:14,fontFamily:"var(--font-sans)",outline:"none",marginBottom:16}}/>
      <label style={{display:"block",fontSize:13,fontWeight:600,marginBottom:6}}>Responsável pela criação</label>
      <input value={autor} onChange={e=>setAutor(e.target.value)} placeholder="Seu nome" style={{width:"100%",border:"none",background:"var(--surface-2)",borderRadius:"var(--r-md)",padding:"12px 14px",fontSize:14,fontFamily:"var(--font-sans)",outline:"none",marginBottom:16}}/>
      <label style={{display:"block",fontSize:13,fontWeight:600,marginBottom:8}}>Quem pode visualizar</label>
      <div style={{display:"flex",gap:8,marginBottom:24}}>
        {["Todos com acesso","Só o proprietário"].map(o=>(
          <button key={o} onClick={()=>setVisib(o)} style={{flex:1,border:"none",cursor:"pointer",fontFamily:"var(--font-sans)",fontSize:13,fontWeight:600,padding:"11px",borderRadius:"var(--r-md)",background:visib===o?"var(--brand-brown)":"var(--surface-2)",color:visib===o?"var(--on-brand)":"var(--text-2)"}}>{o}</button>
        ))}
      </div>
      <div style={{display:"flex",gap:10,justifyContent:"flex-end"}}>
        <Button variant="ghost" onClick={onClose}>Cancelar</Button>
        <Button variant="primary" onClick={()=>onCreate({nome:nome||"Nova montagem",autor:autor||"Você",visib})} iconLeft={<Icon name="check" size={16}/>}>Criar montagem</Button>
      </div>
    </div>
  </div>;
}

function Montagem(){
  const { montagens, addMontagem } = useStore();
  const [openId,setOpenId]=useState(null); // id da montagem aberta
  const [modal,setModal]=useState(false);
  const openMont = montagens.find(m=>m.id===openId);

  if(openMont) return <MontagemSheet montagem={openMont} onBack={()=>setOpenId(null)}/>;

  const countFilled = m => Object.values(m.cells||{}).reduce((s,tab)=>s+Object.keys(tab).length,0);

  return <div>
    <Header title="Montagem" sub="Organize as equipes de cada encontro"/>
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(220px,1fr))",gap:16}}>
      {/* Card "Fazer montagem" sempre primeiro */}
      <button onClick={()=>setModal(true)} style={{textAlign:"left",cursor:"pointer",border:"2px dashed var(--brand-brown-soft)",background:"var(--surface-2)",borderRadius:"var(--r-lg)",padding:"22px",minHeight:150,display:"flex",flexDirection:"column",justifyContent:"space-between",fontFamily:"var(--font-sans)"}}>
        <span style={{width:46,height:46,borderRadius:99,background:"var(--brand-brown)",color:"var(--on-brand)",display:"inline-flex",alignItems:"center",justifyContent:"center"}}><Icon name="plus" size={22}/></span>
        <div><div style={{fontSize:16,fontWeight:700,color:"var(--brand-brown)"}}>Fazer montagem</div><div style={{fontSize:13,color:"var(--text-2)",marginTop:2}}>Criar nova organização de equipes</div></div>
      </button>
      {montagens.map((m)=>{const n=countFilled(m);return(
        <button key={m.id} onClick={()=>setOpenId(m.id)} style={{textAlign:"left",cursor:"pointer",border:"none",background:"var(--surface)",borderRadius:"var(--r-lg)",padding:"22px",minHeight:150,boxShadow:"var(--shadow-sm)",display:"flex",flexDirection:"column",justifyContent:"space-between",fontFamily:"var(--font-sans)"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
            <span style={{width:46,height:46,borderRadius:99,background:"var(--cat-terracotta)",color:"#fff",display:"inline-flex",alignItems:"center",justifyContent:"center"}}><Icon name="layout-grid" size={20}/></span>
            <Badge tone={m.visib==="Só o proprietário"?"neutral":"success"} dot>{m.visib==="Só o proprietário"?"Privada":"Compartilhada"}</Badge>
          </div>
          <div><div style={{fontSize:16,fontWeight:700,color:"var(--text)"}}>{m.nome}</div><div style={{fontSize:13,color:"var(--text-2)",marginTop:2}}>por {m.autor}{n>0?" · "+n+" alocados":""}</div></div>
        </button>
      );})}
    </div>
    {modal && <NovaMontagemModal onClose={()=>setModal(false)} onCreate={async m=>{const nm=await addMontagem(m);setModal(false);if(nm)setOpenId(nm.id);}}/>}
  </div>;
}

function InfoRow({ label, value, full }){
  if(value==null||value===""||(Array.isArray(value)&&value.length===0)) return null;
  return <div style={{gridColumn:full?"1 / -1":"auto"}}>
    <div style={{fontSize:11,fontWeight:700,color:"var(--text-3)",textTransform:"uppercase",letterSpacing:".04em",marginBottom:4}}>{label}</div>
    <div style={{fontSize:15,color:"var(--text)",fontWeight:500}}>{value}</div>
  </div>;
}
function ReadChips({ items, tone="brand" }){
  const arr=[].concat(items||[]).filter(Boolean);
  if(!arr.length) return null;
  return <div style={{display:"flex",flexWrap:"wrap",gap:8}}>{arr.map((x,i)=><Badge key={i} tone={tone}>{x}</Badge>)}</div>;
}
const rowGrid={display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(220px,1fr))",gap:"18px 20px"};

function PersonDetail({ person, onClose, onEdit }){

  const f=person.ficha; // ficha completa (quando cadastrado pelo formulário)
  const isTio=person.mjc===undefined;

      <div style={{maxWidth:820,margin:"0 auto",padding:"16px 22px",display:"flex",alignItems:"center",gap:14}}>

function PersonDetailBody({ person }){
  const f=person.ficha;
  const isTio=person.mjc===undefined;
  return <>
      {/* Cabeçalho com avatar e contatos */}
      <Card style={{marginBottom:18}}>
        <div style={{display:"flex",alignItems:"center",gap:18,flexWrap:"wrap"}}>
          <Avatar src={person.foto} name={person.n} size={72}/>
          <div style={{flex:1,minWidth:200}}>
            <div style={{fontSize:20,fontWeight:800,letterSpacing:"-.01em"}}>{person.n}</div>
            <div style={{display:"flex",alignItems:"center",gap:8,marginTop:8,flexWrap:"wrap"}}>
              {!isTio && person.mjc && person.mjc!=="—" && <Tag color={mjcColor(person.mjc)}>{person.mjc}</Tag>}
              {person.ejc && person.ejc!=="—" && <span style={{fontSize:13,color:"var(--text-2)"}}>{person.ejc}</span>}
            </div>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:6,fontSize:14,color:"var(--text-2)"}}>

/* ---- máscaras e validação ---- */
const onlyDigits = s => (s||"").replace(/\D/g,"");
function maskCPF(v){
  const d=onlyDigits(v).slice(0,11);
  if(d.length>9) return `${d.slice(0,3)}.${d.slice(3,6)}.${d.slice(6,9)}-${d.slice(9)}`;
  if(d.length>6) return `${d.slice(0,3)}.${d.slice(3,6)}.${d.slice(6)}`;
  if(d.length>3) return `${d.slice(0,3)}.${d.slice(3)}`;
  return d;
}
function maskTelefone(v){
  const d=onlyDigits(v).slice(0,11);
  if(!d) return "";
  if(d.length<=2) return `(${d}`;
  if(d.length<=6) return `(${d.slice(0,2)}) ${d.slice(2)}`;
  if(d.length<=10) return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;
  return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;
}
function maskInstagram(v){
  let s=(v||"").trim().replace(/\s+/g,"");
  if(!s) return "";
  s=s.replace(/^@+/,"");
  return s?("@"+s):"";
}
// data em formato BR: DD/MM/AAAA
function maskData(v){
  const d=onlyDigits(v).slice(0,8);
  if(d.length<=2) return d;
  if(d.length<=4) return `${d.slice(0,2)}/${d.slice(2)}`;
  return `${d.slice(0,2)}/${d.slice(2,4)}/${d.slice(4)}`;
}
// aceita vazio (opcional) ou uma data DD/MM/AAAA plausível
const validaData = v => {
  const s=(v||"").trim();
  if(!s) return true;
  const m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(s);
  if(!m) return false;
  const dia=+m[1], mes=+m[2], ano=+m[3];
  return dia>=1&&dia<=31&&mes>=1&&mes<=12&&ano>=1900&&ano<=2100;
};
function validaCPF(cpf){
  const d=onlyDigits(cpf);
  if(d.length!==11 || /^(\d)\1{10}$/.test(d)) return false;
  let s=0; for(let i=0;i<9;i++) s+=parseInt(d[i])*(10-i);
  let r=(s*10)%11; if(r===10) r=0; if(r!==parseInt(d[9])) return false;
  s=0; for(let i=0;i<10;i++) s+=parseInt(d[i])*(11-i);
  r=(s*10)%11; if(r===10) r=0; return r===parseInt(d[10]);
}
const validaEmail = e => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test((e||"").trim());
const validaTelefone = t => { const d=onlyDigits(t); return d.length===10||d.length===11; };

// redimensiona a imagem no navegador (lado maior = 480px) antes de enviar — poupa dados no celular
function resizeImagem(file){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    const url=URL.createObjectURL(file);
    img.onload=()=>{
      const max=480;
      let {width:w,height:h}=img;
      if(w>h && w>max){ h=Math.round(h*max/w); w=max; } else if(h>=w && h>max){ w=Math.round(w*max/h); h=max; }
      const canvas=document.createElement("canvas");
      canvas.width=w; canvas.height=h;
      canvas.getContext("2d").drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      canvas.toBlob(blob=>blob?resolve(blob):reject(new Error("Não foi possível processar a imagem.")),"image/jpeg",0.85);
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); reject(new Error("Arquivo de imagem inválido.")); };
    img.src=url;
  });
}
// envia a foto pro Supabase Storage e devolve a URL pública
async function enviarFoto(file){
  const blob=await resizeImagem(file);
  const path=uid()+".jpg";
  const { error } = await supabase.storage.from("fotos").upload(path, blob, { contentType:"image/jpeg", upsert:true });
  if(error) throw error;
  const { data } = supabase.storage.from("fotos").getPublicUrl(path);
  return data.publicUrl;
}
function PhotoUpload({ value, onChange, name }){
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState("");
  const inputRef=useRef(null);
  const escolher=async e=>{
    const file=e.target.files&&e.target.files[0];
    e.target.value="";
    if(!file) return;
    if(!/^image\//.test(file.type)){ setErr("Escolha um arquivo de imagem."); return; }
    setErr(""); setBusy(true);
    try{ const url=await enviarFoto(file); onChange(url); }
    catch(err){ setErr("Não foi possível enviar a foto. Tenta de novo."); }
    setBusy(false);
  };
  return <div style={{display:"flex",alignItems:"center",gap:16,flexWrap:"wrap"}}>
    <span style={{position:"relative",width:84,height:84,flex:"0 0 auto"}}>

function FichaForm({ onClose, onSave, initial, overline, title, saveLabel, selfId }){

  const [foraNew,setForaNew]=useState("");

  const dupCpfMsg = cpfOwner ? ("Este CPF já está cadastrado — "+cpfOwner.n+".") : null;
  const dupEmailMsg = emailOwner ? ("Este e-mail já está cadastrado — "+emailOwner.n+".") : null;

  const [busy,setBusy]=useState(false);
  const handleSave=async ()=>{
    const errs={};
    if(!f.nome || !f.nome.trim()) errs.nome="Informe o nome completo.";
    if(!f.whats) errs.whats="Informe o WhatsApp.";
    else if(!validaTelefone(f.whats)) errs.whats="WhatsApp inválido — use (DD) e 8 ou 9 dígitos.";
    if(f.nasc && !validaData(f.nasc)) errs.nasc="Data inválida — use DD/MM/AAAA.";
    if(!f.cpf) errs.cpf="Informe o CPF.";
    else if(!validaCPF(f.cpf)) errs.cpf="CPF inválido.";
    else if(dupCpfMsg) errs.cpf=dupCpfMsg;
    if(f.email && !validaEmail(f.email)) errs.email="E-mail inválido.";
    else if(dupEmailMsg) errs.email=dupEmailMsg;
    if(!f.paiFalecido && f.paiTel && !validaTelefone(f.paiTel)) errs.paiTel="Telefone inválido.";
    if(!f.maeFalecida && f.maeTel && !validaTelefone(f.maeTel)) errs.maeTel="Telefone inválido.";

      setTimeout(()=>{ const el=document.querySelector(".has-error"); if(el) el.scrollIntoView({behavior:"smooth",block:"center"}); },30);
      return;

    if(busy) return;
    setBusy(true);

    setBusy(false);

// anos em que a pessoa PODE ter servido: só depois do próprio EJC (nunca antes/no mesmo ano)
const anosDepoisDoEjc = anoEjcStr => { const a=anoDoEjc(anoEjcStr); return a ? EJC_YEARS.filter(y=>anoDoEjc(y)>a) : []; };

// mostra uma linha por ano disponível; em cada ano a pessoa escolhe a equipe (dropdown) e se foi coordenador
function EquipesPorAno({ value, onChange, years, needsYear }){
  const byAno={}; (value||[]).forEach(r=>{ byAno[r.ano]=r; });
  const setEq=(ano,eq)=>{
    let next=(value||[]).filter(r=>r.ano!==ano);
    if(eq) next=[...next,{ano,eq,coord:byAno[ano]?byAno[ano].coord:false}];
    next.sort((a,b)=>anoDoEjc(b.ano)-anoDoEjc(a.ano));
    onChange(next);
  };
  const setCoord=(ano,coord)=>onChange((value||[]).map(r=>r.ano===ano?{...r,coord}:r));
  if(needsYear) return <p style={{fontSize:13,color:"var(--text-3)"}}>Selecione primeiro o ano em que você fez o EJC.</p>;
  if(!years.length) return <p style={{fontSize:13,color:"var(--text-3)"}}>Ainda não houve nenhum EJC depois do seu.</p>;
  const selStyle={border:"none",background:"var(--surface)",borderRadius:"var(--r-sm)",padding:"9px 10px",fontSize:13,fontFamily:"var(--font-sans)",color:"var(--text)",outline:"none",width:"100%"};
  return <div style={{display:"flex",flexDirection:"column",gap:8}}>
    {years.map(y=>{
      const cur=byAno[y];
      return <div key={y} style={{display:"flex",gap:10,flexWrap:"wrap",alignItems:"center",background:"var(--surface-2)",borderRadius:"var(--r-md)",padding:"8px 12px"}}>
        <span style={{flex:"0 0 auto",minWidth:120,fontSize:13,fontWeight:700,color:cur?"var(--brand-brown)":"var(--text-2)"}}>{y}</span>
        <div style={{flex:"1 1 180px",minWidth:150}}>
          <select value={cur?cur.eq:""} onChange={e=>setEq(y,e.target.value)} style={selStyle}>
            <option value="">Não servi neste ano</option>
            {EJC_TEAMS_ALL.map(t=><option key={t}>{t}</option>)}
          </select>
        </div>
        <label style={{flex:"0 0 auto",display:"inline-flex",alignItems:"center",gap:7,fontSize:13,color:"var(--text-2)",cursor:cur?"pointer":"not-allowed",opacity:cur?1:.4}}>
          <input type="checkbox" checked={cur?!!cur.coord:false} disabled={!cur} onChange={e=>setCoord(y,e.target.checked)}/> Coordenador
        </label>
      </div>;
    })}
  </div>;
}

function CondicaoConfig({ campo, anteriores, onChange }){
  const [open,setOpen]=useState(false);
  const cond=campo.cond;
  const candidatos=anteriores.filter(c=>c.type==="simnao"||c.type==="unica"||c.type==="multipla");
  // ao abrir sem condição definida, já inicializa com o padrão exibido
  useEffect(()=>{
    if(open && !cond && candidatos.length){
      onChange({key:candidatos[0].key, value:valoresDoTipo(candidatos[0])[0]});
    }
  },[open]);
  if(cond && !open){
    const ref=anteriores.find(c=>c.key===cond.key);
    return <div style={{display:"inline-flex",alignItems:"center",gap:8,background:"var(--brand-yellow-soft)",color:"var(--on-yellow)",borderRadius:"var(--r-pill)",padding:"5px 6px 5px 12px",fontSize:12,fontWeight:600}}>
      <Icon name="git-branch" size={13}/>Só se “{ref?ref.label:"?"}” = {cond.value}
      <button onClick={()=>setOpen(true)} title="Editar" style={{border:"none",background:"transparent",cursor:"pointer",color:"inherit",display:"inline-flex"}}><Icon name="pencil" size={13}/></button>
      <button onClick={()=>onChange(null)} title="Remover condição" style={{border:"none",background:"transparent",cursor:"pointer",color:"inherit",display:"inline-flex"}}><Icon name="x" size={14}/></button>
    </div>;
  }
  if(!open){
    if(candidatos.length===0) return null;
    return <button onClick={()=>setOpen(true)} style={{display:"inline-flex",alignItems:"center",gap:6,border:"none",background:"transparent",cursor:"pointer",color:"var(--text-2)",fontFamily:"var(--font-sans)",fontSize:12,fontWeight:600}}><Icon name="git-branch" size={13}/>Condicional</button>;
  }
  const refKey=(cond&&cond.key)||(candidatos[0]&&candidatos[0].key)||"";
  const refCampo=candidatos.find(c=>c.key===refKey);
  const vals=valoresDoTipo(refCampo);
  return <div style={{display:"flex",flexWrap:"wrap",alignItems:"center",gap:8,background:"var(--surface)",borderRadius:"var(--r-md)",padding:"8px 10px",boxShadow:"var(--shadow-xs)"}}>
    <span style={{fontSize:12,color:"var(--text-2)",fontWeight:600}}>Mostrar só se</span>
    <select value={refKey} onChange={e=>onChange({key:e.target.value,value:valoresDoTipo(candidatos.find(c=>c.key===e.target.value))[0]})} style={{border:"none",background:"var(--surface-2)",borderRadius:"var(--r-sm)",padding:"7px 9px",fontSize:12,fontFamily:"var(--font-sans)",outline:"none"}}>
      {candidatos.map(c=><option key={c.key} value={c.key}>{c.label}</option>)}
    </select>
    <span style={{fontSize:12,color:"var(--text-2)",fontWeight:600}}>=</span>
    <select value={(cond&&cond.value)||vals[0]||""} onChange={e=>onChange({key:refKey,value:e.target.value})} style={{border:"none",background:"var(--surface-2)",borderRadius:"var(--r-sm)",padding:"7px 9px",fontSize:12,fontFamily:"var(--font-sans)",outline:"none"}}>
      {vals.map(v=><option key={v}>{v}</option>)}
    </select>
    <Button variant="ghost" onClick={()=>setOpen(false)}>Ok</Button>
  </div>;
}

function FormBuilder({ form, onClose, onSave }){
  useLucide();
  const sistema = form && form.sistema;
  const [nome,setNome]=useState(form?form.nome:"");
  const [campos,setCampos]=useState(form?form.campos:[]);
  const [paleta,setPaleta]=useState(false);

  const addCampo=(c)=>{ setCampos(l=>[...l,{key:uid(),id:c.id,label:c.label,type:c.type,opcoes:c.opcoes}]); setPaleta(false); };
  const removeCampo=(key)=>setCampos(l=>l.filter(c=>c.key!==key));
  const move=(i,dir)=>{ const j=i+dir; if(j<0||j>=campos.length)return; const arr=[...campos]; [arr[i],arr[j]]=[arr[j],arr[i]]; setCampos(arr); };
  const setCond=(key,cond)=>setCampos(l=>l.map(c=>c.key===key?{...c,cond:cond||undefined}:c));

  return <div style={{position:"fixed",inset:0,zIndex:60,background:"linear-gradient(180deg,var(--bg-top) 0%,var(--bg) 40%)",overflow:"auto"}}>
    <div style={{position:"sticky",top:0,zIndex:5,background:"color-mix(in oklch, var(--bg) 88%, transparent)",backdropFilter:"blur(8px)",borderBottom:"1px solid var(--hairline)"}}>

              <Button variant="secondary" iconLeft={<Icon name={f.sistema?"eye":"pencil"} size={15}/>} onClick={()=>setEditing(f)}>{f.sistema?"Visualizar":"Editar"}</Button>

function StatTile({ label, value, unit, icon, color }){
  return <div style={{background:"var(--surface)",borderRadius:"var(--r-lg)",padding:"var(--card-pad)",boxShadow:"var(--shadow-sm)",display:"flex",flexDirection:"column",gap:12}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
      <span style={{fontSize:13,fontWeight:500,color:"var(--text-2)"}}>{label}</span>
      <span style={{width:38,height:38,borderRadius:99,background:color,color:"#fff",display:"inline-flex",alignItems:"center",justifyContent:"center"}}><Icon name={icon} size={18}/></span>
    </div>
    <div style={{display:"flex",alignItems:"baseline",gap:6}}>
      <span style={{fontSize:34,fontWeight:800,letterSpacing:"-.02em",lineHeight:1}}>{value}</span>
      {unit&&<span style={{fontSize:15,fontWeight:600,color:"var(--text-3)"}}>{unit}</span>}
    </div>
  </div>;
}
function BarRow({ label, value, max, color, icon }){
  const pct = max>0 ? Math.round(value/max*100) : 0;
  return <div style={{display:"flex",alignItems:"center",gap:12}}>
    {icon && <span style={{width:34,height:34,borderRadius:99,background:color,color:"#fff",display:"inline-flex",alignItems:"center",justifyContent:"center",flex:"0 0 auto"}}><Icon name={icon} size={16}/></span>}
    <div style={{flex:1,minWidth:0}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:6,gap:10}}>
        <span style={{fontSize:14,fontWeight:600,color:"var(--text)",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{label}</span>
        <span style={{fontSize:15,fontWeight:800,color:"var(--text)",flex:"0 0 auto"}}>{value}</span>
      </div>
      <div style={{height:9,borderRadius:99,background:"var(--surface-3)",overflow:"hidden"}}>
        <div style={{width:pct+"%",height:"100%",borderRadius:99,background:color,transition:"width .3s"}}/>
      </div>
    </div>
  </div>;
}
const CAT_PALETTE=["var(--cat-terracotta)","var(--cat-plum)","var(--cat-blue)","var(--cat-olive)","var(--cat-brown)","var(--cat-yellow)","var(--cat-red)"];

function Relatorios(){
  const { jovens } = useStore();
  const ativos = jovens.filter(j=>j.ativo);
  const musicos = ativos.filter(j=>j.inst);
  // músicos por instrumento (inst pode ter vários separados por vírgula)
  const instCount={};
  musicos.forEach(m=>String(m.inst).split(/,\s*/).forEach(i=>{const k=i.trim();if(k)instCount[k]=(instCount[k]||0)+1;}));
  const instList=Object.entries(instCount).sort((a,b)=>b[1]-a[1]);
  const maxInst=Math.max(1,...instList.map(x=>x[1]));
  // pessoas ativas por equipe do MJC
  const teamList=MJC_TEAMS.map(t=>[t,ativos.filter(j=>j.mjc===t).length]);
  const maxTeam=Math.max(1,...teamList.map(x=>x[1]));

  return <div>
    <Header title="Relatórios" sub="Panorama dos músicos e das equipes do MJC"/>

    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:16,marginBottom:20}}>
      <StatTile label="Pessoas ativas" value={ativos.length} icon="users" color="var(--cat-blue)"/>
      <StatTile label="Músicos ativos" value={musicos.length} icon="music" color="var(--cat-plum)"/>
      <StatTile label="Instrumentos" value={instList.length} icon="guitar" color="var(--cat-terracotta)"/>
      <StatTile label="Equipes do MJC" value={MJC_TEAMS.length} icon="layout-grid" color="var(--cat-olive)"/>
    </div>

    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(300px,1fr))",gap:20,alignItems:"start"}}>
      <Card title="Músicos ativos por instrumento" subtitle={musicos.length+" músicos ativos"}>
        {instList.length===0
          ? <div style={{padding:"30px",textAlign:"center",color:"var(--text-3)",fontSize:14}}>Nenhum músico ativo cadastrado.</div>
          : <div style={{display:"flex",flexDirection:"column",gap:16}}>
              {instList.map(([inst,n],i)=><BarRow key={inst} label={inst} value={n} max={maxInst} color={CAT_PALETTE[i%CAT_PALETTE.length]} icon="music"/>)}
            </div>}
      </Card>

      <Card title="Pessoas ativas por equipe do MJC" subtitle={ativos.length+" pessoas ativas"}>
        <div style={{display:"flex",flexDirection:"column",gap:16}}>
          {teamList.map(([t,n])=><BarRow key={t} label={t} value={n} max={maxTeam} color={MJC_COLOR[t]} icon={MJC_ICON[t]}/>)}
        </div>
      </Card>
    </div>
  </div>;
}

// função do dirigente: uma equipe do MJC, "Tio dirigente" ou "Coordenação Geral"
const CARGOS_DIRIGENTE=["Coordenação Geral",...MJC_TEAMS,"Tio dirigente"];
const cargoColor = c => c==="Tio dirigente" ? "var(--cat-terracotta)" : c==="Coordenação Geral" ? "var(--brand-brown)" : mjcColor(c);
const cargoIcon = c => c==="Tio dirigente" ? "heart-handshake" : c==="Coordenação Geral" ? "shield-check" : (MJC_ICON[c]||"users");

function NovoDirigenteModal({ onClose, onCreate, initial }){
  const editing = !!initial;
  const [nome,setNome]=useState(initial?.nome||"");
  const [email,setEmail]=useState(initial?.email||"");
  const [cargo,setCargo]=useState(initial?.cargo||"");
  const [errs,setErrs]=useState({});
  const [busy,setBusy]=useState(false);
  const criar=async ()=>{
    const e={};
    if(!nome.trim()) e.nome="Informe o nome.";
    if(!validaEmail(email)) e.email="E-mail inválido.";
    if(!cargo) e.cargo="Escolha a função do dirigente.";
    setErrs(e);
    if(Object.keys(e).length) return;
    setBusy(true);
    const r=await onCreate({nome:nome.trim(),email:email.trim(),cargo});
    setBusy(false);
    if(r&&r.error) setErrs(x=>({...x,email:(r.error.message||"Não deu certo — confira o e-mail (pode já haver um convite pendente para ele).")}));
  };
  return <div style={{position:"fixed",inset:0,background:"rgba(42,36,31,.32)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:70}} onClick={onClose}>
    <div onClick={e=>e.stopPropagation()} style={{width:480,maxWidth:"92vw",background:"var(--surface)",borderRadius:"var(--r-xl)",boxShadow:"var(--shadow-lg)",padding:"26px",maxHeight:"88vh",overflow:"auto"}}>
      <h3 style={{margin:"0 0 4px",fontSize:20,fontWeight:800}}>{editing?"Corrigir convite":"Novo dirigente"}</h3>
      <p style={{margin:"0 0 16px",fontSize:14,color:"var(--text-2)"}}>{editing?"Confira os dados e reenviamos o link de acesso pro e-mail correto.":"O dirigente terá acesso completo à ferramenta."}</p>

      <div style={{display:"flex",gap:10,background:"var(--surface-2)",borderRadius:"var(--r-md)",padding:"12px 14px",marginBottom:18,fontSize:13,color:"var(--text-2)"}}>
        <Icon name="mail-check" size={16}/>
        <div>A pessoa recebe um e-mail com um link de acesso nesse endereço. Ao clicar, ela já entra como dirigente e é levada direto pra completar a própria ficha.</div>
      </div>

      <label style={{display:"block",fontSize:13,fontWeight:600,marginBottom:6}}>Nome</label>
      <Input value={nome} onChange={e=>{setNome(e.target.value);setErrs(x=>({...x,nome:null}));}} error={!!errs.nome} placeholder="Nome do dirigente"/>
      {errs.nome && <div style={{fontSize:12,color:"var(--brand-red)",marginTop:6,fontWeight:600}}>{errs.nome}</div>}
      <div style={{height:14}}/>
      <label style={{display:"block",fontSize:13,fontWeight:600,marginBottom:6}}>E-mail</label>
      <Input type="email" value={email} onChange={e=>{setEmail(e.target.value);setErrs(x=>({...x,email:null}));}} error={!!errs.email} placeholder="dirigente@email.com"/>
      {errs.email && <div style={{fontSize:12,color:"var(--brand-red)",marginTop:6,fontWeight:600}}>{errs.email}</div>}
      <div style={{height:16}}/>
      <label style={{display:"block",fontSize:13,fontWeight:600,marginBottom:8}}>Função <span style={{color:"var(--text-3)",fontWeight:500}}>· equipe do MJC ou tio dirigente</span></label>
      <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
        {CARGOS_DIRIGENTE.map(c=><button key={c} type="button" onClick={()=>{setCargo(c);setErrs(x=>({...x,cargo:null}));}} style={chipStyle(cargo===c)}>{c}</button>)}
      </div>
      {errs.cargo && <div style={{fontSize:12,color:"var(--brand-red)",marginTop:8,fontWeight:600}}>{errs.cargo}</div>}
      <div style={{display:"flex",gap:10,justifyContent:"flex-end",marginTop:24}}>
        <Button variant="ghost" onClick={onClose}>Cancelar</Button>
        <Button variant="primary" onClick={criar} disabled={busy} style={{opacity:busy?.7:1}} iconLeft={<Icon name="mail-check" size={16}/>}>{busy?"Enviando...":(editing?"Salvar e reenviar":"Convidar dirigente")}</Button>
      </div>
    </div>
  </div>;
}

function Dirigentes({ user }){
  const { dirigentes, inviteDirigente, updateDirigenteConvite, removeDirigente } = useStore();
  const [modal,setModal]=useState(false);
  const [editando,setEditando]=useState(null); // convite pendente sendo corrigido
  const [confirmar,setConfirmar]=useState(null); // dirigente a remover
  const confirmados = dirigentes.filter(d=>d.user_id).length;
  return <div>
    <Header title="Dirigentes" sub={dirigentes.length+" com acesso de administrador"}
      right={<Button variant="primary" iconLeft={<Icon name="user-plus" size={18}/>} onClick={()=>setModal(true)}>Convidar dirigente</Button>}/>

    <div style={{display:"flex",alignItems:"center",gap:10,background:"var(--brand-yellow-soft)",color:"var(--on-yellow)",borderRadius:"var(--r-md)",padding:"12px 16px",marginBottom:18,fontSize:13,fontWeight:600}}>
      <Icon name="shield" size={16}/>Dirigentes têm acesso total à ferramenta. Convide apenas pessoas da coordenação.
    </div>

    <Card pad="0" style={{overflow:"hidden"}}>
      {dirigentes.map((d,i)=>{
        const pendente = !d.user_id;
        const isSelf = d.user_id===user.id || (d.email||"").toLowerCase()===(user.email||"").toLowerCase();
        const last = !pendente && confirmados<=1;
        return <div key={d.id} style={{display:"flex",alignItems:"center",gap:14,padding:"14px 18px",borderBottom:i<dirigentes.length-1?"1px solid var(--hairline)":"none"}}>
          <span style={{width:44,height:44,borderRadius:99,background:pendente?"var(--surface-3)":(d.cargo?cargoColor(d.cargo):"var(--brand-brown)"),color:pendente?"var(--text-2)":"#fff",display:"inline-flex",alignItems:"center",justifyContent:"center",flex:"0 0 auto"}}><Icon name={pendente?"mail-clock":(d.cargo?cargoIcon(d.cargo):"shield-check")} size={20}/></span>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontWeight:700,fontSize:15,display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>{d.nome}{isSelf && <Badge tone="brand">Você</Badge>}{pendente && <Badge tone="warning" dot>Convite pendente</Badge>}</div>
            <div style={{display:"flex",alignItems:"center",gap:10,marginTop:3,flexWrap:"wrap"}}>
              {d.cargo && <Tag color={cargoColor(d.cargo)}>{d.cargo}</Tag>}
              <span style={{fontSize:13,color:"var(--text-2)",display:"inline-flex",alignItems:"center",gap:5}}><Icon name="mail" size={13}/>{d.email}</span>
            </div>
          </div>
          <div style={{display:"flex",gap:4}}>
            {pendente && <Button variant="ghost" iconLeft={<Icon name="pencil" size={15}/>} onClick={()=>setEditando(d)} title="Corrigir nome/e-mail/função e reenviar o convite">Editar</Button>}
            <Button variant="ghost" iconLeft={<Icon name="trash-2" size={15}/>}
              onClick={()=>setConfirmar(d)}
              disabled={isSelf||last}
              style={{opacity:(isSelf||last)?.4:1,color:"var(--brand-red)"}}
              title={isSelf?"Você não pode remover a si mesmo":last?"Precisa haver ao menos um dirigente":"Remover"}>Remover</Button>
          </div>
        </div>;
      })}
    </Card>

    {modal && <NovoDirigenteModal onClose={()=>setModal(false)} onCreate={async d=>{ const r=await inviteDirigente(d); if(!r.error) setModal(false); return r; }}/>}
    {editando && <NovoDirigenteModal initial={editando} onClose={()=>setEditando(null)} onCreate={async d=>{ const r=await updateDirigenteConvite(editando.id,d); if(!r.error) setEditando(null); return r; }}/>}
    {confirmar && <div style={{position:"fixed",inset:0,background:"rgba(42,36,31,.32)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:70}} onClick={()=>setConfirmar(null)}>
      <div onClick={e=>e.stopPropagation()} style={{width:400,maxWidth:"92vw",background:"var(--surface)",borderRadius:"var(--r-xl)",boxShadow:"var(--shadow-lg)",padding:"26px"}}>
        <h3 style={{margin:"0 0 6px",fontSize:19,fontWeight:800}}>Remover dirigente</h3>
        <p style={{margin:"0 0 22px",fontSize:14,color:"var(--text-2)"}}>Remover o acesso de <b>{confirmar.nome}</b> ({confirmar.email})? Ele não conseguirá mais entrar como dirigente.</p>
        <div style={{display:"flex",gap:10,justifyContent:"flex-end"}}>
          <Button variant="ghost" onClick={()=>setConfirmar(null)}>Cancelar</Button>
          <Button variant="primary" onClick={()=>{ removeDirigente(confirmar.id); setConfirmar(null); }} style={{background:"var(--brand-red)"}} iconLeft={<Icon name="trash-2" size={15}/>}>Remover</Button>
        </div>
      </div>
    </div>}
  </div>;
}

function LoginScreen({ onGoSignup, onGoForgot }){
  const [email,setEmail]=useState("");
  const [senha,setSenha]=useState("");
  const [err,setErr]=useState("");
  const [busy,setBusy]=useState(false);
  const entrar=async ()=>{
    if(busy) return;
    setBusy(true); setErr("");
    const r=await Auth.login(email,senha);
    setBusy(false);
    if(!r.ok) setErr(r.error);
    // sucesso: o Gate detecta a sessão sozinho (onAuthStateChange) e troca de tela
  };
  return <AuthShell>
    <h2 style={{margin:"0 0 4px",fontSize:19,fontWeight:800}}>Entrar</h2>
    <p style={{margin:"0 0 20px",fontSize:14,color:"var(--text-2)"}}>Acesse com seu e-mail e senha.</p>
    <label style={{display:"block",fontSize:13,fontWeight:600,marginBottom:6}}>E-mail</label>
    <AuthInput type="email" value={email} onChange={e=>{setEmail(e.target.value);setErr("");}} error={!!err} placeholder="voce@email.com"/>
    <div style={{height:14}}/>
    <label style={{display:"block",fontSize:13,fontWeight:600,marginBottom:6}}>Senha</label>
    <AuthInput type="password" value={senha} onChange={e=>{setSenha(e.target.value);setErr("");}} error={!!err} placeholder="Sua senha" onKeyDown={e=>{if(e.key==="Enter")entrar();}}/>

// tela "esqueci minha senha" — pede o e-mail e dispara o link de redefinição
function ForgotPasswordScreen({ onGoLogin }){
  const [email,setEmail]=useState("");
  const [err,setErr]=useState("");
  const [busy,setBusy]=useState(false);
  const [sent,setSent]=useState(false);
  const enviar=async ()=>{
    if(busy) return;
    if(!validaEmail(email)){ setErr("Informe um e-mail válido."); return; }
    setBusy(true); setErr("");
    const r=await Auth.requestReset(email);
    setBusy(false);
    if(!r.ok){ setErr(r.error); return; }
    setSent(true);
  };
  if(sent) return <AuthShell>
    <div style={{textAlign:"center"}}>
      <span style={{width:56,height:56,borderRadius:99,background:"var(--brand-yellow-soft)",color:"var(--on-yellow)",display:"inline-flex",alignItems:"center",justifyContent:"center",marginBottom:14}}><Icon name="mail-check" size={26}/></span>

      <Button variant="secondary" onClick={onGoLogin} style={{width:"100%",justifyContent:"center"}}>Voltar pro login</Button>
    </div>

    <p style={{margin:"0 0 20px",fontSize:14,color:"var(--text-2)"}}>Informe seu e-mail e enviamos um link pra criar uma nova senha.</p>
    <label style={{display:"block",fontSize:13,fontWeight:600,marginBottom:6}}>E-mail</label>
    <AuthInput type="email" value={email} onChange={e=>{setEmail(e.target.value);setErr("");}} error={!!err} placeholder="voce@email.com" onKeyDown={e=>{if(e.key==="Enter")enviar();}}/>

    </div>

    </div>
  </AuthShell>;

// tela de definir nova senha — abre quando a pessoa chega pelo link de recuperação do e-mail
function ResetPasswordScreen({ onDone }){
  const [senha,setSenha]=useState("");
  const [senha2,setSenha2]=useState("");
  const [errs,setErrs]=useState({});
  const [busy,setBusy]=useState(false);
  const salvar=async ()=>{
    if(busy) return;
    const e={};
    if(!senha || senha.length<4) e.senha="A senha precisa de ao menos 4 caracteres.";
    if(senha2!==senha) e.senha2="As senhas não conferem.";
    setErrs(e);
    if(Object.keys(e).length) return;
    setBusy(true);
    const r=await Auth.updatePassword(senha);
    setBusy(false);
    if(!r.ok){ setErrs({senha:r.error}); return; }
    // limpa o token da URL e segue pro app já logado
    history.replaceState(null,"",window.location.pathname);
    onDone();
  };
  return <AuthShell>
    <h2 style={{margin:"0 0 4px",fontSize:19,fontWeight:800}}>Criar nova senha</h2>
    <p style={{margin:"0 0 20px",fontSize:14,color:"var(--text-2)"}}>Escolha uma nova senha pra sua conta.</p>
    <label style={{display:"block",fontSize:13,fontWeight:600,marginBottom:6}}>Nova senha</label>
    <AuthInput type="password" value={senha} onChange={e=>{setSenha(e.target.value);setErrs(x=>({...x,senha:null}));}} error={!!errs.senha} placeholder="Crie uma nova senha"/>
    {errs.senha && <div style={{fontSize:12,color:"var(--brand-red)",marginTop:6,fontWeight:600}}>{errs.senha}</div>}
    <div style={{height:14}}/>
    <label style={{display:"block",fontSize:13,fontWeight:600,marginBottom:6}}>Confirmar nova senha</label>
    <AuthInput type="password" value={senha2} onChange={e=>{setSenha2(e.target.value);setErrs(x=>({...x,senha2:null}));}} error={!!errs.senha2} placeholder="Repita a senha" onKeyDown={e=>{if(e.key==="Enter")salvar();}}/>
    {errs.senha2 && <div style={{fontSize:12,color:"var(--brand-red)",marginTop:6,fontWeight:600}}>{errs.senha2}</div>}
    <div style={{marginTop:22}}>
      <Button variant="primary" onClick={salvar} disabled={busy} style={{width:"100%",justifyContent:"center",opacity:busy?.7:1}} iconLeft={<Icon name="check" size={16}/>}>{busy?"Salvando...":"Salvar nova senha"}</Button>
    </div>
  </AuthShell>;
}
