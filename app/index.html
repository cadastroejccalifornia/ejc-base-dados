// anos em que a pessoa PODE ter servido: só depois do próprio EJC (nunca antes/no mesmo ano)
const anosDepoisDoEjc = anoEjcStr => { const a=anoDoEjc(anoEjcStr); return a ? EJC_YEARS.filter(y=>anoDoEjc(y)>a) : []; };

// mostra uma linha por ano disponível; em cada ano a pessoa escolhe a equipe (dropdown) e se foi coordenador
function EquipesPorAno({ value, onChange, years, needsYear }){
  const byAno={}; (value||[]).forEach(r=>{ byAno[r.ano]=r; });
  const setEq=(ano,eq)=>{
    let next=(value||[]).filter(r=>r.ano!==ano);
    if(eq) next=[...next,{ano,eq,coord:byAno[ano]?byAno[ano].coord:false}];
    next.sort((a,b)=>anoDoEjc(b.ano)-anoDoEjc(a.ano));
    onChange(next);
  };
  const setCoord=(ano,coord)=>onChange((value||[]).map(r=>r.ano===ano?{...r,coord}:r));
  if(needsYear) return <p style={{fontSize:13,color:"var(--text-3)"}}>Selecione primeiro o ano em que você fez o EJC.</p>;
  if(!years.length) return <p style={{fontSize:13,color:"var(--text-3)"}}>Ainda não houve nenhum EJC depois do seu.</p>;
  const selStyle={border:"none",background:"var(--surface)",borderRadius:"var(--r-sm)",padding:"9px 10px",fontSize:13,fontFamily:"var(--font-sans)",color:"var(--text)",outline:"none",width:"100%"};
  return <div style={{display:"flex",flexDirection:"column",gap:8}}>
    {years.map(y=>{
      const cur=byAno[y];
      return <div key={y} style={{display:"flex",gap:10,flexWrap:"wrap",alignItems:"center",background:"var(--surface-2)",borderRadius:"var(--r-md)",padding:"8px 12px"}}>
        <span style={{flex:"0 0 auto",minWidth:120,fontSize:13,fontWeight:700,color:cur?"var(--brand-brown)":"var(--text-2)"}}>{y}</span>
        <div style={{flex:"1 1 180px",minWidth:150}}>
          <select value={cur?cur.eq:""} onChange={e=>setEq(y,e.target.value)} style={selStyle}>
            <option value="">Não servi neste ano</option>
            {EJC_TEAMS_ALL.map(t=><option key={t}>{t}</option>)}
          </select>
        </div>
        <label style={{flex:"0 0 auto",display:"inline-flex",alignItems:"center",gap:7,fontSize:13,color:"var(--text-2)",cursor:cur?"pointer":"not-allowed",opacity:cur?1:.4}}>
          <input type="checkbox" checked={cur?!!cur.coord:false} disabled={!cur} onChange={e=>setCoord(y,e.target.checked)}/> Coordenador
        </label>
      </div>;
    })}
  </div>;
}

// rótulo de uma entrada de "serviu fora" (aceita string antiga ou objeto novo {ejc,equipe,ano})
function labelServiuFora(e){ return typeof e==="string" ? e : [e.ejc,e.equipe,e.ano].filter(Boolean).join(" · "); }
const ANOS_SERVICO=(()=>{ const a=[]; const y=new Date().getFullYear(); for(let x=y;x>=1990;x--) a.push(x); return a; })();

// "Já serviu fora?" — lista repetível com EJC (texto), Equipe (dropdown) e Ano
function RepeatServiuFora({ value, onChange }){
  const [ejc,setEjc]=useState("");
  const [equipe,setEquipe]=useState("");
  const [ano,setAno]=useState("");
  const add=()=>{ if(!ejc.trim()) return; onChange([...(value||[]),{ejc:ejc.trim(),equipe,ano}]); setEjc("");setEquipe("");setAno(""); };
  const selStyle={border:"none",background:"var(--surface-2)",borderRadius:"var(--r-md)",padding:"11px 12px",fontSize:14,fontFamily:"var(--font-sans)",color:"var(--text)",outline:"none",width:"100%"};
  const lbl={display:"block",fontSize:12,fontWeight:600,marginBottom:5,color:"var(--text-2)"};
  return <div>
    {(value||[]).length>0 && <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:12}}>
      {value.map((e,i)=>(
        <div key={i} style={{display:"flex",alignItems:"center",gap:10,background:"var(--surface-2)",borderRadius:"var(--r-md)",padding:"10px 14px"}}>
          <Icon name="map-pin" size={15}/><span style={{flex:1,fontSize:14,fontWeight:600}}>{labelServiuFora(e)}</span>
          <IconButton label="Remover" size={30} variant="soft" onClick={()=>onChange(value.filter((_,j)=>j!==i))}><Icon name="x" size={15}/></IconButton>
        </div>
      ))}
    </div>}
    <div style={{display:"flex",gap:10,flexWrap:"wrap",alignItems:"flex-end"}}>
      <div style={{flex:"2 1 200px"}}>
        <label style={lbl}>Qual EJC?</label>
        <Input value={ejc} onChange={e=>setEjc(e.target.value)} placeholder="Ex: EJC Padre Eustáquio"/>
      </div>
      <div style={{flex:"1 1 150px"}}>
        <label style={lbl}>Equipe</label>
        <select value={equipe} onChange={e=>setEquipe(e.target.value)} style={selStyle}><option value="">Selecione...</option>{EJC_TEAMS_ALL.map(t=><option key={t}>{t}</option>)}</select>
      </div>
      <div style={{flex:"1 1 110px"}}>
        <label style={lbl}>Ano</label>
        <select value={ano} onChange={e=>setAno(e.target.value)} style={selStyle}><option value="">Ano...</option>{ANOS_SERVICO.map(y=><option key={y}>{y}</option>)}</select>
      </div>
      <Button variant="secondary" iconLeft={<Icon name="plus" size={16}/>} onClick={add}>Adicionar</Button>
    </div>
  </div>;
}

// lista simples de equipes (sem ano) — usada no "não fez Califórnia" do jovem e nas duas
// listas de equipe dos tios. `max` limita quantas entradas podem ser adicionadas.
function RepeatEquipeSimples({ value, onChange, max }){
  const [eq,setEq]=useState("");
  const list=value||[];
  const add=()=>{ if(!eq) return; onChange([...list,{eq}]); setEq(""); };
  const podeAdd = max==null || list.length<max;
  const selStyle={border:"none",background:"var(--surface-2)",borderRadius:"var(--r-md)",padding:"11px 12px",fontSize:13,fontFamily:"var(--font-sans)",outline:"none",minWidth:170};
  return <div>
    {list.length>0 && <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:10}}>
      {list.map((r,i)=>(
        <div key={i} style={{display:"flex",alignItems:"center",gap:10,background:"var(--surface-2)",borderRadius:"var(--r-md)",padding:"10px 14px"}}>
          <span style={{flex:1,fontWeight:600,fontSize:14}}>{r.eq}</span>
          <IconButton label="Remover" size={30} variant="soft" onClick={()=>onChange(list.filter((_,j)=>j!==i))}><Icon name="x" size={15}/></IconButton>
        </div>
      ))}
    </div>}
    {podeAdd
      ? <div style={{display:"flex",gap:10,flexWrap:"wrap",alignItems:"center"}}>
          <select value={eq} onChange={e=>setEq(e.target.value)} style={selStyle}>
            <option value="">Equipe...</option>{EJC_TEAMS_ALL.map(t=><option key={t}>{t}</option>)}
          </select>
          <Button variant="secondary" iconLeft={<Icon name="plus" size={15}/>} onClick={add}>Adicionar</Button>
        </div>
      : <p style={{fontSize:12,color:"var(--text-3)"}}>Máximo de {max} equipe{max>1?"s":""} atingido.</p>}
  </div>;
}

// lista repetível EJC/ECC | Equipe | Coordenação — usada nas equipes que os tios serviram
function RepeatEquipeEcc({ value, onChange, max, eccOptions }){
  const [ejc,setEjc]=useState("");
  const [eq,setEq]=useState("");
  const [coordNovo,setCoordNovo]=useState(false);
  const list=value||[];
  const add=()=>{ if(!ejc||!eq) return; onChange([...list,{ejc,eq,coord:coordNovo}]); setEjc("");setEq("");setCoordNovo(false); };
  const setCoord=(i,coord)=>onChange(list.map((r,j)=>j===i?{...r,coord}:r));
  const podeAdd = max==null || list.length<max;
  const selStyle={border:"none",background:"var(--surface-2)",borderRadius:"var(--r-md)",padding:"11px 12px",fontSize:13,fontFamily:"var(--font-sans)",outline:"none",flex:"1 1 150px",minWidth:130};
  return <div>
    {list.length>0 && <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:10}}>
      {list.map((r,i)=>(
        <div key={i} style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap",background:"var(--surface-2)",borderRadius:"var(--r-md)",padding:"10px 14px"}}>
          <Badge tone="brand">{r.ejc}</Badge>
          <span style={{flex:1,fontWeight:600,fontSize:14,minWidth:100}}>{r.eq}</span>
          <label style={{display:"inline-flex",alignItems:"center",gap:6,fontSize:13,color:"var(--text-2)",cursor:"pointer"}}>
            <input type="checkbox" checked={!!r.coord} onChange={e=>setCoord(i,e.target.checked)}/> Coordenação
          </label>
          <IconButton label="Remover" size={30} variant="soft" onClick={()=>onChange(list.filter((_,j)=>j!==i))}><Icon name="x" size={15}/></IconButton>
        </div>
      ))}
    </div>}
    {podeAdd
      ? <div style={{display:"flex",gap:10,flexWrap:"wrap",alignItems:"center"}}>
          <select value={ejc} onChange={e=>setEjc(e.target.value)} style={selStyle}>
            <option value="">EJC...</option>{eccOptions.map(t=><option key={t}>{t}</option>)}
          </select>
          <select value={eq} onChange={e=>setEq(e.target.value)} style={selStyle}>
            <option value="">Equipe...</option>{EJC_TEAMS_ALL.map(t=><option key={t}>{t}</option>)}
          </select>
          <label style={{display:"inline-flex",alignItems:"center",gap:6,fontSize:13,color:"var(--text-2)",cursor:"pointer",flex:"0 0 auto"}}>
            <input type="checkbox" checked={coordNovo} onChange={e=>setCoordNovo(e.target.checked)}/> Coordenação
          </label>
          <Button variant="secondary" iconLeft={<Icon name="plus" size={15}/>} onClick={add}>Adicionar</Button>
        </div>
      : <p style={{fontSize:12,color:"var(--text-3)"}}>Máximo de {max} equipe{max>1?"s":""} atingido.</p>}
  </div>;
}

    <div onClick={e=>e.stopPropagation()} style={{width:520,maxWidth:"92vw",maxHeight:"80vh",display:"flex",flexDirection:"column",background:"var(--surface)",borderRadius:"var(--r-xl)",boxShadow:"var(--shadow-lg)",padding:"22px"}}>
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:16}}>
        <div style={{flex:1}}><h3 style={{margin:0,fontSize:18,fontWeight:800}}>Adicionar campo</h3><p style={{margin:"2px 0 0",fontSize:13,color:"var(--text-2)"}}>Escolha um campo do catálogo</p></div>
        <IconButton label="Fechar" variant="soft" onClick={onClose}><Icon name="x" size={18}/></IconButton>
      </div>
      <SearchInput placeholder="Buscar campo..." value={q} onChange={setQ} minWidth={0} maxWidth={9999}/>
      <div style={{overflowY:"auto",marginTop:14,display:"flex",flexDirection:"column",gap:8}}>
        {list.map(c=>(
          <div key={c.id} style={{display:"flex",alignItems:"center",gap:12,background:"var(--surface-2)",borderRadius:"var(--r-md)",padding:"10px 14px"}}>
            <span style={{width:36,height:36,borderRadius:99,background:"var(--brand-brown-soft)",color:"var(--brand-brown)",display:"inline-flex",alignItems:"center",justifyContent:"center",flex:"0 0 auto"}}><Icon name={TIPO_META[c.type].icon} size={17}/></span>
            <div style={{flex:1,minWidth:0}}><div style={{fontWeight:600,fontSize:14}}>{c.label}</div><div style={{fontSize:12,color:"var(--text-3)"}}>{TIPO_META[c.type].lbl}</div></div>
            <Button variant="secondary" iconLeft={<Icon name="plus" size={15}/>} onClick={()=>onAdd(c)}>Adicionar</Button>
          </div>
        ))}
        {list.length===0 && <div style={{padding:"24px",textAlign:"center",color:"var(--text-3)",fontSize:14}}>Nenhum campo encontrado.</div>}
      </div>
    </div>
  </div>;
}

function CondicaoConfig({ campo, anteriores, onChange }){
  const [open,setOpen]=useState(false);
  const cond=campo.cond;
  const candidatos=anteriores.filter(c=>c.type==="simnao"||c.type==="unica"||c.type==="multipla");
  // ao abrir sem condição definida, já inicializa com o padrão exibido
  useEffect(()=>{
    if(open && !cond && candidatos.length){
      onChange({key:candidatos[0].key, value:valoresDoTipo(candidatos[0])[0]});
    }
  },[open]);
  if(cond && !open){
    const ref=anteriores.find(c=>c.key===cond.key);
    return <div style={{display:"inline-flex",alignItems:"center",gap:8,background:"var(--brand-yellow-soft)",color:"var(--on-yellow)",borderRadius:"var(--r-pill)",padding:"5px 6px 5px 12px",fontSize:12,fontWeight:600}}>
      <Icon name="git-branch" size={13}/>Só se “{ref?ref.label:"?"}” = {cond.value}
      <button onClick={()=>setOpen(true)} title="Editar" style={{border:"none",background:"transparent",cursor:"pointer",color:"inherit",display:"inline-flex"}}><Icon name="pencil" size={13}/></button>
      <button onClick={()=>onChange(null)} title="Remover condição" style={{border:"none",background:"transparent",cursor:"pointer",color:"inherit",display:"inline-flex"}}><Icon name="x" size={14}/></button>
    </div>;
  }
  if(!open){
    if(candidatos.length===0) return null;
    return <button onClick={()=>setOpen(true)} style={{display:"inline-flex",alignItems:"center",gap:6,border:"none",background:"transparent",cursor:"pointer",color:"var(--text-2)",fontFamily:"var(--font-sans)",fontSize:12,fontWeight:600}}><Icon name="git-branch" size={13}/>Condicional</button>;
  }
  const refKey=(cond&&cond.key)||(candidatos[0]&&candidatos[0].key)||"";
  const refCampo=candidatos.find(c=>c.key===refKey);
  const vals=valoresDoTipo(refCampo);
  return <div style={{display:"flex",flexWrap:"wrap",alignItems:"center",gap:8,background:"var(--surface)",borderRadius:"var(--r-md)",padding:"8px 10px",boxShadow:"var(--shadow-xs)"}}>
    <span style={{fontSize:12,color:"var(--text-2)",fontWeight:600}}>Mostrar só se</span>
    <select value={refKey} onChange={e=>onChange({key:e.target.value,value:valoresDoTipo(candidatos.find(c=>c.key===e.target.value))[0]})} style={{border:"none",background:"var(--surface-2)",borderRadius:"var(--r-sm)",padding:"7px 9px",fontSize:12,fontFamily:"var(--font-sans)",outline:"none"}}>
      {candidatos.map(c=><option key={c.key} value={c.key}>{c.label}</option>)}
    </select>
    <span style={{fontSize:12,color:"var(--text-2)",fontWeight:600}}>=</span>
    <select value={(cond&&cond.value)||vals[0]||""} onChange={e=>onChange({key:refKey,value:e.target.value})} style={{border:"none",background:"var(--surface-2)",borderRadius:"var(--r-sm)",padding:"7px 9px",fontSize:12,fontFamily:"var(--font-sans)",outline:"none"}}>
      {vals.map(v=><option key={v}>{v}</option>)}
    </select>
    <Button variant="ghost" onClick={()=>setOpen(false)}>Ok</Button>
  </div>;
}

function FormBuilder({ form, onClose, onSave }){
  useLucide();
  const sistema = form && form.sistema;
  const [nome,setNome]=useState(form?form.nome:"");
  const [campos,setCampos]=useState(form?form.campos:[]);
  const [paleta,setPaleta]=useState(false);

  const addCampo=(c)=>{ setCampos(l=>[...l,{key:uid(),id:c.id,label:c.label,type:c.type,opcoes:c.opcoes}]); setPaleta(false); };
  const removeCampo=(key)=>setCampos(l=>l.filter(c=>c.key!==key));
  const move=(i,dir)=>{ const j=i+dir; if(j<0||j>=campos.length)return; const arr=[...campos]; [arr[i],arr[j]]=[arr[j],arr[i]]; setCampos(arr); };
  const setCond=(key,cond)=>setCampos(l=>l.map(c=>c.key===key?{...c,cond:cond||undefined}:c));

  return <div style={{position:"fixed",inset:0,zIndex:60,background:"linear-gradient(180deg,var(--bg-top) 0%,var(--bg) 40%)",overflow:"auto"}}>
    <div style={{position:"sticky",top:0,zIndex:5,background:"color-mix(in oklch, var(--bg) 88%, transparent)",backdropFilter:"blur(8px)",borderBottom:"1px solid var(--hairline)"}}>
      <div style={{maxWidth:820,margin:"0 auto",padding:"16px 22px",display:"flex",alignItems:"center",gap:14}}>
        <IconButton label="Voltar" variant="soft" onClick={onClose}><Icon name="arrow-left" size={18}/></IconButton>
        <div style={{marginRight:"auto"}}>
          <div className="mono-overline">{sistema?"FORMULÁRIO PADRÃO":form?"EDITAR FORMULÁRIO":"NOVO FORMULÁRIO"}</div>
          <h1 style={{margin:"2px 0 0",fontSize:22,fontWeight:800,letterSpacing:"-.02em"}}>{sistema?form.nome:"Montar formulário"}</h1>
        </div>
        {!sistema && <><Button variant="ghost" className="hide-mobile" onClick={onClose}>Cancelar</Button>
          <Button variant="primary" iconLeft={<Icon name="check" size={16}/>} onClick={()=>onSave({nome:nome.trim()||"Formulário sem nome",campos})}>Salvar formulário</Button></>}
      </div>
    </div>

    <div style={{maxWidth:820,margin:"0 auto",padding:"24px 22px 60px"}}>
      {sistema && <div style={{display:"flex",alignItems:"center",gap:10,background:"var(--brand-yellow-soft)",color:"var(--on-yellow)",borderRadius:"var(--r-md)",padding:"12px 16px",marginBottom:18,fontSize:13,fontWeight:600}}>
        <Icon name="star" size={16}/>Este é o formulário padrão do sistema (a Ficha do jovem). Ele não pode ser editado nem removido.
      </div>}

      {!sistema && <Card style={{marginBottom:18}}>
        <label style={{display:"block",fontSize:13,fontWeight:600,marginBottom:7}}>Nome do formulário</label>
        <Input value={nome} onChange={e=>setNome(e.target.value)} placeholder="Ex: Ficha dos tios, Inscrição de encontrista..."/>
      </Card>}

      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
        <h3 style={{margin:0,fontSize:16,fontWeight:700}}>Campos {campos.length>0 && <span style={{color:"var(--text-3)",fontWeight:600}}>· {campos.length}</span>}</h3>
        {!sistema && <Button variant="secondary" iconLeft={<Icon name="plus" size={16}/>} onClick={()=>setPaleta(true)}>Adicionar campo</Button>}
      </div>

      {campos.length===0 && <Card style={{minHeight:200,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:12,textAlign:"center"}}>
        <span style={{width:56,height:56,borderRadius:99,background:"var(--surface-2)",color:"var(--text-3)",display:"inline-flex",alignItems:"center",justifyContent:"center"}}><Icon name="list-plus" size={26}/></span>
        <div style={{fontSize:15,fontWeight:700}}>Nenhum campo ainda</div>
        <div style={{fontSize:13,color:"var(--text-2)",maxWidth:320}}>Clique em “Adicionar campo” para montar o formulário.</div>
      </Card>}

      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        {campos.map((c,i)=>(
          <Card key={c.key} pad="14px 16px">
            <div style={{display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
              <span style={{width:26,fontWeight:800,color:"var(--text-3)",fontSize:14,textAlign:"center"}}>{i+1}</span>
              <span style={{width:38,height:38,borderRadius:99,background:"var(--brand-brown-soft)",color:"var(--brand-brown)",display:"inline-flex",alignItems:"center",justifyContent:"center",flex:"0 0 auto"}}><Icon name={TIPO_META[c.type].icon} size={17}/></span>
              <div style={{flex:1,minWidth:120}}>
                <div style={{fontWeight:600,fontSize:15}}>{c.label}</div>
                <div style={{fontSize:12,color:"var(--text-3)"}}>{TIPO_META[c.type].lbl}</div>
                {CAMPO_SUBINFO[c.id] && <div style={{fontSize:12,color:"var(--brand-brown)",marginTop:3,fontWeight:600}}>{CAMPO_SUBINFO[c.id]}</div>}
              </div>
              {!sistema && <CondicaoConfig campo={c} anteriores={campos.slice(0,i)} onChange={cond=>setCond(c.key,cond)}/>}
              {sistema && c.cond && <Badge tone="yellow" dot>Condicional</Badge>}
              {!sistema && <div style={{display:"inline-flex",gap:4,marginLeft:"auto"}}>
                <IconButton label="Subir" size={32} variant="soft" onClick={()=>move(i,-1)} disabled={i===0} style={{opacity:i===0?.4:1}}><Icon name="chevron-up" size={16}/></IconButton>
                <IconButton label="Descer" size={32} variant="soft" onClick={()=>move(i,1)} disabled={i===campos.length-1} style={{opacity:i===campos.length-1?.4:1}}><Icon name="chevron-down" size={16}/></IconButton>
                <IconButton label="Remover" size={32} variant="soft" onClick={()=>removeCampo(c.key)}><Icon name="trash-2" size={15}/></IconButton>
              </div>}
            </div>
          </Card>
        ))}
      </div>
    </div>
    {paleta && <PaletaCampos onAdd={addCampo} onClose={()=>setPaleta(false)}/>}
  </div>;
}

function NovoFormulario(){
  const { formularios, addForm, updateForm, deleteForm, setFavorito } = useStore();
  const [editing,setEditing]=useState(null); // 'new' | form object
  if(editing){
    const isNew = editing==="new";
    return <FormBuilder form={isNew?null:editing}
      onClose={()=>setEditing(null)}
      onSave={data=>{ if(isNew) addForm(data); else updateForm(editing.id,data); setEditing(null); }}/>;
  }
  const list=[...formularios].sort((a,b)=>(b.favorito?1:0)-(a.favorito?1:0));
  return <div>
    <Header title="Novo formulário" sub="Crie e gerencie os formulários de cadastro"/>
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(240px,1fr))",gap:16}}>
      <button onClick={()=>setEditing("new")} style={{textAlign:"left",cursor:"pointer",border:"2px dashed var(--brand-brown-soft)",background:"var(--surface-2)",borderRadius:"var(--r-lg)",padding:"22px",minHeight:160,display:"flex",flexDirection:"column",justifyContent:"space-between",fontFamily:"var(--font-sans)"}}>
        <span style={{width:46,height:46,borderRadius:99,background:"var(--brand-brown)",color:"var(--on-brand)",display:"inline-flex",alignItems:"center",justifyContent:"center"}}><Icon name="plus" size={22}/></span>
        <div><div style={{fontSize:16,fontWeight:700,color:"var(--brand-brown)"}}>Criar formulário</div><div style={{fontSize:13,color:"var(--text-2)",marginTop:2}}>Montar um novo formulário do zero</div></div>
      </button>
      {list.map(f=>(
        <div key={f.id} style={{background:"var(--surface)",borderRadius:"var(--r-lg)",padding:"22px",minHeight:160,boxShadow:"var(--shadow-sm)",display:"flex",flexDirection:"column",justifyContent:"space-between"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
            <span style={{width:46,height:46,borderRadius:99,background:f.favorito?"var(--brand-brown)":"var(--cat-blue)",color:"#fff",display:"inline-flex",alignItems:"center",justifyContent:"center"}}><Icon name="clipboard-list" size={20}/></span>
            <button onClick={()=>setFavorito(f.id)} title={f.favorito?"Formulário favorito":"Tornar favorito"} style={{border:"none",background:"transparent",cursor:"pointer",color:f.favorito?"var(--brand-yellow)":"var(--text-3)",display:"inline-flex",padding:4}}>
              <span style={{fontSize:20,lineHeight:1}}>{f.favorito?"★":"☆"}</span>
            </button>
          </div>
          <div>
            <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
              <div style={{fontSize:16,fontWeight:700,color:"var(--text)"}}>{f.nome}</div>
              {f.sistema && <Badge tone="brand">Padrão</Badge>}
            </div>
            <div style={{fontSize:13,color:"var(--text-2)",marginTop:2}}>{f.campos.length} campos</div>
            <div style={{display:"flex",gap:8,marginTop:14}}>
              <Button variant="secondary" iconLeft={<Icon name={f.sistema?"eye":"pencil"} size={15}/>} onClick={()=>setEditing(f)}>{f.sistema?"Visualizar":"Editar"}</Button>
              {!f.sistema && <IconButton label="Excluir" variant="soft" onClick={()=>deleteForm(f.id)}><Icon name="trash-2" size={16}/></IconButton>}
            </div>
          </div>
        </div>
      ))}
    </div>
  </div>;
}

function StatTile({ label, value, unit, icon, color }){
  return <div style={{background:"var(--surface)",borderRadius:"var(--r-lg)",padding:"var(--card-pad)",boxShadow:"var(--shadow-sm)",display:"flex",flexDirection:"column",gap:12}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
      <span style={{fontSize:13,fontWeight:500,color:"var(--text-2)"}}>{label}</span>
      <span style={{width:38,height:38,borderRadius:99,background:color,color:"#fff",display:"inline-flex",alignItems:"center",justifyContent:"center"}}><Icon name={icon} size={18}/></span>
    </div>
    <div style={{display:"flex",alignItems:"baseline",gap:6}}>
      <span style={{fontSize:34,fontWeight:800,letterSpacing:"-.02em",lineHeight:1}}>{value}</span>
      {unit&&<span style={{fontSize:15,fontWeight:600,color:"var(--text-3)"}}>{unit}</span>}
    </div>
  </div>;
}
function BarRow({ label, value, max, color, icon }){
  const pct = max>0 ? Math.round(value/max*100) : 0;
  return <div style={{display:"flex",alignItems:"center",gap:12}}>
    {icon && <span style={{width:34,height:34,borderRadius:99,background:color,color:"#fff",display:"inline-flex",alignItems:"center",justifyContent:"center",flex:"0 0 auto"}}><Icon name={icon} size={16}/></span>}
    <div style={{flex:1,minWidth:0}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:6,gap:10}}>
        <span style={{fontSize:14,fontWeight:600,color:"var(--text)",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{label}</span>
        <span style={{fontSize:15,fontWeight:800,color:"var(--text)",flex:"0 0 auto"}}>{value}</span>
      </div>
      <div style={{height:9,borderRadius:99,background:"var(--surface-3)",overflow:"hidden"}}>
        <div style={{width:pct+"%",height:"100%",borderRadius:99,background:color,transition:"width .3s"}}/>
      </div>
    </div>
  </div>;
}
const CAT_PALETTE=["var(--cat-terracotta)","var(--cat-plum)","var(--cat-blue)","var(--cat-olive)","var(--cat-brown)","var(--cat-yellow)","var(--cat-red)"];

function Relatorios(){
  const { jovens } = useStore();
  const ativos = jovens.filter(j=>j.ativo);
  const musicos = ativos.filter(j=>j.inst);
  // músicos por instrumento (inst pode ter vários separados por vírgula)
  const instCount={};
  musicos.forEach(m=>String(m.inst).split(/,\s*/).forEach(i=>{const k=i.trim();if(k)instCount[k]=(instCount[k]||0)+1;}));
  const instList=Object.entries(instCount).sort((a,b)=>b[1]-a[1]);
  const maxInst=Math.max(1,...instList.map(x=>x[1]));
  // pessoas ativas por equipe do MJC
  const teamList=MJC_TEAMS.map(t=>[t,ativos.filter(j=>j.mjc===t).length]);
  const maxTeam=Math.max(1,...teamList.map(x=>x[1]));

  return <div>
    <Header title="Relatórios" sub="Panorama dos músicos e das equipes do MJC"/>

    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:16,marginBottom:20}}>
      <StatTile label="Pessoas ativas" value={ativos.length} icon="users" color="var(--cat-blue)"/>
      <StatTile label="Músicos ativos" value={musicos.length} icon="music" color="var(--cat-plum)"/>
      <StatTile label="Instrumentos" value={instList.length} icon="guitar" color="var(--cat-terracotta)"/>
      <StatTile label="Equipes do MJC" value={MJC_TEAMS.length} icon="layout-grid" color="var(--cat-olive)"/>
    </div>

    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(300px,1fr))",gap:20,alignItems:"start"}}>
      <Card title="Músicos ativos por instrumento" subtitle={musicos.length+" músicos ativos"}>
        {instList.length===0
          ? <div style={{padding:"30px",textAlign:"center",color:"var(--text-3)",fontSize:14}}>Nenhum músico ativo cadastrado.</div>
          : <div style={{display:"flex",flexDirection:"column",gap:16}}>
              {instList.map(([inst,n],i)=><BarRow key={inst} label={inst} value={n} max={maxInst} color={CAT_PALETTE[i%CAT_PALETTE.length]} icon="music"/>)}
            </div>}
      </Card>

      <Card title="Pessoas ativas por equipe do MJC" subtitle={ativos.length+" pessoas ativas"}>
        <div style={{display:"flex",flexDirection:"column",gap:16}}>
          {teamList.map(([t,n])=><BarRow key={t} label={t} value={n} max={maxTeam} color={MJC_COLOR[t]} icon={MJC_ICON[t]}/>)}
        </div>
      </Card>
    </div>
  </div>;
}

// função do dirigente: uma equipe do MJC, "Tio dirigente" ou "Coordenação Geral"
const CARGOS_DIRIGENTE=["Coordenação Geral",...MJC_TEAMS,"Tio dirigente"];
const cargoColor = c => c==="Tio dirigente" ? "var(--cat-terracotta)" : c==="Coordenação Geral" ? "var(--brand-brown)" : mjcColor(c);
const cargoIcon = c => c==="Tio dirigente" ? "heart-handshake" : c==="Coordenação Geral" ? "shield-check" : (MJC_ICON[c]||"users");

function NovoDirigenteModal({ onClose, onCreate, initial }){
  const editing = !!initial;
  const [nome,setNome]=useState(initial?.nome||"");
  const [email,setEmail]=useState(initial?.email||"");
  const [cargo,setCargo]=useState(initial?.cargo||"");
  const [errs,setErrs]=useState({});
  const [busy,setBusy]=useState(false);
  const criar=async ()=>{
    const e={};
    if(!nome.trim()) e.nome="Informe o nome.";
    if(!validaEmail(email)) e.email="E-mail inválido.";
    if(!cargo) e.cargo="Escolha a função do dirigente.";
    setErrs(e);
    if(Object.keys(e).length) return;
    setBusy(true);
    const r=await onCreate({nome:nome.trim(),email:email.trim(),cargo});
    setBusy(false);
    if(r&&r.error) setErrs(x=>({...x,email:(r.error.message||"Não deu certo — confira o e-mail (pode já haver um convite pendente para ele).")}));
  };
  return <div style={{position:"fixed",inset:0,background:"rgba(42,36,31,.32)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:70}} onClick={onClose}>
    <div onClick={e=>e.stopPropagation()} style={{width:480,maxWidth:"92vw",background:"var(--surface)",borderRadius:"var(--r-xl)",boxShadow:"var(--shadow-lg)",padding:"26px",maxHeight:"88vh",overflow:"auto"}}>
      <h3 style={{margin:"0 0 4px",fontSize:20,fontWeight:800}}>{editing?"Corrigir convite":"Novo dirigente"}</h3>
      <p style={{margin:"0 0 16px",fontSize:14,color:"var(--text-2)"}}>{editing?"Confira os dados e reenviamos o link de acesso pro e-mail correto.":"O dirigente terá acesso completo à ferramenta."}</p>

      <div style={{display:"flex",gap:10,background:"var(--surface-2)",borderRadius:"var(--r-md)",padding:"12px 14px",marginBottom:18,fontSize:13,color:"var(--text-2)"}}>
        <Icon name="mail-check" size={16}/>
        <div>A pessoa recebe um e-mail com um link de acesso nesse endereço. Ao clicar, ela já entra como dirigente e é levada direto pra completar a própria ficha.</div>
      </div>

      <label style={{display:"block",fontSize:13,fontWeight:600,marginBottom:6}}>Nome</label>
      <Input value={nome} onChange={e=>{setNome(e.target.value);setErrs(x=>({...x,nome:null}));}} error={!!errs.nome} placeholder="Nome do dirigente"/>
      {errs.nome && <div style={{fontSize:12,color:"var(--brand-red)",marginTop:6,fontWeight:600}}>{errs.nome}</div>}
      <div style={{height:14}}/>
      <label style={{display:"block",fontSize:13,fontWeight:600,marginBottom:6}}>E-mail</label>
      <Input type="email" value={email} onChange={e=>{setEmail(e.target.value);setErrs(x=>({...x,email:null}));}} error={!!errs.email} placeholder="dirigente@email.com"/>
      {errs.email && <div style={{fontSize:12,color:"var(--brand-red)",marginTop:6,fontWeight:600}}>{errs.email}</div>}
      <div style={{height:16}}/>
      <label style={{display:"block",fontSize:13,fontWeight:600,marginBottom:8}}>Função <span style={{color:"var(--text-3)",fontWeight:500}}>· equipe do MJC ou tio dirigente</span></label>
      <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
        {CARGOS_DIRIGENTE.map(c=><button key={c} type="button" onClick={()=>{setCargo(c);setErrs(x=>({...x,cargo:null}));}} style={chipStyle(cargo===c)}>{c}</button>)}
      </div>

      <div style={{display:"flex",gap:10,justifyContent:"flex-end",marginTop:24}}>

        <Button variant="primary" onClick={criar} disabled={busy} style={{opacity:busy?.7:1}} iconLeft={<Icon name="mail-check" size={16}/>}>{busy?"Enviando...":(editing?"Salvar e reenviar":"Convidar dirigente")}</Button>
      </div>
    </div>
  </div>;
}

function Dirigentes({ user, embedded, onEditPerson }){
  const { dirigentes, jovens, inviteDirigente, updateDirigenteConvite, removeDirigente } = useStore();
  const [modal,setModal]=useState(false);
  const [editando,setEditando]=useState(null); // convite pendente sendo corrigido
  const [confirmar,setConfirmar]=useState(null); // dirigente a remover
  const confirmados = dirigentes.filter(d=>d.user_id).length;
  // acha a própria ficha do dirigente (mesmo cadastro que ele preencheu como jovem) pra puxar a foto e editar
  const fichaDoDirigente = d => d.user_id ? jovens.find(j=>j.user_id===d.user_id) : null;
  const inviteBtn=<Button variant="primary" iconLeft={<Icon name="user-plus" size={18}/>} onClick={()=>setModal(true)}>Convidar dirigente</Button>;
  return <div>
    {embedded
      ? <div style={{display:"flex",alignItems:"center",gap:12,flexWrap:"wrap",marginBottom:14}}>
          <div style={{marginRight:"auto"}}><h3 style={{margin:0,fontSize:18,fontWeight:800}}>Dirigentes</h3><p style={{margin:"2px 0 0",fontSize:13,color:"var(--text-2)"}}>{dirigentes.length+" com acesso de administrador"}</p></div>
          {inviteBtn}
        </div>
      : <Header title="Dirigentes" sub={dirigentes.length+" com acesso de administrador"} right={inviteBtn}/>}

    <div style={{display:"flex",alignItems:"center",gap:10,background:"var(--brand-yellow-soft)",color:"var(--on-yellow)",borderRadius:"var(--r-md)",padding:"12px 16px",marginBottom:18,fontSize:13,fontWeight:600}}>
      <Icon name="shield" size={16}/>Dirigentes têm acesso total à ferramenta. Convide apenas pessoas da coordenação.
    </div>

    <Card pad="0" style={{overflow:"hidden"}}>
      {dirigentes.map((d,i)=>{
        const pendente = !d.user_id;
        const isSelf = d.user_id===user.id || (d.email||"").toLowerCase()===(user.email||"").toLowerCase();
        const last = !pendente && confirmados<=1;
        const minhaFicha = fichaDoDirigente(d);
        return <div key={d.id} style={{display:"flex",alignItems:"center",gap:14,rowGap:8,flexWrap:"wrap",padding:"14px 18px",borderBottom:i<dirigentes.length-1?"1px solid var(--hairline)":"none"}}>
          {minhaFicha
            ? <Avatar src={minhaFicha.foto} name={d.nome} size={44}/>
            : <span style={{width:44,height:44,borderRadius:99,background:pendente?"var(--surface-3)":(d.cargo?cargoColor(d.cargo):"var(--brand-brown)"),color:pendente?"var(--text-2)":"#fff",display:"inline-flex",alignItems:"center",justifyContent:"center",flex:"0 0 auto"}}><Icon name={pendente?"mail-clock":(d.cargo?cargoIcon(d.cargo):"shield-check")} size={20}/></span>}
          <div style={{flex:"1 1 200px",minWidth:0}}>
            <div style={{fontWeight:700,fontSize:15,display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>{d.nome}{isSelf && <Badge tone="brand">Você</Badge>}{pendente && <Badge tone="warning" dot>Convite pendente</Badge>}</div>
            <div style={{display:"flex",alignItems:"center",gap:10,marginTop:3,flexWrap:"wrap"}}>
              {d.cargo && <Tag color={cargoColor(d.cargo)}>{d.cargo}</Tag>}
              <span style={{fontSize:13,color:"var(--text-2)",display:"inline-flex",alignItems:"center",gap:5,minWidth:0,overflowWrap:"anywhere"}}><Icon name="mail" size={13}/>{d.email}</span>
            </div>
          </div>
          <div style={{display:"flex",gap:4,flex:"0 0 auto",marginLeft:"auto"}}>
            {isSelf && minhaFicha && onEditPerson && <Button variant="ghost" iconLeft={<Icon name="pencil" size={15}/>} onClick={()=>onEditPerson(minhaFicha)} title="Editar meu cadastro">Meu cadastro</Button>}
            {pendente && <Button variant="ghost" iconLeft={<Icon name="pencil" size={15}/>} onClick={()=>setEditando(d)} title="Corrigir nome/e-mail/função e reenviar o convite">Editar</Button>}
            <Button variant="ghost" iconLeft={<Icon name="trash-2" size={15}/>}
              onClick={()=>setConfirmar(d)}
              disabled={isSelf||last}
              style={{opacity:(isSelf||last)?.4:1,color:"var(--brand-red)"}}
              title={isSelf?"Você não pode remover a si mesmo":last?"Precisa haver ao menos um dirigente":"Remover"}>Remover</Button>
          </div>
        </div>;
      })}
    </Card>

    {modal && <NovoDirigenteModal onClose={()=>setModal(false)} onCreate={async d=>{ const r=await inviteDirigente(d); if(!r.error) setModal(false); return r; }}/>}
    {editando && <NovoDirigenteModal initial={editando} onClose={()=>setEditando(null)} onCreate={async d=>{ const r=await updateDirigenteConvite(editando.id,d); if(!r.error) setEditando(null); return r; }}/>}
    {confirmar && <div style={{position:"fixed",inset:0,background:"rgba(42,36,31,.32)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:70}} onClick={()=>setConfirmar(null)}>
      <div onClick={e=>e.stopPropagation()} style={{width:400,maxWidth:"92vw",background:"var(--surface)",borderRadius:"var(--r-xl)",boxShadow:"var(--shadow-lg)",padding:"26px"}}>
        <h3 style={{margin:"0 0 6px",fontSize:19,fontWeight:800}}>Remover dirigente</h3>
        <p style={{margin:"0 0 22px",fontSize:14,color:"var(--text-2)"}}>Remover o acesso de <b>{confirmar.nome}</b> ({confirmar.email})? Ele não conseguirá mais entrar como dirigente.</p>
        <div style={{display:"flex",gap:10,justifyContent:"flex-end"}}>
          <Button variant="ghost" onClick={()=>setConfirmar(null)}>Cancelar</Button>
          <Button variant="primary" onClick={()=>{ removeDirigente(confirmar.id); setConfirmar(null); }} style={{background:"var(--brand-red)"}} iconLeft={<Icon name="trash-2" size={15}/>}>Remover</Button>
        </div>
      </div>
    </div>}
  </div>;
}

function RedefinirSenhaCard(){
  const [email,setEmail]=useState("");
  const [modo,setModo]=useState("email"); // email | direta
  const [senha,setSenha]=useState("");
  const [busy,setBusy]=useState(false);
  const [msg,setMsg]=useState(null);
  useLucide();
  const inp={width:"100%",border:"none",background:"var(--surface-2)",borderRadius:"var(--r-md)",padding:"12px 14px",fontSize:14,fontFamily:"var(--font-sans)",color:"var(--text)",outline:"none"};
  const enviarEmail=async()=>{
    if(!validaEmail(email)){ setMsg({t:"erro",x:"Informe um e-mail válido."}); return; }
    setBusy(true); setMsg(null);
    const r=await Auth.resetOutro(email);
    setBusy(false);
    setMsg(r.ok?{t:"ok",x:"E-mail de redefinição enviado para "+email+". A pessoa clica no link e escolhe a nova senha."}:{t:"erro",x:r.error});
  };
  const definir=async()=>{
    if(!validaEmail(email)){ setMsg({t:"erro",x:"Informe um e-mail válido."}); return; }
    if(!senha||senha.length<6){ setMsg({t:"erro",x:"A nova senha precisa de ao menos 6 caracteres."}); return; }
    setBusy(true); setMsg(null);
    const r=await Auth.setUserPassword(email,senha);
    setBusy(false);
    if(r.ok){ setMsg({t:"ok",x:"Senha de "+email+" alterada com sucesso."}); setSenha(""); }
    else setMsg({t:"erro",x:r.error});
  };
  const btn=on=>({flex:1,border:"none",cursor:"pointer",fontFamily:"var(--font-sans)",fontSize:13,fontWeight:700,padding:"10px",borderRadius:"var(--r-md)",background:on?"var(--brand-brown)":"var(--surface-2)",color:on?"var(--on-brand)":"var(--text-2)"});
  return <Card title="Redefinir senha de alguém" subtitle="Envie um link por e-mail ou defina a nova senha na hora" style={{marginBottom:18}}>
    <label style={{display:"block",fontSize:13,fontWeight:600,marginBottom:6}}>E-mail da pessoa</label>
    <input type="email" value={email} onChange={e=>{setEmail(e.target.value);setMsg(null);}} placeholder="pessoa@email.com" style={inp}/>
    <div style={{display:"flex",gap:8,marginTop:14,marginBottom:14}}>
      <button onClick={()=>{setModo("email");setMsg(null);}} style={btn(modo==="email")}>Enviar e-mail</button>
      <button onClick={()=>{setModo("direta");setMsg(null);}} style={btn(modo==="direta")}>Definir senha agora</button>
    </div>
    {modo==="email"
      ? <Button variant="primary" iconLeft={<Icon name="mail" size={16}/>} onClick={enviarEmail} disabled={busy} style={{opacity:busy?.7:1}}>{busy?"Enviando...":"Enviar e-mail de redefinição"}</Button>
      : <>
          <label style={{display:"block",fontSize:13,fontWeight:600,marginBottom:6}}>Nova senha</label>
          <input type="text" value={senha} onChange={e=>{setSenha(e.target.value);setMsg(null);}} placeholder="Mínimo 6 caracteres" style={inp}/>
          <div style={{marginTop:14}}>
            <Button variant="primary" iconLeft={<Icon name="key-round" size={16}/>} onClick={definir} disabled={busy} style={{opacity:busy?.7:1}}>{busy?"Salvando...":"Definir nova senha"}</Button>
          </div>
          <div style={{fontSize:12,color:"var(--text-3)",marginTop:10,display:"flex",alignItems:"center",gap:6}}><Icon name="info" size={13}/>A pessoa precisa já ter uma conta. Requer a função de servidor ativada no Supabase (veja instruções).</div>
        </>}
    {msg && <div style={{marginTop:14,fontSize:13,fontWeight:600,borderRadius:"var(--r-md)",padding:"11px 14px",display:"flex",alignItems:"center",gap:8,background:msg.t==="ok"?"var(--success-soft)":"var(--danger-soft)",color:msg.t==="ok"?"var(--success)":"var(--brand-red)"}}><Icon name={msg.t==="ok"?"check-circle":"alert-circle"} size={15}/>{msg.x}</div>}
  </Card>;
}

// avatar do rail: clicar abre um menu com Configurações/Alterar senha/Sair (limpa a barra lateral)
// menu do avatar — `align` controla de que lado o popover se ancora, pra nunca vazar da tela
function RailAvatarMenu({ user, isOwner, onOpenConfig, onOpenSenha, onLogout, align="left", drop="up" }){
  const [open,setOpen]=useState(false);
  const ref=useRef(null);
  useLucide();
  useEffect(()=>{
    if(!open) return;
    const onDoc=e=>{ if(ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown",onDoc);
    return ()=>document.removeEventListener("mousedown",onDoc);
  },[open]);
  const item=(icon,label,onClick,danger)=>(
    <button onClick={()=>{ setOpen(false); onClick(); }} style={{display:"flex",alignItems:"center",gap:10,width:"100%",border:"none",background:"transparent",cursor:"pointer",padding:"10px 12px",borderRadius:"var(--r-md)",fontFamily:"var(--font-sans)",fontSize:14,fontWeight:600,color:danger?"var(--brand-red)":"var(--text)",textAlign:"left"}}
      onMouseEnter={e=>e.currentTarget.style.background="var(--surface-2)"} onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
      <Icon name={icon} size={17}/>{label}
    </button>
  );
  const popStyle={
    position:"absolute",
    [drop==="up"?"bottom":"top"]:"calc(100% + 8px)",
    [align==="left"?"left":"right"]:0,
    width:"max-content",minWidth:200,maxWidth:"min(240px, calc(100vw - 24px))",
    background:"var(--surface)",borderRadius:"var(--r-lg)",boxShadow:"var(--shadow-lg)",padding:8,zIndex:60,
  };
  return <div ref={ref} style={{position:"relative",display:"inline-flex"}}>
    <button onClick={()=>setOpen(o=>!o)} title="Menu" style={{border:"none",background:"transparent",cursor:"pointer",padding:0,borderRadius:"50%"}}>
      <Avatar name={user?user.nome||"Admin":"Você"} size={44} title={user?user.email:""}/>
    </button>
    {open && <div style={popStyle}>
      {user&&user.email && <div style={{padding:"8px 12px 10px",fontSize:12,color:"var(--text-3)",borderBottom:"1px solid var(--hairline)",marginBottom:6,overflowWrap:"anywhere"}}>{user.email}</div>}
      {isOwner && item("settings","Configurações",onOpenConfig)}
      {item("key-round","Alterar senha",onOpenSenha)}
      {item("log-out","Sair",onLogout,true)}
    </div>}
  </div>;
}

const NAV=[
  {id:"inicio",label:"Início",icon:"home"},
  {id:"jovens",label:"Jovens",icon:"users"},
  {id:"tios",label:"Tios",icon:"heart-handshake"},
  {id:"montagem",label:"Montagem",icon:"layout-grid"},
  {id:"form",label:"Novo formulário",icon:"file-plus-2"},
  {id:"relatorios",label:"Relatórios",icon:"bar-chart-3"},
  {id:"calendario",label:"Calendário",icon:"calendar-days"},
];
// e-mails com acesso à aba Configurações (senhas + dirigentes) — exclusivo do admin dono
const SUPER_ADMINS=["cadastro.ejccalifornia@gmail.com"];
function App({ user, onLogout }){
  const { addJovem, updateJovem, addTio, updateTio } = useStore();
  // Configurações é exclusivo do admin dono (por e-mail), não de qualquer dirigente
  // Fica sempre dentro do menu do avatar (RailAvatarMenu), tanto no celular quanto no desktop
  const isOwner = user && SUPER_ADMINS.includes((user.email||"").trim().toLowerCase());
  const [view,setView]=useState("inicio");
  const [chooserOpen,setChooserOpen]=useState(false); // "Sou Jovem" / "Sou casal de tios"
  const [cadKind,setCadKind]=useState(null); // "jovem" | "tios" — form de novo cadastro aberto
  const [senhaOpen,setSenhaOpen]=useState(false);
  useLucide();
  const isMobile=useIsMobile();
  const [person,setPerson]=useState(null);
  const [editPerson,setEditPerson]=useState(null);
  const [teamFilter,setTeamFilter]=useState(null);
  const openCadChooser=()=>setChooserOpen(true); // Início: pergunta o tipo antes
  const openCadJovem=()=>setCadKind("jovem"); // tela Jovens: já sabe o tipo
  const openCadTios=()=>setCadKind("tios"); // tela Tios: já sabe o tipo
  const openPerson=p=>setPerson(p);
  const openTeam=t=>{ setTeamFilter(t); setView("jovens"); };
  const clearTeam=()=>setTeamFilter(null);
  const go=id=>{ setTeamFilter(null); setView(id); };
  const saveFicha=async f=>{ await addJovem(formToJovem(f)); setCadKind(null); setTeamFilter(null); setView("jovens"); };
  const saveTios=async f=>{ await addTio(formToTio(f)); setCadKind(null); setTeamFilter(null); setView("tios"); };
  let screen;
  if(view==="jovens") screen=<Jovens onNovo={openCadJovem} onOpenPerson={openPerson} teamFilter={teamFilter} onClearTeam={clearTeam}/>;
  else if(view==="tios") screen=<Tios onNovo={openCadTios} onOpenPerson={openPerson}/>;
  else if(view==="montagem") screen=<Montagem/>;
  else if(view==="form") screen=<NovoFormulario/>;
  else if(view==="relatorios") screen=<Relatorios/>;
  else if(view==="calendario") screen=<Calendario/>;
  else if(view==="config" && isOwner) screen=<Configuracoes user={user} onEditPerson={p=>setEditPerson(p)}/>;
  else screen=<Inicio onNovo={openCadChooser} onOpenPerson={openPerson} onOpenTeam={openTeam} onOpenCalendario={()=>go("calendario")}/>;

  const editIsTio = editPerson && editPerson.mjc===undefined;
  const editarSalvarJovem=async f=>{ await updateJovem(editPerson.id, fichaToFields(f)); setEditPerson(null); };
  const editarSalvarTio=async f=>{ await updateTio(editPerson.id, fichaToTioFields(f)); setEditPerson(null); };
  const overlays = <>
    {chooserOpen && <TipoCadastroModal onClose={()=>setChooserOpen(false)} onChoose={k=>{ setChooserOpen(false); setCadKind(k); }}/>}
    {cadKind==="jovem" && <FichaForm onClose={()=>setCadKind(null)} onSave={saveFicha}/>}
    {cadKind==="tios" && <TiosForm onClose={()=>setCadKind(null)} onSave={saveTios}/>}
    {person && <PersonDetail person={person} onClose={()=>setPerson(null)} onEdit={()=>{ setEditPerson(person); setPerson(null); }}/>}
    {editPerson && !editIsTio && <FichaForm initial={editPerson.ficha||{}} selfId={editPerson.id} overline={"EDITAR CADASTRO"} title={"Editar "+editPerson.n} saveLabel="Salvar alterações" onClose={()=>setEditPerson(null)} onSave={editarSalvarJovem}/>}
    {editPerson && editIsTio && <TiosForm initial={editPerson.ficha||{}} overline={"EDITAR CADASTRO"} title={"Editar "+editPerson.n} saveLabel="Salvar alterações" onClose={()=>setEditPerson(null)} onSave={editarSalvarTio}/>}
    {senhaOpen && <TrocarSenhaModal onClose={()=>setSenhaOpen(false)}/>}
  </>;

  if(isMobile){
    return (
      <div style={{minHeight:"100vh",display:"flex",flexDirection:"column"}}>
        <main style={{flex:1,minWidth:0,background:"var(--surface-2)",padding:"18px 16px 84px"}}>{screen}</main>
        <nav style={{position:"fixed",bottom:0,left:0,right:0,background:"var(--surface)",boxShadow:"0 -6px 20px rgba(74,46,26,.12)",display:"flex",alignItems:"center",gap:4,padding:"8px 6px",zIndex:40}}>
          <div style={{display:"flex",alignItems:"center",gap:2,overflowX:"auto",flex:1,minWidth:0}}>
            {NAV.map(it=>{const on=it.id===view;
              return <button key={it.id} title={it.label} onClick={()=>go(it.id)} style={{flex:"0 0 auto",minWidth:60,border:"none",cursor:"pointer",background:"transparent",display:"flex",flexDirection:"column",alignItems:"center",gap:3,padding:"6px 4px",color:on?"var(--brand-brown)":"var(--text-2)"}}>
                <span style={{width:38,height:32,borderRadius:99,display:"inline-flex",alignItems:"center",justifyContent:"center",background:on?"var(--brand-brown-soft)":"transparent"}}><Icon name={it.icon} size={19}/></span>
                <span style={{fontSize:10,fontWeight:on?700:500,whiteSpace:"nowrap"}}>{it.label}</span>
              </button>;})}
          </div>
          <div style={{flex:"0 0 auto",paddingLeft:4,borderLeft:"1px solid var(--hairline)"}}>
            <RailAvatarMenu user={user} isOwner={isOwner} onOpenConfig={()=>go("config")} onOpenSenha={()=>setSenhaOpen(true)} onLogout={onLogout} align="right" drop="up"/>
          </div>
        </nav>
        {overlays}
      </div>
    );
  }

  return (
    <div style={{display:"flex",gap:18,height:"calc(100vh - 44px)",minHeight:600}}>
      <nav style={{width:"var(--rail-w)",background:"var(--surface)",borderRadius:"var(--r-2xl)",boxShadow:"var(--shadow-rail)",padding:"16px 0",display:"flex",flexDirection:"column",alignItems:"center",gap:6,flex:"0 0 auto"}}>
        <span style={{width:48,height:48,borderRadius:"50%",overflow:"hidden",display:"inline-flex",alignItems:"center",justifyContent:"center",marginBottom:14,boxShadow:"var(--shadow-xs)"}}>
          <img src="../design_system_unzip/ejc_claude/assets/ejc-logo.png" alt="EJC" style={{width:"92%",height:"92%",objectFit:"contain"}}/>
        </span>
        <div style={{display:"flex",flexDirection:"column",gap:6,flex:1}}>
          {NAV.map(it=>{const on=it.id===view;
            return <button key={it.id} title={it.label} onClick={()=>go(it.id)} style={{position:"relative",width:46,height:46,borderRadius:99,border:"none",cursor:"pointer",display:"inline-flex",alignItems:"center",justifyContent:"center",fontSize:20,background:on?"var(--brand-brown)":"transparent",color:on?"var(--on-brand)":"var(--text-2)",transition:"all .15s"}}>
              <Icon name={it.icon} size={20}/>
            </button>;})}
        </div>
        <RailAvatarMenu user={user} isOwner={isOwner} onOpenConfig={()=>go("config")} onOpenSenha={()=>setSenhaOpen(true)} onLogout={onLogout}/>
      </nav>
      <main style={{flex:1,minWidth:0,background:"var(--surface-2)",borderRadius:"var(--r-2xl)",padding:"28px 30px",overflow:"auto"}}>{screen}</main>
      {overlays}
    </div>
  );
}

function AuthShell({ children }){

function ResetPasswordScreen({ onDone }){
  const [senha,setSenha]=useState("");
  const [senha2,setSenha2]=useState("");
  const [errs,setErrs]=useState({});
  const [busy,setBusy]=useState(false);
  const salvar=async ()=>{
    if(busy) return;
    const e={};
    if(!senha || senha.length<4) e.senha="A senha precisa de ao menos 4 caracteres.";
    if(senha2!==senha) e.senha2="As senhas não conferem.";
    setErrs(e);
    if(Object.keys(e).length) return;
    setBusy(true);
    const r=await Auth.updatePassword(senha);
    setBusy(false);
    if(!r.ok){ setErrs({senha:r.error}); return; }
    // limpa o token da URL e segue pro app já logado
    history.replaceState(null,"",window.location.pathname);
    onDone();

/* ======================================================================
   ÁREA DO MEMBRO — só a própria ficha
   ====================================================================== */
function MemberArea({ user, onLogout }){
  const { jovens, tios, addJovem, updateJovem, addTio, updateTio, loading } = useStore();
  const meuJovem = jovens[0] || null; // RLS já garante que só a própria linha chega até aqui
  const meuTio = tios[0] || null;
  const meu = meuJovem || meuTio;
  const meuTipo = meuJovem ? "jovem" : (meuTio ? "tios" : null); // null = ainda não escolheu/preencheu
  const [manualEdit,setManualEdit]=useState(false);
  const [senhaOpen,setSenhaOpen]=useState(false);
  const [tipoEscolhido,setTipoEscolhido]=useState(null); // "jovem"|"tios" — escolha no primeiro cadastro
  useLucide();

  // só fecha o formulário se realmente salvou — se der erro (ex: RLS), avisa e mantém aberto
  const salvarJovem=async (f)=>{
    const r = meuJovem
      ? await updateJovem(meuJovem.id, fichaToFields(f))
      : await addJovem({...formToJovem({...f, email:f.email||user.email}), user_id:user.id});
    if(r && r.error){ alert("Não deu para salvar sua ficha: "+(r.error.message||r.error)+"\n\nTire um print e avise o dirigente."); return; }
    setManualEdit(false); setTipoEscolhido(null);
  };
  const salvarTio=async (f)=>{
    const r = meuTio
      ? await updateTio(meuTio.id, fichaToTioFields(f))
      : await addTio({...formToTio(f), user_id:user.id});
    if(r && r.error){ alert("Não deu para salvar a ficha dos tios: "+(r.error.message||r.error)+"\n\nTire um print e avise o dirigente."); return; }
    setManualEdit(false); setTipoEscolhido(null);
  };

  if(loading) return <div style={{minHeight:"calc(100vh - 44px)",display:"flex",alignItems:"center",justifyContent:"center",color:"var(--text-2)"}}>Carregando...</div>;

  const editing = manualEdit || !meu;

  // primeiro acesso, ainda sem ficha nenhuma: pergunta jovem ou tios antes de abrir o formulário
  if(editing && !meu && !tipoEscolhido) return <TipoCadastroModal onClose={onLogout} onChoose={setTipoEscolhido}/>;

  if(editing){
    const tipo = meuTipo || tipoEscolhido; // editando já-existente usa o tipo real; primeiro cadastro usa a escolha
    if(tipo==="tios") return <TiosForm
      initial={meuTio?meuTio.ficha:{}}
      overline={meuTio?"ATUALIZAR CADASTRO":"MEU CADASTRO"}
      title={meuTio?"Atualizar ficha dos tios":"Preencher ficha dos tios"}
      saveLabel={meuTio?"Salvar alterações":"Concluir cadastro"}
      onClose={()=>{ if(meuTio) setManualEdit(false); else { setTipoEscolhido(null); } }}
      onSave={salvarTio}/>;
    return <FichaForm
      initial={meuJovem?meuJovem.ficha:{email:user.email}}
      selfId={meuJovem?meuJovem.id:null}
      overline={meuJovem?"ATUALIZAR CADASTRO":"MEU CADASTRO"}
      title={meuJovem?"Atualizar minha ficha":"Preencher minha ficha"}
      saveLabel={meuJovem?"Salvar alterações":"Concluir cadastro"}
      onClose={()=>{ if(meuJovem) setManualEdit(false); else { setTipoEscolhido(null); } }}
      onSave={salvarJovem}/>;
  }

  return <div style={{minHeight:"calc(100vh - 44px)"}}>
    <div style={{maxWidth:820,margin:"0 auto",padding:"18px 22px",display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
      <span style={{width:44,height:44,borderRadius:"50%",overflow:"hidden",display:"inline-flex",alignItems:"center",justifyContent:"center",boxShadow:"var(--shadow-xs)",background:"var(--surface)",flex:"0 0 auto"}}>
        <img src="../design_system_unzip/ejc_claude/assets/ejc-logo.png" alt="EJC" style={{width:"90%",height:"90%",objectFit:"contain"}}/>
      </span>
      <div style={{marginRight:"auto",minWidth:0}}>
        <div className="mono-overline">MEU CADASTRO</div>
        <div style={{fontSize:15,fontWeight:700,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{meu?meu.n:user.email}</div>
      </div>
      <Button variant="ghost" iconLeft={<Icon name="key-round" size={16}/>} onClick={()=>setSenhaOpen(true)}>Alterar senha</Button>
      <Button variant="secondary" iconLeft={<Icon name="log-out" size={16}/>} onClick={onLogout}>Sair</Button>
    </div>
    {senhaOpen && <TrocarSenhaModal onClose={()=>setSenhaOpen(false)}/>}
    <div style={{maxWidth:820,margin:"0 auto",padding:"6px 22px 40px"}}>
      {/* Próximos eventos do movimento (somente leitura) no topo */}
      <EventosResumoMembro/>
      <div style={{display:"flex",alignItems:"center",gap:10,background:"var(--brand-yellow-soft)",color:"var(--on-yellow)",borderRadius:"var(--r-md)",padding:"12px 16px",margin:"6px 0 18px",fontSize:13,fontWeight:600}}>
        <Icon name="shield-check" size={16}/>Você está na sua área pessoal. Aqui você só vê e atualiza a sua própria ficha.
      </div>
      <PersonInlineDetail person={meu} onEdit={()=>setManualEdit(true)}/>
    </div>
  </div>;
}

/* ======================================================================
   GATE — sessão do Supabase → resolve papel (dirigente/membro) → App ou MemberArea
   ====================================================================== */
function Gate(){
  const [state,setState]=useState({loading:true, session:null});
  const [mode,setMode]=useState("login"); // login | signup | forgot
  // se a pessoa chegou pelo link de recuperação, a URL traz type=recovery no hash — já entra na tela de nova senha
  const [recovery,setRecovery]=useState(()=> typeof window!=="undefined" && window.location.hash.includes("type=recovery"));

  useEffect(()=>{
    let active=true;
    supabase.auth.getSession().then(({data})=>{ if(active) setState({loading:false, session:data.session}); });
    const { data:sub } = supabase.auth.onAuthStateChange((event, session)=>{
      if(event==="PASSWORD_RECOVERY") setRecovery(true);
      setState({loading:false, session});
    });
    return ()=>{ active=false; sub.subscription.unsubscribe(); };
  },[]);

  if(state.loading) return <AuthShell><div style={{textAlign:"center",padding:"30px 0",color:"var(--text-2)"}}>Carregando...</div></AuthShell>;

  if(recovery) return <ResetPasswordScreen onDone={()=>setRecovery(false)}/>;

  if(!state.session){
    if(mode==="signup") return <SignupScreen onGoLogin={()=>setMode("login")}/>;
    if(mode==="forgot") return <ForgotPasswordScreen onGoLogin={()=>setMode("login")}/>;
    return <LoginScreen onGoSignup={()=>setMode("signup")} onGoForgot={()=>setMode("forgot")}/>;
  }
  return <AuthedGate session={state.session} onLogout={Auth.logout}/>;
}

// depois de logado: descobre se é dirigente (linha em `dirigentes`) ou membro comum.
// dirigente = tem linha em `dirigentes` com o MESMO e-mail (independe de user_id).
// A RLS `is_dirigente()` (por e-mail) devolve todas as linhas se a pessoa for dirigente,
// senão devolve vazio — então achar a própria linha por e-mail é suficiente e robusto.
function AuthedGate({ session, onLogout }){
  const [roleInfo,setRoleInfo]=useState(null);
  useEffect(()=>{
    let active=true;
    (async ()=>{
      const emailL=(session.user.email||"").trim().toLowerCase();
      const { data:todos } = await supabase.from("dirigentes").select("*");
      // dirigente = casa por user_id (admins existentes) OU por e-mail (convidados novos)
      let mine=(todos||[]).find(d=>d.user_id===session.user.id)
            || (todos||[]).find(d=>(d.email||"").trim().toLowerCase()===emailL)
            || null;
      // vincula o user_id na primeira vez (só pra limpar o "Convite pendente" na tela)
      if(mine && !mine.user_id){
        try{ const { data:upd } = await supabase.from("dirigentes").update({user_id:session.user.id}).eq("id",mine.id).select().maybeSingle(); if(upd) mine=upd; }catch(e){}
      }
      if(!active) return;
      setRoleInfo(mine ? { role:"admin", nome:mine.nome, cargo:mine.cargo } : { role:"membro" });
    })();
    return ()=>{ active=false; };
  },[session.user.id]);

  if(!roleInfo) return <AuthShell><div style={{textAlign:"center",padding:"30px 0",color:"var(--text-2)"}}>Carregando...</div></AuthShell>;

  const user = { id:session.user.id, email:session.user.email, role:roleInfo.role, nome:roleInfo.nome, cargo:roleInfo.cargo };
  return <StoreProvider user={user}>
    {user.role==="admin" ? <AdminGate user={user} onLogout={onLogout}/> : <MemberArea user={user} onLogout={onLogout}/>}
  </StoreProvider>;
}

// dirigente sem ficha própria ainda (convite recém-aceito) → obriga a preencher antes do painel
function AdminGate({ user, onLogout }){
  const { jovens, addJovem, loading } = useStore();
  const meuJovem = jovens.find(j=>j.user_id===user.id);
  useLucide();
  if(loading) return <div style={{minHeight:"calc(100vh - 44px)",display:"flex",alignItems:"center",justifyContent:"center",color:"var(--text-2)"}}>Carregando...</div>;
  if(!meuJovem) return <FichaForm
    initial={{email:user.email}}
    overline="BEM-VINDO(A), DIRIGENTE"
    title="Complete seu cadastro"
    saveLabel="Concluir cadastro"
    onClose={onLogout}
    onSave={async f=>{ await addJovem({...formToJovem(f), user_id:user.id}); }}/>;
  return <App user={user} onLogout={onLogout}/>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<Gate/>);
