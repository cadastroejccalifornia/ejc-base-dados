const { useState, useEffect, useRef } = React;

/* ---------- responsividade ---------- */
function useIsMobile(bp=760){
  const [m,setM]=useState(typeof window!=="undefined" && window.innerWidth<bp);
  useEffect(()=>{
    const on=()=>setM(window.innerWidth<bp);
    on();
    window.addEventListener("resize",on);
    return ()=>window.removeEventListener("resize",on);
  },[bp]);
  return m;
}

/* ---------- Icon ---------- */
function Icon({ name, size = 20 }) {
  return <span style={{ fontSize: size, display: "inline-flex" }}><i data-lucide={name}></i></span>;
}
function useLucide(){ useEffect(() => { if (window.lucide) window.lucide.createIcons(); }); }

/* ---------- primitives (mirror of the DS components) ---------- */
function IconButton({ variant="default", size=42, label, children, ...r }){
  const v = variant==="dark" ? {background:"var(--brand-brown)",color:"var(--on-brand)",boxShadow:"var(--shadow-sm)"}
    : variant==="soft" ? {background:"var(--surface-2)",color:"var(--text-2)"}
    : {background:"var(--surface)",color:"var(--text)",boxShadow:"var(--shadow-sm)"};
  return <button aria-label={label} title={label} {...r} style={{width:size,height:size,borderRadius:"var(--r-pill)",border:"none",cursor:"pointer",display:"inline-flex",alignItems:"center",justifyContent:"center",...v}}>{children}</button>;
}
function Button({ variant="primary", children, iconLeft, style, ...r }){
  const v = variant==="secondary" ? {background:"var(--surface)",color:"var(--text)",boxShadow:"var(--shadow-sm)"}
    : variant==="ghost" ? {background:"transparent",color:"var(--text-2)"}
    : {background:"var(--brand-brown)",color:"var(--on-brand)",boxShadow:"var(--shadow-sm)"};
  return <button {...r} style={{display:"inline-flex",alignItems:"center",gap:8,fontFamily:"var(--font-sans)",fontWeight:600,fontSize:14,padding:"10px 18px",borderRadius:"var(--r-pill)",border:"none",cursor:"pointer",...v,...style}}>{iconLeft}{children}</button>;
}
const TONES={neutral:["var(--surface-2)","var(--text-2)"],brand:["var(--brand-brown-soft)","var(--brand-brown)"],yellow:["var(--brand-yellow-soft)","var(--on-yellow)"],success:["var(--success-soft)","var(--success)"],warning:["var(--warning-soft)","var(--warning)"],danger:["var(--danger-soft)","var(--danger)"],info:["var(--info-soft)","var(--info)"]};
function Badge({ tone="neutral", dot, children }){
  const [bg,fg]=TONES[tone]||TONES.neutral;
  return <span style={{display:"inline-flex",alignItems:"center",gap:6,background:bg,color:fg,fontSize:12,fontWeight:600,padding:"5px 11px",borderRadius:99,whiteSpace:"nowrap"}}>{dot&&<span style={{width:6,height:6,borderRadius:"50%",background:"currentColor"}}/>}{children}</span>;
}
function Tag({ color="var(--cat-brown)", children }){
  return <span style={{display:"inline-flex",alignItems:"center",gap:7,background:"var(--surface-2)",fontSize:13,fontWeight:500,color:"var(--text)",padding:"5px 11px",borderRadius:99,whiteSpace:"nowrap"}}><span style={{width:8,height:8,borderRadius:"50%",background:color}}/>{children}</span>;
}
function Avatar({ src, name="", size=44, ring }){
  const initials=name.split(" ").filter(Boolean).slice(0,2).map(n=>n[0]).join("").toUpperCase();
  return <span style={{width:size,height:size,borderRadius:"50%",overflow:"hidden",display:"inline-flex",alignItems:"center",justifyContent:"center",background:"var(--brand-brown-soft)",color:"var(--brand-brown)",fontWeight:700,fontSize:size*0.36,flex:"0 0 auto",boxShadow:ring?"0 0 0 3px var(--surface),0 0 0 5px var(--brand-yellow)":"var(--shadow-xs)"}}>{src?<img src={src} alt={name} style={{width:"100%",height:"100%",objectFit:"cover"}}/>:initials}</span>;

function Card({ title, subtitle, action, children, style, pad="var(--card-pad)" }){

function SearchInput({ placeholder, value, onChange, autoFocus, minWidth=200, maxWidth=440 }){

const CIRCULOS=["Amarelo","Verde","Vermelho","Laranja","Azul","Rosa","Não lembro"];
const CIRCULO_COR={Amarelo:"#F1C40F",Verde:"#3FA34D",Vermelho:"#D64545",Laranja:"#E8833A",Azul:"#3B82C4",Rosa:"#E86BA5","Não lembro":"var(--text-3)"};

// numeral romano (1-39) — usado na lista de ECC dos tios (sem ano, ao contrário do EJC_YEARS)
function toRoman(num){
  const vals=[[10,"X"],[9,"IX"],[5,"V"],[4,"IV"],[1,"I"]];
  let s=""; for(const [v,r] of vals){ while(num>=v){ s+=r; num-=v; } } return s;
}
// XXIX ECC, XXVIII ECC, ... até I ECC (índice 0 = mais recente = XXIX) — ECC é o encontro dos tios,
// numeração própria e diferente do EJC (por isso não vai até XXXI como o EJC_YEARS)
const ECC_LIST=(()=>{ const a=[]; for(let n=29;n>=1;n--) a.push(toRoman(n)+" ECC"); return a; })();
// XXXI EJC, XXX EJC, ... até I EJC — usado só na lista de "equipes que serviu" dos tios
// (eles podem ter servido em edições do EJC, que vai até XXXI, mesmo o ECC deles sendo outra numeração)
const EJC_LIST_SIMPLES=(()=>{ const a=[]; for(let n=31;n>=1;n--) a.push(toRoman(n)+" EJC"); return a; })();
// regra dos tios: XXIX → só 1 equipe; XXVIII → só 2; o restante → até 3 (2 padrão + opção de +1)
function maxEquipesEcc(qualFez){
  const idx=ECC_LIST.indexOf(qualFez);
  if(idx===0) return 1;
  if(idx===1) return 2;
  if(idx>=2) return 3;
  return 2;
}

// ---------- mapeamento: linha do banco <-> forma usada nas telas ----------
function rowToJovem(r){
  return { id:r.id, user_id:r.user_id, ts:new Date(r.created_at).getTime(), n:r.nome, tel:r.telefone, mjc:r.mjc, ejc:r.ejc, end:r.endereco, inst:r.instrumento, ativo:r.ativo, foto:r.foto, ficha:r.ficha };
}
function jovemToRow(j){
  const row={ nome:j.n, telefone:j.tel, mjc:j.mjc, ejc:j.ejc, endereco:j.end, instrumento:j.inst, ativo:j.ativo, foto:j.foto||null, ficha:j.ficha };
  if(j.user_id) row.user_id=j.user_id;
  return row;
}
function rowToTio(r){ return { id:r.id, user_id:r.user_id, ts:new Date(r.created_at).getTime(), n:r.nome, tel:r.telefone, ejc:r.ejc, end:r.endereco, ativo:r.ativo, foto:r.foto, ficha:r.ficha }; }
function tioToRow(t){
  const row={ nome:t.n, telefone:t.tel, ejc:t.ejc, endereco:t.end, ativo:t.ativo, foto:t.foto||null, ficha:t.ficha };
  if(t.user_id) row.user_id=t.user_id;
  return row;
}
// nome/apelido curto de uma pessoa do casal (usado no nome do card)
function apelidoOuPrimeiro(nome,apelido){
  if(apelido&&apelido.trim()) return apelido.trim();
  return (nome||"").trim().split(/\s+/)[0]||"";
}
// campos-resumo derivados da ficha do casal de tios
function fichaToTioFields(f){
  const tiaLbl=apelidoOuPrimeiro(f.tiaNome,f.tiaApelido)||"Tia";
  const tioLbl=apelidoOuPrimeiro(f.tioNome,f.tioApelido)||"Tio";
  const tel = f.tiaTelPrincipal ? f.tiaTel : f.tioTelPrincipal ? f.tioTel : (f.tiaTel||f.tioTel);
  const ejc = f.fezCalifornia ? (f.qualFez||"—") : (f.qualEcc||"—");
  return { n:"Tia "+tiaLbl+" e Tio "+tioLbl, tel:tel||"—", ejc, end:"—", inst:null, foto:f.foto||null, ficha:f };
}
function formToTio(f){ return { ativo:true, ...fichaToTioFields(f) }; }
function rowToMontagem(r){ return { id:r.id, nome:r.nome, autor:r.autor, visib:r.visibilidade, cells:r.cells||{} }; }
function montagemToRow(m){ return { nome:m.nome, autor:m.autor, visibilidade:m.visib }; }
function rowToForm(r){ return { id:r.id, nome:r.nome, favorito:r.favorito, sistema:r.sistema, campos:r.campos||[] }; }
function rowToDirigente(r){ return { id:r.id, user_id:r.user_id, nome:r.nome, email:r.email, cargo:r.cargo }; }
function rowToEvento(r){ return { id:r.id, titulo:r.titulo, data:r.data, descricao:r.descricao }; }

// monta o endereço completo legível a partir das partes da ficha
function enderecoCompleto(f){
  const rua=[f.endereco,f.complemento].filter(Boolean).join(", ");
  const local=[f.bairro,f.cidade].filter(Boolean).join(", ");
  return [rua,local].filter(Boolean).join(" — ") || "—";
}
// campos-resumo derivados da ficha
function fichaToFields(f){
  const mjc = f.mjcAtual && f.mjcAtual!=="Não estou em nenhuma" ? f.mjcAtual : "—";
  const ejc = f.fezCalifornia ? (f.anoEjc||"—") : (f.qualEjc||"—");
  const inst = f.musico && (f.instrumentos||[]).length ? f.instrumentos.join(", ") : null;
  // regra: só fica "Ativo" quem está numa equipe do MJC
  return { n:(f.nome||"").trim()||"Sem nome", tel:f.whats||"—", mjc, ejc, end:enderecoCompleto(f), inst, foto:f.foto||null, ficha:f, ativo: mjc!=="—" };
}
// converte a Ficha preenchida numa nova linha da base
function formToJovem(f){
  return fichaToFields(f);
}

/* ---------- autenticação (Supabase Auth) ----------
   O papel (admin/membro) é resolvido consultando a tabela `dirigentes`: existe linha com
   user_id = auth.uid() → é dirigente (admin); senão é membro e só enxerga a própria linha
   em `jovens` (garantido pelas políticas de RLS no banco, não só pela UI). */
const Auth={
  async login(email,senha){
    const { error } = await supabase.auth.signInWithPassword({ email:(email||"").trim(), password:senha });
    if(error) return { ok:false, error: /invalid login credentials/i.test(error.message) ? "E-mail ou senha incorretos." : error.message };
    return { ok:true };
  },
  async signup(email,senha){
    const { data, error } = await supabase.auth.signUp({ email:(email||"").trim(), password:senha });
    if(error) return { ok:false, error: /already registered|already exists/i.test(error.message) ? "Este e-mail já tem conta. Faça login." : error.message };
    return { ok:true, needsConfirm: !data.session };
  },
  async logout(){ await supabase.auth.signOut(); },
  // envia e-mail com link pra redefinir a senha (usuário deslogado)
  async requestReset(email){
    const redirect = window.location.origin + window.location.pathname;
    const { error } = await supabase.auth.resetPasswordForEmail((email||"").trim().toLowerCase(), { redirectTo: redirect });
    if(error) return { ok:false, error: /rate limit/i.test(error.message) ? "Muitas tentativas em pouco tempo — espere alguns minutos e tente de novo." : error.message };
    return { ok:true };
  },
  // define a nova senha (usuário já autenticado — via link de recuperação ou logado na plataforma)
  async updatePassword(senha){
    const { error } = await supabase.auth.updateUser({ password:senha });
    if(error) return { ok:false, error:error.message };
    return { ok:true };
  },
  // admin envia e-mail de redefinição pra OUTRA pessoa (por e-mail) — funciona no navegador
  async resetOutro(email){
    const { error } = await supabase.auth.resetPasswordForEmail((email||"").trim().toLowerCase(), { redirectTo: window.location.origin + window.location.pathname });
    if(error) return { ok:false, error: /rate limit/i.test(error.message) ? "Muitas tentativas em pouco tempo — espere alguns minutos." : error.message };
    return { ok:true };
  },
  // admin DEFINE a senha de outra pessoa direto — precisa da Edge Function `admin-set-password` no Supabase
  async setUserPassword(email, senha){
    try{
      const { data, error } = await supabase.functions.invoke("admin-set-password", { body:{ email:(email||"").trim().toLowerCase(), password:senha } });
      if(error){
        let msg=error.message||"Não deu certo.";
        try{ if(error.context && error.context.json){ const t=await error.context.json(); if(t&&t.error) msg=t.error; } }catch(_){}
        if(/not found|failed to send|fetch|non-2xx/i.test(msg)) msg="A função de servidor 'admin-set-password' ainda não foi criada no Supabase. Use o envio por e-mail, ou peça pra ativar essa função.";
        return { ok:false, error:msg };
      }
      if(data && data.error) return { ok:false, error:data.error };
      return { ok:true };
    }catch(e){ return { ok:false, error:String(e&&e.message||e) }; }
  },
};

function StoreProvider({ user, children }){
  const [jovens,setJovens]=useState([]);
  const [tios,setTios]=useState([]);
  const [montagens,setMontagens]=useState([]);
  const [formularios,setFormularios]=useState([]);
  const [dirigentes,setDirigentes]=useState([]);
  const [eventos,setEventos]=useState([]);
  const [loading,setLoading]=useState(true);
  const isAdmin = user.role==="admin";

  useEffect(()=>{
    let active=true;
    (async ()=>{
      setLoading(true);
      const [jRes,tRes,mRes,fRes,dRes,eRes] = await Promise.all([
        supabase.from("jovens").select("*").order("created_at",{ascending:false}),
        supabase.from("tios").select("*").order("created_at",{ascending:false}), // membro só recebe a própria linha (RLS)
        isAdmin ? supabase.from("montagens").select("*").order("created_at",{ascending:false}) : Promise.resolve({data:[]}),
        supabase.from("formularios").select("*"),
        isAdmin ? supabase.from("dirigentes").select("*") : Promise.resolve({data:[]}),
        supabase.from("eventos").select("*").order("data",{ascending:true}), // membros também leem (RLS permite ver)
      ]);
      if(!active) return;
      setJovens((jRes.data||[]).map(rowToJovem));
      setTios((tRes.data||[]).map(rowToTio));
      setMontagens((mRes.data||[]).map(rowToMontagem));
      setFormularios((fRes.data||[]).map(rowToForm));
      setDirigentes((dRes.data||[]).map(rowToDirigente));
      setEventos((eRes.data||[]).map(rowToEvento)); // tabela pode não existir ainda → fica vazio sem quebrar
      setLoading(false);
    })();
    return ()=>{ active=false; };
  },[user.id]);

  const api={
    jovens, tios, montagens, formularios, dirigentes, eventos, loading,
    addJovem: async (j)=>{
      const { data, error } = await supabase.from("jovens").insert(jovemToRow(j)).select().single();
      if(!error) setJovens(l=>[rowToJovem(data),...l]);
      return { data: data?rowToJovem(data):null, error };
    },
    updateJovem: async (id,patch)=>{
      const { data, error } = await supabase.from("jovens").update(jovemToRow(patch)).eq("id",id).select().single();
      if(!error) setJovens(l=>l.map(j=>j.id===id?rowToJovem(data):j));
      return { data: data?rowToJovem(data):null, error };
    },
    addTio: async (t)=>{
      const { data, error } = await supabase.from("tios").insert(tioToRow(t)).select().single();
      if(!error) setTios(l=>[rowToTio(data),...l]);
      return { data: data?rowToTio(data):null, error };
    },
    updateTio: async (id,patch)=>{
      const { data, error } = await supabase.from("tios").update(tioToRow(patch)).eq("id",id).select().single();
      if(!error) setTios(l=>l.map(t=>t.id===id?rowToTio(data):t));
      return { data: data?rowToTio(data):null, error };
    },
    // convida um novo dirigente: cria o convite (user_id ainda nulo) e manda um e-mail de acesso.
    // quando a pessoa entrar pela primeira vez com esse e-mail, o AuthedGate reivindica o convite
    // automaticamente (ligando user_id) e a obriga a completar a própria ficha.
    inviteDirigente: async (d)=>{
      const email = (d.email||"").trim().toLowerCase();
      const { data, error } = await supabase.from("dirigentes").insert({ nome:d.nome, email, cargo:d.cargo }).select().single();
      if(error) return { data:null, error };
      setDirigentes(l=>[...l,rowToDirigente(data)]);
      const redirect = window.location.origin + window.location.pathname;
      const { error: otpError } = await supabase.auth.signInWithOtp({ email, options:{ emailRedirectTo: redirect } });
      return { data: rowToDirigente(data), error: otpError||null };
    },
    // corrige um convite ainda pendente (ex: e-mail digitado errado) e reenvia o link de acesso
    updateDirigenteConvite: async (id,d)=>{
      const email = (d.email||"").trim().toLowerCase();
      const { data, error } = await supabase.from("dirigentes").update({ nome:d.nome, email, cargo:d.cargo }).eq("id",id).select().single();
      if(error) return { data:null, error };
      setDirigentes(l=>l.map(x=>x.id===id?rowToDirigente(data):x));
      const redirect = window.location.origin + window.location.pathname;
      const { error: otpError } = await supabase.auth.signInWithOtp({ email, options:{ emailRedirectTo: redirect } });
      return { data: rowToDirigente(data), error: otpError||null };
    },
    removeDirigente: async (id)=>{
      const { error } = await supabase.from("dirigentes").delete().eq("id",id);
      if(!error) setDirigentes(l=>l.filter(d=>d.id!==id));
      return { error };
    },
    addEvento: async (ev)=>{
      const { data, error } = await supabase.from("eventos").insert({ titulo:ev.titulo, data:ev.data, descricao:ev.descricao||null }).select().single();
      if(!error) setEventos(l=>[...l,rowToEvento(data)].sort((a,b)=>a.data.localeCompare(b.data)));
      return { data: data?rowToEvento(data):null, error };
    },
    removeEvento: async (id)=>{
      const { error } = await supabase.from("eventos").delete().eq("id",id);
      if(!error) setEventos(l=>l.filter(e=>e.id!==id));
      return { error };
    },
    addMontagem: async (m)=>{
      const { data, error } = await supabase.from("montagens").insert(montagemToRow(m)).select().single();
      if(error) return null;
      const row=rowToMontagem(data); setMontagens(l=>[row,...l]); return row;
    },
    setMontagemCell: async (montId,tab,rowKey,person)=>{
      const m=montagens.find(x=>x.id===montId); if(!m) return;
      const tabCells={...(m.cells[tab]||{})};
      if(person) tabCells[rowKey]=person; else delete tabCells[rowKey]; // person null → remove da equipe
      const newCells={...m.cells,[tab]:tabCells};
      const { data, error } = await supabase.from("montagens").update({cells:newCells}).eq("id",montId).select().single();
      if(!error) setMontagens(l=>l.map(x=>x.id===montId?rowToMontagem(data):x));
    },
    addForm: async (f)=>{
      const { data, error } = await supabase.from("formularios").insert({ nome:f.nome, favorito:false, sistema:false, campos:f.campos||[] }).select().single();
      if(!error) setFormularios(l=>[...l,rowToForm(data)]);
    },
    updateForm: async (id,patch)=>{
      const { data, error } = await supabase.from("formularios").update({ nome:patch.nome, campos:patch.campos }).eq("id",id).select().single();
      if(!error) setFormularios(l=>l.map(f=>f.id===id?rowToForm(data):f));
    },
    deleteForm: async (id)=>{
      const { error } = await supabase.from("formularios").delete().eq("id",id);
      if(!error) setFormularios(l=>l.filter(f=>f.id!==id));
    },
    setFavorito: async (id)=>{
      setFormularios(l=>l.map(f=>({...f,favorito:f.id===id})));
      await supabase.from("formularios").update({favorito:false}).neq("id",id);
      await supabase.from("formularios").update({favorito:true}).eq("id",id);
    },
  };
  return <StoreContext.Provider value={api}>{children}</StoreContext.Provider>;
}

const pad2=n=>String(n).padStart(2,"0");
const MESES_PT=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const DIAS_ABREV=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
function parseNascBR(s){
  const m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec((s||"").trim());
  if(!m) return null;
  const dia=+m[1],mes=+m[2],ano=+m[3];
  if(dia<1||dia>31||mes<1||mes>12) return null;
  return {dia,mes,ano};
}
// aniversariantes ativos com data de nascimento válida
function aniversariantes(jovens){
  return (jovens||[]).filter(j=>j.ativo).map(j=>{ const p=j.ficha&&parseNascBR(j.ficha.nasc); return p?{j,dia:p.dia,mes:p.mes,ano:p.ano}:null; }).filter(Boolean);
}
function inicioSemana(base){ const d=new Date(base); d.setHours(0,0,0,0); d.setDate(d.getDate()-d.getDay()); return d; }
// (dia/mes) cai na janela [ini,fim]? considera virada de ano → retorna a Date ou null
function aniversarioNaJanela(dia,mes,ini,fim){
  const anos=Array.from(new Set([ini.getFullYear(),fim.getFullYear()]));
  for(let k=0;k<anos.length;k++){ const d=new Date(anos[k],mes-1,dia); d.setHours(0,0,0,0); if(d>=ini&&d<=fim) return d; }
  return null;
}
function ymd(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function fmtDataBR(s){ const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||""); return m?(m[3]+"/"+m[2]+"/"+m[1]):(s||""); }

function LinhaAniversario({ a, hoje }){
  const idade=(a.data?a.data.getFullYear():hoje.getFullYear())-a.ano;
  const ehHoje=a.data&&a.data.getDate()===hoje.getDate()&&a.data.getMonth()===hoje.getMonth();
  return <div style={{display:"flex",alignItems:"center",gap:12,background:ehHoje?"var(--brand-yellow-soft)":"var(--surface-2)",borderRadius:"var(--r-md)",padding:"10px 14px"}}>
    <Avatar src={a.j.foto} name={a.j.n} size={40}/>
    <div style={{flex:1,minWidth:0}}>
      <div style={{fontWeight:700,fontSize:14}}>{a.j.n}</div>
      <div style={{fontSize:12.5,color:"var(--text-2)"}}>{pad2(a.dia)}/{pad2(a.mes)}{a.data?(" · "+DIAS_ABREV[a.data.getDay()]):""}{ehHoje?" · Hoje 🎉":""}</div>
    </div>
    <Badge tone="brand">{idade} anos</Badge>
  </div>;
}

            {evs.slice(0,lim).map(e=><span key={e.id} style={{fontSize:10.5,fontWeight:600,background:"var(--brand-brown-soft)",color:"var(--brand-brown)",borderRadius:4,padding:"1px 4px",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{e.titulo}</span>)}
            {evs.length>lim && <span style={{fontSize:10,color:"var(--text-3)",fontWeight:600}}>+{evs.length-lim}</span>}
          </button>;
        })}
      </div>
    </Card>
    <Card title={"Eventos de "+MESES_PT[mes]} subtitle={doMes.length+(doMes.length===1?" evento":" eventos")}>
      {doMes.length===0
        ? <div style={{padding:"22px",textAlign:"center",color:"var(--text-3)",fontSize:14}}>{readonly?"Nenhum evento neste mês.":"Nenhum evento neste mês. Clique num dia do calendário ou em \"Adicionar evento\"."}</div>
        : <div style={{display:"flex",flexDirection:"column",gap:10}}>
            {doMes.map(e=>(
              <div key={e.id} style={{display:"flex",alignItems:"flex-start",gap:12,background:"var(--surface-2)",borderRadius:"var(--r-md)",padding:"12px 14px"}}>
                <span style={{width:44,textAlign:"center",flex:"0 0 auto"}}>
                  <div style={{fontSize:18,fontWeight:800,lineHeight:1}}>{e.data.slice(8,10)}</div>
                  <div style={{fontSize:10,color:"var(--text-3)",textTransform:"uppercase"}}>{diaSemanaDe(e.data)}</div>
                </span>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontWeight:700,fontSize:15}}>{e.titulo}</div>
                  {e.descricao && <div style={{fontSize:13,color:"var(--text-2)",marginTop:2,whiteSpace:"pre-wrap"}}>{e.descricao}</div>}
                </div>
                {!readonly && <IconButton label="Remover evento" size={32} variant="soft" onClick={()=>setConfirmar(e)}><Icon name="trash-2" size={15}/></IconButton>}
              </div>
            ))}
          </div>}
    </Card>
    {!readonly && addOpen && <NovoEventoModal dataInicial={addOpen.data} onClose={()=>setAddOpen(null)} onSave={addEvento}/>}
    {!readonly && confirmar && <div style={{position:"fixed",inset:0,background:"rgba(42,36,31,.32)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:80}} onClick={()=>setConfirmar(null)}>
      <div onClick={e=>e.stopPropagation()} style={{width:380,maxWidth:"92vw",background:"var(--surface)",borderRadius:"var(--r-xl)",boxShadow:"var(--shadow-lg)",padding:"24px"}}>
        <h3 style={{margin:"0 0 8px",fontSize:18,fontWeight:800}}>Remover evento</h3>
        <p style={{margin:"0 0 20px",fontSize:14,color:"var(--text-2)"}}>Remover "<b>{confirmar.titulo}</b>" ({fmtDataBR(confirmar.data)})?</p>
        <div style={{display:"flex",gap:10,justifyContent:"flex-end"}}>
          <Button variant="ghost" onClick={()=>setConfirmar(null)}>Cancelar</Button>
          <Button variant="primary" style={{background:"var(--brand-red)"}} iconLeft={<Icon name="trash-2" size={16}/>} onClick={async ()=>{ await removeEvento(confirmar.id); setConfirmar(null); }}>Remover</Button>
        </div>
      </div>
    </div>}
  </div>;
}

          style={{display:"flex",alignItems:"center",gap:14,padding:"14px 18px",borderBottom:"1px solid var(--hairline)",cursor:"pointer"}}>

// campos disponíveis pra exportação da montagem — nome e telefone são obrigatórios
const EXPORT_FIELDS=[
  {key:"n",label:"Nome",required:true,get:p=>p.n||""},
  {key:"tel",label:"Telefone",required:true,get:p=>p.tel||""},
  {key:"equipe",label:"Equipe (montagem)",get:(p,c)=>c.equipe||""},
  {key:"funcao",label:"Função",get:(p,c)=>c.funcao||""},
  {key:"ejc",label:"EJC que fez",get:p=>p.ejc||""},
  {key:"end",label:"Endereço",get:p=>p.end||""},
  {key:"inst",label:"Instrumento",get:p=>p.inst||""},
  {key:"mjc",label:"Equipe atual do MJC",get:p=>p.mjc||""},
  {key:"cpf",label:"CPF",get:p=>(p.ficha&&p.ficha.cpf)||""},
  {key:"email",label:"E-mail",get:p=>(p.ficha&&p.ficha.email)||""},
  {key:"apelido",label:"Apelido",get:p=>(p.ficha&&p.ficha.apelido)||""},
  {key:"nasc",label:"Data de nascimento",get:p=>(p.ficha&&p.ficha.nasc)||""},
  {key:"insta",label:"Instagram",get:p=>(p.ficha&&p.ficha.insta)||""},
  {key:"circulo",label:"Círculo",get:p=>(p.ficha&&p.ficha.circulo)||""},
  {key:"foto",label:"Foto (link)",link:true,get:p=>p.foto||""},
];
// nome da seção a partir da rowKey "<label>-<i>"
const funcaoDaRowKey = k => k.slice(0,k.lastIndexOf("-"));

function ExportarModal({ montagem, tabAtual, onClose }){
  useLucide();
  const [sel,setSel]=useState(()=>{ const o={}; EXPORT_FIELDS.forEach(f=>o[f.key]=f.required?true:["equipe","funcao","ejc"].includes(f.key)); return o; });
  const [escopo,setEscopo]=useState("montagem"); // montagem (todas as equipes) | equipe (só a aba atual)
  const toggle=k=>{ const f=EXPORT_FIELDS.find(x=>x.key===k); if(f.required) return; setSel(s=>({...s,[k]:!s[k]})); };

  // junta as pessoas (uma linha por alocação) conforme o escopo
  const coletaLinhas=()=>{
    const abas = escopo==="equipe" ? [tabAtual] : MONTAGEM_TABS;
    const linhas=[];
    abas.forEach(aba=>{
      const tc=(montagem.cells&&montagem.cells[aba])||{};
      Object.keys(tc).forEach(k=>{ const p=tc[k]; if(p) linhas.push({person:p, ctx:{equipe:aba, funcao:funcaoDaRowKey(k)}}); });
    });
    return linhas;
  };

  const exportar=()=>{
    const cols=EXPORT_FIELDS.filter(f=>sel[f.key]);
    const linhas=coletaLinhas();
    const dados=linhas.map(({person,ctx})=>{ const row={}; cols.forEach(c=>{ row[c.label]=c.get(person,ctx); }); return row; });
    const ws=XLSX.utils.json_to_sheet(dados,{header:cols.map(c=>c.label)});
    // colunas de link (ex: Foto) viram hyperlinks clicáveis no Excel
    cols.forEach((c,ci)=>{ if(!c.link) return; dados.forEach((row,ri)=>{
      const url=row[c.label]; if(!url) return;
      const addr=XLSX.utils.encode_cell({c:ci,r:ri+1}); // +1 pula o cabeçalho
      if(ws[addr]) ws[addr].l={Target:url,Tooltip:"Abrir foto"};
    }); });
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,"Montagem");
    const nomeArq=(montagem.nome||"montagem").replace(/[\\/:*?"<>|]/g,"-")+(escopo==="equipe"?(" - "+tabAtual):"")+".xlsx";
    XLSX.writeFile(wb,nomeArq);
    onClose();
  };

  const totalLinhas=coletaLinhas().length;
  const disponivel=typeof XLSX!=="undefined";

  return <div style={{position:"fixed",inset:0,background:"rgba(42,36,31,.32)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:70}} onClick={onClose}>
    <div onClick={e=>e.stopPropagation()} style={{width:520,maxWidth:"92vw",background:"var(--surface)",borderRadius:"var(--r-xl)",boxShadow:"var(--shadow-lg)",padding:"26px",maxHeight:"88vh",overflow:"auto"}}>
      <h3 style={{margin:"0 0 4px",fontSize:20,fontWeight:800}}>Exportar para Excel</h3>
      <p style={{margin:"0 0 18px",fontSize:14,color:"var(--text-2)"}}>Escolha os dados. Cada pessoa vira uma linha na planilha.</p>

      <label style={{display:"block",fontSize:13,fontWeight:700,marginBottom:8}}>O que exportar</label>
      <div style={{display:"flex",gap:8,marginBottom:18}}>
        {[["montagem","Toda a montagem"],["equipe","Só esta equipe ("+tabAtual+")"]].map(([v,l])=>(
          <button key={v} onClick={()=>setEscopo(v)} style={{flex:1,border:"none",cursor:"pointer",fontFamily:"var(--font-sans)",fontSize:13,fontWeight:600,padding:"11px",borderRadius:"var(--r-md)",background:escopo===v?"var(--brand-brown)":"var(--surface-2)",color:escopo===v?"var(--on-brand)":"var(--text-2)"}}>{l}</button>
        ))}
      </div>

      <label style={{display:"block",fontSize:13,fontWeight:700,marginBottom:8}}>Colunas <span style={{color:"var(--text-3)",fontWeight:500}}>· Nome e Telefone são obrigatórios</span></label>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))",gap:8,marginBottom:20}}>
        {EXPORT_FIELDS.map(f=>(
          <label key={f.key} style={{display:"inline-flex",alignItems:"center",gap:9,fontSize:14,padding:"9px 12px",borderRadius:"var(--r-md)",background:sel[f.key]?"var(--brand-brown-soft)":"var(--surface-2)",cursor:f.required?"not-allowed":"pointer",opacity:f.required?.85:1}}>
            <input type="checkbox" checked={!!sel[f.key]} disabled={f.required} onChange={()=>toggle(f.key)}/>
            <span style={{fontWeight:sel[f.key]?600:500}}>{f.label}</span>
          </label>
        ))}
      </div>

      {totalLinhas>0
        ? <div style={{display:"flex",alignItems:"center",gap:8,fontSize:13,color:"var(--text-2)",marginBottom:18}}>
            <Icon name="users" size={15}/>{totalLinhas} {totalLinhas===1?"pessoa":"pessoas"} nesta exportação.
          </div>
        : <div style={{display:"flex",alignItems:"center",gap:8,fontSize:13,color:"var(--on-yellow)",background:"var(--brand-yellow-soft)",borderRadius:"var(--r-md)",padding:"11px 14px",marginBottom:18,fontWeight:600}}>
            <Icon name="alert-triangle" size={15}/>{escopo==="equipe"?("Ninguém foi adicionado em "+tabAtual+" ainda. Escolha \"Toda a montagem\" ou adicione pessoas nessa equipe."):"Esta montagem ainda não tem ninguém adicionado. Adicione pessoas às equipes para poder exportar."}
          </div>}

      {!disponivel && <div style={{fontSize:13,color:"var(--brand-red)",fontWeight:600,marginBottom:14}}>A biblioteca de Excel não carregou. Verifique a conexão e recarregue a página.</div>}
      <div style={{display:"flex",gap:10,justifyContent:"flex-end"}}>
        <Button variant="ghost" onClick={onClose}>Cancelar</Button>
        <Button variant="primary" iconLeft={<Icon name="download" size={16}/>} onClick={exportar} disabled={!disponivel||totalLinhas===0} style={{opacity:(!disponivel||totalLinhas===0)?.5:1}}>Baixar Excel</Button>
      </div>
    </div>
  </div>;
}

function MontagemSheet({ montagem, onBack }){
  const { jovens, setMontagemCell } = useStore();
  const [tab,setTab]=useState(MONTAGEM_TABS[0]);
  const [exportOpen,setExportOpen]=useState(false);
  const setPerson=(rowKey,person)=>setMontagemCell(montagem.id,tab,rowKey,person);
  const teamData=(montagem.cells&&montagem.cells[tab])||{};
  const pool=jovens; // pool de busca (jovens)
  const sections=estruturaDaEquipe(tab);

  // equipes (abas) em que a pessoa já está, exceto a aba atual — pra avisar de duplicidade
  const equipesDaPessoa=(personId)=>{
    if(!personId||!montagem.cells) return [];
    return MONTAGEM_TABS.filter(t=>t!==tab).filter(t=>Object.values(montagem.cells[t]||{}).some(p=>p&&p.id===personId));
  };

  let rowIdx=0;
  const filledRow=(rowKey,person)=>{
    rowIdx++;
    const outras=equipesDaPessoa(person.id);
    const alerta=outras.length>0;
    return <tr key={rowKey} style={{borderBottom:"1px solid var(--hairline)",background:alerta?"color-mix(in oklch, var(--danger-soft) 45%, transparent)":"transparent"}}>
      <td style={{padding:"8px 8px 8px 12px",whiteSpace:"nowrap"}}>
        <span style={{display:"inline-flex",alignItems:"center",gap:8}}>
          <button title="Remover da equipe" aria-label="Remover da equipe" onClick={()=>setPerson(rowKey,null)} style={{border:"none",cursor:"pointer",background:"var(--danger-soft)",color:"var(--brand-red)",display:"inline-flex",alignItems:"center",justifyContent:"center",width:26,height:26,borderRadius:"50%",flex:"0 0 auto"}}><Icon name="x" size={15}/></button>
          <span style={{color:"var(--text-3)",fontWeight:700}}>{rowIdx}</span>
        </span>
      </td>
      <td style={{padding:"8px 14px"}}><Avatar src={person.foto} name={person.n} size={34}/></td>
      <td style={{padding:"8px 14px",whiteSpace:"nowrap"}}>
        <div style={{display:"inline-flex",flexDirection:"column",gap:3,...(alerta?{border:"2px solid var(--brand-red)",borderRadius:"var(--r-sm)",padding:"4px 9px"}:{})}}>
          <span style={{fontWeight:600}}>{person.n}</span>
          {alerta && <span style={{fontSize:11,color:"var(--brand-red)",fontWeight:700,display:"inline-flex",alignItems:"center",gap:4}}><Icon name="alert-triangle" size={12}/>Já está em: {outras.join(", ")}</span>}
        </div>
      </td>
      <td style={{padding:"8px 14px",color:"var(--text-2)",whiteSpace:"nowrap"}}>{person.tel}</td>
      <td style={{padding:"8px 14px",color:"var(--text-2)",whiteSpace:"nowrap"}}>{person.ejc}</td>
      <td style={{padding:"8px 14px",color:"var(--text-2)",maxWidth:220,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{person.end}</td>
      <td style={{padding:"8px 14px"}}>{person.inst?<Tag color="var(--cat-plum)">{person.inst}</Tag>:<span style={{color:"var(--text-3)"}}>—</span>}</td>
    </tr>;
  };
  const addRow=(rowKey)=>{
    rowIdx++;
    return <tr key={rowKey} style={{borderBottom:"1px solid var(--hairline)"}}>
      <td style={{padding:"8px 8px 8px 34px",color:"var(--text-3)",fontWeight:700}}>{rowIdx}</td>
      <td colSpan={6} style={{padding:"8px 14px"}}><AddPersonCell pool={pool} onPick={p=>setPerson(rowKey,p)}/></td>
    </tr>;
  };

  return <div>
    <Header title={montagem.nome}
      sub={"Responsável: "+montagem.autor+" · "+montagem.visib}
      right={<div style={{display:"flex",gap:8}}>
        <Button variant="primary" iconLeft={<Icon name="download" size={16}/>} onClick={()=>setExportOpen(true)}>Exportar</Button>
        <Button variant="secondary" iconLeft={<Icon name="arrow-left" size={16}/>} onClick={onBack}>Voltar às montagens</Button>
      </div>}/>
    {exportOpen && <ExportarModal montagem={montagem} tabAtual={tab} onClose={()=>setExportOpen(false)}/>}

    {/* Abas de equipes (estilo Excel) */}
    <div style={{display:"flex",gap:6,overflowX:"auto",paddingBottom:10,marginBottom:14}}>
      {MONTAGEM_TABS.map(t=>{const active=t===tab;return(
        <button key={t} onClick={()=>setTab(t)} style={{whiteSpace:"nowrap",border:"none",cursor:"pointer",fontFamily:"var(--font-sans)",fontSize:13,fontWeight:active?700:500,padding:"9px 15px",borderRadius:"var(--r-sm) var(--r-sm) 0 0",background:active?"var(--surface)":"var(--surface-2)",color:active?"var(--brand-brown)":"var(--text-2)",boxShadow:active?"var(--shadow-sm)":"none",borderBottom:active?"3px solid var(--brand-brown)":"3px solid transparent"}}>{t}</button>
      );})}
    </div>

    <Card pad="0" style={{overflow:"hidden"}}>
      <div style={{overflowX:"auto"}}>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:13,minWidth:900}}>
          <thead>
            <tr>
              {["#","Foto","Nome","Telefone","EJC que fez","Endereço","Instrumento"].map((c,i)=>(
                <th key={i} style={{padding:"11px 14px",textAlign:"left",fontSize:11,fontWeight:700,color:"var(--text-3)",textTransform:"uppercase",letterSpacing:".04em",background:"var(--surface-2)",whiteSpace:"nowrap"}}>{c}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {sections.map((sec)=>{
              // linhas preenchidas dessa seção (chaves "<label>-<i>")
              const filledKeys=Object.keys(teamData).filter(k=>k.startsWith(sec.label+"-")&&teamData[k]).sort((a,b)=>(+a.split("-").pop())-(+b.split("-").pop()));
              return <React.Fragment key={sec.label}>
                <tr><td colSpan={7} style={{padding:"10px 14px",background:"var(--surface-2)"}}>
                  <span style={{display:"inline-flex",alignItems:"center",gap:8,fontSize:12,fontWeight:700,color:sec.tone,textTransform:"uppercase",letterSpacing:".04em"}}>
                    <span style={{width:8,height:8,borderRadius:"50%",background:sec.tone}}/>{sec.label}
                    {sec.flex && <span style={{color:"var(--text-3)",fontWeight:600,textTransform:"none",letterSpacing:0}}>· {filledKeys.length}/{sec.count}</span>}
                  </span>
                </td></tr>
                {sec.flex
                  ? <>
                      {filledKeys.map(k=>filledRow(k,teamData[k]))}
                      {filledKeys.length<sec.count && addRow(sec.label+"-"+(filledKeys.length?(+filledKeys[filledKeys.length-1].split("-").pop())+1:0))}
                    </>
                  : Array.from({length:sec.count}).map((_,k)=>{
                      const rowKey=sec.label+"-"+k;
                      const person=teamData[rowKey];
                      return person?filledRow(rowKey,person):addRow(rowKey);
                    })}
              </React.Fragment>;
            })}
          </tbody>
        </table>
      </div>
    </Card>
    <p style={{fontSize:12,color:"var(--text-3)",marginTop:12,display:"flex",alignItems:"center",gap:6}}>
      <Icon name="alert-triangle" size={14}/>Se alguém já estiver em outra equipe, o nome fica destacado em vermelho com o aviso. Use o × vermelho à esquerda pra remover da equipe. A planilha começa zerada.
    </p>
  </div>;
}

function Montagem(){
  const { montagens, addMontagem } = useStore();
  const [openId,setOpenId]=useState(null); // id da montagem aberta
  const [modal,setModal]=useState(false);
  const openMont = montagens.find(m=>m.id===openId);

  if(openMont) return <MontagemSheet montagem={openMont} onBack={()=>setOpenId(null)}/>;

  const countFilled = m => Object.values(m.cells||{}).reduce((s,tab)=>s+Object.keys(tab).length,0);

  return <div>
    <Header title="Montagem" sub="Organize as equipes de cada encontro"/>
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(220px,1fr))",gap:16}}>
      {/* Card "Fazer montagem" sempre primeiro */}
      <button onClick={()=>setModal(true)} style={{textAlign:"left",cursor:"pointer",border:"2px dashed var(--brand-brown-soft)",background:"var(--surface-2)",borderRadius:"var(--r-lg)",padding:"22px",minHeight:150,display:"flex",flexDirection:"column",justifyContent:"space-between",fontFamily:"var(--font-sans)"}}>
        <span style={{width:46,height:46,borderRadius:99,background:"var(--brand-brown)",color:"var(--on-brand)",display:"inline-flex",alignItems:"center",justifyContent:"center"}}><Icon name="plus" size={22}/></span>
        <div><div style={{fontSize:16,fontWeight:700,color:"var(--brand-brown)"}}>Fazer montagem</div><div style={{fontSize:13,color:"var(--text-2)",marginTop:2}}>Criar nova organização de equipes</div></div>
      </button>
      {montagens.map((m)=>{const n=countFilled(m);return(
        <button key={m.id} onClick={()=>setOpenId(m.id)} style={{textAlign:"left",cursor:"pointer",border:"none",background:"var(--surface)",borderRadius:"var(--r-lg)",padding:"22px",minHeight:150,boxShadow:"var(--shadow-sm)",display:"flex",flexDirection:"column",justifyContent:"space-between",fontFamily:"var(--font-sans)"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
            <span style={{width:46,height:46,borderRadius:99,background:"var(--cat-terracotta)",color:"#fff",display:"inline-flex",alignItems:"center",justifyContent:"center"}}><Icon name="layout-grid" size={20}/></span>
            <Badge tone={m.visib==="Só o proprietário"?"neutral":"success"} dot>{m.visib==="Só o proprietário"?"Privada":"Compartilhada"}</Badge>
          </div>
          <div><div style={{fontSize:16,fontWeight:700,color:"var(--text)"}}>{m.nome}</div><div style={{fontSize:13,color:"var(--text-2)",marginTop:2}}>por {m.autor}{n>0?" · "+n+" alocados":""}</div></div>
        </button>
      );})}
    </div>
    {modal && <NovaMontagemModal onClose={()=>setModal(false)} onCreate={async m=>{const nm=await addMontagem(m);setModal(false);if(nm)setOpenId(nm.id);}}/>}
  </div>;
}

// gera um PDF da ficha da pessoa via janela de impressão (texto selecionável, sem lib pesada)
function exportarFichaPDF(person){
  const f=person.ficha||{};
  const isTio=person.mjc===undefined;
  const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
  const has=v=>v!=null&&v!==""&&!(Array.isArray(v)&&v.length===0);
  const yn=v=>v===true?"Sim":v===false?"Não":"";
  const row=(label,value)=>has(value)?`<div class="row"><span class="lbl">${esc(label)}</span><span class="val">${esc(value)}</span></div>`:"";
  const rowHTML=(label,html,show)=>show?`<div class="row"><span class="lbl">${esc(label)}</span><span class="val">${html}</span></div>`:"";
  const section=(title,inner)=>inner.trim()?`<section><h2>${esc(title)}</h2>${inner}</section>`:"";

  let corpo, overline;
  if(isTio){
    overline="Ficha dos tios";
    const equipesTio = f.fezCalifornia===true ? f.equipesEjc : f.equipesCalifornia;
    const equipesTioHTML=(equipesTio||[]).length?rowHTML(f.fezCalifornia===true?"Equipes que serviu no EJC":"Equipes que serviu no Califórnia",(equipesTio||[]).map(r=>esc((r.ejc?r.ejc+" — ":"")+r.eq+(r.coord?" (Coordenação)":""))).join("<br>"),true):"";
    const neuroPessoa=pref=>(f[pref+"Neuro"]||[]).map(n=>n==="Outra"?(f[pref+"NeuroOutra"]||"Outra"):n).join(", ");
    corpo=[
      section("Tia e Tio",
        row("Nome da tia",f.tiaNome)+row("Nome do tio",f.tioNome)+
        row("Apelido da tia",f.tiaApelido)+row("Apelido do tio",f.tioApelido)+
        row("Telefone da tia",f.tiaTel+(f.tiaTelPrincipal?" (principal)":""))+row("Telefone do tio",f.tioTel+(f.tioTelPrincipal?" (principal)":""))+
        row("Instagram da tia",f.tiaInsta)+row("Instagram do tio",f.tioInsta)+
        row("Data de nascimento da tia",f.tiaNasc)+row("Data de nascimento do tio",f.tioNasc)+
        row("E-mail da tia",f.tiaEmail)+row("E-mail do tio",f.tioEmail)+
        row("Tem matrimônio?",yn(f.matrimonio))),
      section("ECC no Califórnia",
        row("Fez ECC no Califórnia?",yn(f.fezCalifornia))+
        (f.fezCalifornia===true?row("Qual fez?",f.qualFez):"")+
        (f.fezCalifornia===false?row("Qual seu ECC?",f.qualEcc):"")+equipesTioHTML),
      section("Música",row("Músico?",f.musico?("Sim — "+(f.musicoQuem||"—")):yn(f.musico))+(f.musico===true?row("Instrumentos",(f.instrumentos||[]).join(", ")):"")),
      section("Saúde e restrições da tia",
        row("Restrição física",f.tiaRestrFisica==="Outra"?(f.tiaRestrFisicaOutra||"Outra"):f.tiaRestrFisica)+
        row("Restrição alimentar",f.tiaRestrAlim==="Outra"?(f.tiaRestrAlimOutra||"Outra"):f.tiaRestrAlim)+
        row("Neurodivergências e saúde mental",neuroPessoa("tia"))),
      section("Saúde e restrições do tio",
        row("Restrição física",f.tioRestrFisica==="Outra"?(f.tioRestrFisicaOutra||"Outra"):f.tioRestrFisica)+
        row("Restrição alimentar",f.tioRestrAlim==="Outra"?(f.tioRestrAlimOutra||"Outra"):f.tioRestrAlim)+
        row("Neurodivergências e saúde mental",neuroPessoa("tio"))),
    ].join("");
  } else {
    overline="Ficha do jovem";
    const end=enderecoCompleto(f);
    const circuloDot=f.circulo?`<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${CIRCULO_COR[f.circulo]||"#999"};margin-right:7px;vertical-align:middle;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)"></span>`:"";
    const equipesHTML=(f.equipesCalifornia||[]).length?rowHTML(f.fezCalifornia===true?"Equipes que serviu":"Equipe que serviu",(f.equipesCalifornia||[]).map(r=>esc((r.ano?r.ano+" — ":"")+r.eq+(r.coord?" (Coordenador)":""))).join("<br>"),true):"";
    const foraHTML=(f.serviuFora||[]).length?rowHTML("Já serviu fora",(f.serviuFora||[]).map(e=>esc(labelServiuFora(e))).join("<br>"),true):"";
    const neuroStr=(f.neuro||[]).map(n=>n==="Outra"?(f.neuroOutra||"Outra"):n).join(", ");
    corpo=[
      section("Dados pessoais",
        row("Nome completo",f.nome||person.n)+row("Apelido",f.apelido)+row("Data de nascimento",f.nasc)+
        row("CPF",f.cpf)+row("WhatsApp",f.whats||person.tel)+row("E-mail",f.email)+row("Instagram",f.insta)+
        row("Endereço atual",end==="—"?"":end)),
      section("Sacramentos",row("Sacramentos",(f.sacramentos||[]).join(", "))),
      section("Família",
        row("Pais",f.paisEstado)+
        row("Pai",f.paiNome?(f.paiNome+(f.paiFalecido?" (falecido)":"")):"")+row("Telefone do pai",f.paiFalecido?"":f.paiTel)+
        row("Mãe",f.maeNome?(f.maeNome+(f.maeFalecida?" (falecida)":"")):"")+row("Telefone da mãe",f.maeFalecida?"":f.maeTel)),
      section("EJC no Califórnia",
        row("Fez EJC no Califórnia?",yn(f.fezCalifornia))+
        (f.fezCalifornia===true?(row("Qual EJC você fez?",f.anoEjc)+rowHTML("Círculo",circuloDot+esc(f.circulo),!!f.circulo)+row("Casal de tio",f.casalTio)):"")+
        (f.fezCalifornia===false?(row("Qual seu EJC?",f.qualEjc)+row("Quadrante transferido para Califórnia?",f.quadranteTransferido?"Sim":"")):"")+equipesHTML),
      section("Experiência de serviço",
        row("Já foi garçom?",yn(f.garcom))+(f.garcom===true?row("Onde?",f.garcomOnde):"")+
        row("Já foi moita?",yn(f.moita))+(f.moita===true?(row("Quando e onde?",f.moitaOnde)+row("Papel",f.moitaPapel==="Outro"?(f.moitaPapelOutro||"Outro"):f.moitaPapel)):"")+foraHTML),
      section("Equipe atual do MJC",row("Equipe atual do MJC",f.mjcAtual)),
      section("Música",row("Músico?",yn(f.musico))+(f.musico===true?row("Instrumentos",(f.instrumentos||[]).join(", ")):"")),
      section("Saúde e restrições",
        row("Restrição física",f.restrFisica==="Outra"?(f.restrFisicaOutra||"Outra"):f.restrFisica)+
        row("Restrição alimentar",f.restrAlim==="Outra"?(f.restrAlimOutra||"Outra"):f.restrAlim)+
        row("Neurodivergências e saúde mental",neuroStr)),
    ].join("");
  }

  const logo=window.location.origin+"/design_system_unzip/ejc_claude/assets/ejc-logo.png";
  const sub=[person.mjc&&person.mjc!=="—"?"MJC: "+person.mjc:"",person.ejc&&person.ejc!=="—"?person.ejc:"",person.ativo?"Ativo":"Inativo"].filter(Boolean).map(esc).join(" · ");
  const hoje=new Date().toLocaleDateString("pt-BR");
  const html=`<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>Ficha - ${esc(person.n)}</title>
<style>
  *{box-sizing:border-box}
  body{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#2A241F;margin:0;padding:32px 34px;font-size:13px;line-height:1.5}
  .head{display:flex;align-items:center;gap:16px;border-bottom:2px solid #E7DED4;padding-bottom:16px;margin-bottom:22px}
  .head img.logo{width:52px;height:52px;object-fit:contain}
  .head .foto{width:66px;height:66px;border-radius:50%;object-fit:cover;margin-left:auto;background:#EFE7DD}
  .over{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#9B8B79;font-weight:700}
  h1{font-size:22px;margin:2px 0 3px;font-weight:800}
  .sub{font-size:12px;color:#7A6C5D}
  section{margin-bottom:18px;break-inside:avoid}
  h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#B5623A;font-weight:800;border-bottom:1px solid #EFE7DD;padding-bottom:5px;margin:0 0 10px}
  .row{display:grid;grid-template-columns:210px 1fr;gap:10px;padding:4px 0}
  .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:#9B8B79;font-weight:700}
  .val{font-size:13px;color:#2A241F}
  .foot{margin-top:26px;border-top:1px solid #EFE7DD;padding-top:10px;font-size:11px;color:#9B8B79}
  @media print{body{padding:0}@page{margin:16mm}}
</style></head>
<body onload="window.focus();window.print();">
  <div class="head">
    <img class="logo" src="${logo}" alt="EJC" onerror="this.style.display='none'">
    <div><div class="over">EJC Califórnia · BH · ${esc(overline)}</div><h1>${esc(person.n)}</h1><div class="sub">${sub}</div></div>
    ${person.foto?`<img class="foto" src="${esc(person.foto)}" alt="" onerror="this.style.display='none'">`:""}
  </div>
  ${corpo}
  <div class="foot">Gerado em ${esc(hoje)} · Base de Dados EJC Califórnia</div>
</body></html>`;

  const w=window.open("","_blank");
  if(!w){ alert("Permita pop-ups para exportar a ficha em PDF."); return; }
  w.document.open(); w.document.write(html); w.document.close();
}

/* ---- máscaras e validação ---- */
const onlyDigits = s => (s||"").replace(/\D/g,"");
function maskCPF(v){
  const d=onlyDigits(v).slice(0,11);
  if(d.length>9) return `${d.slice(0,3)}.${d.slice(3,6)}.${d.slice(6,9)}-${d.slice(9)}`;
  if(d.length>6) return `${d.slice(0,3)}.${d.slice(3,6)}.${d.slice(6)}`;
  if(d.length>3) return `${d.slice(0,3)}.${d.slice(3)}`;
  return d;
}
function maskTelefone(v){
  const d=onlyDigits(v).slice(0,11);
  if(!d) return "";
  if(d.length<=2) return `(${d}`;
  if(d.length<=6) return `(${d.slice(0,2)}) ${d.slice(2)}`;
  if(d.length<=10) return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;
  return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;
}
function maskInstagram(v){
  let s=(v||"").trim().replace(/\s+/g,"");
  if(!s) return "";
  s=s.replace(/^@+/,"");
  return s?("@"+s):"";
}
// data em formato BR: DD/MM/AAAA
function maskData(v){
  const d=onlyDigits(v).slice(0,8);
  if(d.length<=2) return d;
  if(d.length<=4) return `${d.slice(0,2)}/${d.slice(2)}`;
  return `${d.slice(0,2)}/${d.slice(2,4)}/${d.slice(4)}`;
}
// aceita vazio (opcional) ou uma data DD/MM/AAAA plausível
const validaData = v => {
  const s=(v||"").trim();
  if(!s) return true;
  const m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(s);
  if(!m) return false;
  const dia=+m[1], mes=+m[2], ano=+m[3];
  return dia>=1&&dia<=31&&mes>=1&&mes<=12&&ano>=1900&&ano<=2100;
};
function validaCPF(cpf){
  const d=onlyDigits(cpf);
  if(d.length!==11 || /^(\d)\1{10}$/.test(d)) return false;
  let s=0; for(let i=0;i<9;i++) s+=parseInt(d[i])*(10-i);
  let r=(s*10)%11; if(r===10) r=0; if(r!==parseInt(d[9])) return false;
  s=0; for(let i=0;i<10;i++) s+=parseInt(d[i])*(11-i);
  r=(s*10)%11; if(r===10) r=0; return r===parseInt(d[10]);
}
const validaEmail = e => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test((e||"").trim());
const validaTelefone = t => { const d=onlyDigits(t); return d.length===10||d.length===11; };

// redimensiona a imagem no navegador (lado maior = 480px) antes de enviar — poupa dados no celular
function resizeImagem(file){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    const url=URL.createObjectURL(file);
    img.onload=()=>{
      const max=480;
      let {width:w,height:h}=img;
      if(w>h && w>max){ h=Math.round(h*max/w); w=max; } else if(h>=w && h>max){ w=Math.round(w*max/h); h=max; }
      const canvas=document.createElement("canvas");
      canvas.width=w; canvas.height=h;
      canvas.getContext("2d").drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      canvas.toBlob(blob=>blob?resolve(blob):reject(new Error("Não foi possível processar a imagem.")),"image/jpeg",0.85);
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); reject(new Error("Arquivo de imagem inválido.")); };
    img.src=url;
  });
}
// envia a foto pro Supabase Storage e devolve a URL pública
async function enviarFoto(file){
  const blob=await resizeImagem(file);
  const path=uid()+".jpg";
  const { error } = await supabase.storage.from("fotos").upload(path, blob, { contentType:"image/jpeg", upsert:true });
  if(error) throw error;
  const { data } = supabase.storage.from("fotos").getPublicUrl(path);
  return data.publicUrl;
}
function PhotoUpload({ value, onChange, name }){
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState("");
  const inputRef=useRef(null);
  const escolher=async e=>{
    const file=e.target.files&&e.target.files[0];
    e.target.value="";
    if(!file) return;
    if(!/^image\//.test(file.type)){ setErr("Escolha um arquivo de imagem."); return; }
    setErr(""); setBusy(true);
    try{ const url=await enviarFoto(file); onChange(url); }
    catch(err){ setErr("Não foi possível enviar a foto. Tenta de novo."); }
    setBusy(false);
  };
  return <div style={{display:"flex",alignItems:"center",gap:16,flexWrap:"wrap"}}>
    <span style={{position:"relative",width:84,height:84,flex:"0 0 auto"}}>
      <Avatar src={value} name={name} size={84}/>
      {busy && <span style={{position:"absolute",inset:0,borderRadius:"50%",background:"rgba(42,36,31,.45)",display:"flex",alignItems:"center",justifyContent:"center",color:"#fff"}}><Icon name="loader-2" size={20}/></span>}
    </span>
    <div>
      <div style={{display:"flex",gap:8}}>
        <Button type="button" variant="secondary" iconLeft={<Icon name="camera" size={15}/>} onClick={()=>inputRef.current&&inputRef.current.click()} disabled={busy}>{value?"Trocar foto":"Adicionar foto"}</Button>
        {value && <IconButton label="Remover foto" variant="soft" onClick={()=>onChange(null)}><Icon name="x" size={16}/></IconButton>}
      </div>
      <input ref={inputRef} type="file" accept="image/*" onChange={escolher} style={{display:"none"}}/>
      {err && <div style={{fontSize:12,color:"var(--brand-red)",marginTop:6,fontWeight:600}}>{err}</div>}
    </div>
  </div>;
}

function Field({ label, hint, children, required, span, error }){
  return <div className={error?"has-error":""} style={{marginBottom:2,gridColumn:span?"1 / -1":"auto"}}>
    <label style={{display:"block",fontSize:13,fontWeight:600,marginBottom:7,color:"var(--text)"}}>{label}{required&&<span style={{color:"var(--brand-red)"}}> *</span>}</label>
    {children}
    {error
      ? <div style={{fontSize:12,color:"var(--brand-red)",marginTop:5,fontWeight:600,display:"flex",alignItems:"center",gap:5}}><Icon name="alert-circle" size={13}/>{error}</div>
      : hint&&<div style={{fontSize:12,color:"var(--text-3)",marginTop:5}}>{hint}</div>}
  </div>;
}
function Input({ style, error, ...p }){
  const [f,setF]=useState(false);
  const ring = error ? "0 0 0 3px color-mix(in oklch, var(--danger) 30%, transparent)" : f?"var(--ring)":"none";
  return <input {...p} onFocus={()=>setF(true)} onBlur={()=>setF(false)} style={{width:"100%",border:"none",background:error?"var(--danger-soft)":"var(--surface-2)",borderRadius:"var(--r-md)",padding:"12px 14px",fontSize:14,fontFamily:"var(--font-sans)",color:"var(--text)",outline:"none",boxShadow:ring,transition:"box-shadow .15s, background .15s",...style}}/>;
}
function YesNo({ value, onChange }){
  return <div style={{display:"inline-flex",gap:8}}>
    {[["Sim",true],["Não",false]].map(([lbl,v])=>(
      <button key={lbl} type="button" onClick={()=>onChange(v)} style={{...chipStyle(value===v),minWidth:70}}>{lbl}</button>
    ))}
  </div>;
}
function ChipGroup({ options, value, onChange, multi, leading }){
  const sel = multi ? (value||[]) : value;
  const isOn = o => multi ? sel.includes(o) : sel===o;
  const toggle = o => {
    if(multi){ onChange(sel.includes(o)?sel.filter(x=>x!==o):[...sel,o]); }
    else onChange(o);
  };
  return <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
    {options.map(o=><button key={o} type="button" onClick={()=>toggle(o)} style={leading?{...chipStyle(isOn(o)),display:"inline-flex",alignItems:"center",gap:7}:chipStyle(isOn(o))}>{leading&&leading(o)}{o}</button>)}
  </div>;
}
function Section({ title, icon, color="var(--brand-brown)", desc, children }){
  return <Card style={{marginBottom:18}}>
    <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:18}}>
      <span style={{width:40,height:40,borderRadius:99,background:color,color:"#fff",display:"inline-flex",alignItems:"center",justifyContent:"center",flex:"0 0 auto"}}><Icon name={icon} size={19}/></span>
      <div><h3 style={{margin:0,fontSize:16,fontWeight:700}}>{title}</h3>{desc&&<p style={{margin:"2px 0 0",fontSize:13,color:"var(--text-2)"}}>{desc}</p>}</div>
    </div>
    {children}
  </Card>;
}
const grid2 = {display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(220px,1fr))",gap:16};
// grid de pares (tia | tio): minmax mais largo garante nunca 3 colunas, só 2 (ou 1 empilhado no celular)
const parGrid = {display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(260px,1fr))",gap:"16px 20px",alignItems:"start"};

function FichaForm({ onClose, onSave, initial, overline, title, saveLabel, selfId }){
  const [f,setF]=useState({
    sacramentos:[], serviuFora:[], instrumentos:[], equipesCalifornia:[],
    fezCalifornia:null, garcom:null, garcomOnde:"", moita:null, moitaOnde:"", moitaPapel:"", moitaPapelOutro:"", circulo:"", musico:null, mjcAtual:"",
    restrFisica:"", restrFisicaOutra:"", restrAlim:"", restrAlimOutra:"", neuro:[], neuroOutra:"",
    paisEstado:"", paiFalecido:false, maeFalecida:false,
    endereco:"", complemento:"", bairro:"", cidade:"",
    ...(initial||{}),
  });
  const { jovens } = useStore();
  const [errors,setErrors]=useState({});
  const set=(k,v)=>{ setF(s=>({...s,[k]:v})); setErrors(e=>{ if(!e[k]) return e; const n={...e}; delete n[k]; return n; }); };

  // detecção de duplicados (na hora) — só compara quando o valor está completo/válido
  const normEmail = e => (e||"").trim().toLowerCase();
  const cpfOwner = onlyDigits(f.cpf).length===11 ? jovens.find(j=>j.id!==selfId && j.ficha && onlyDigits(j.ficha.cpf)===onlyDigits(f.cpf)) : null;
  const emailOwner = validaEmail(f.email) ? jovens.find(j=>j.id!==selfId && j.ficha && normEmail(j.ficha.email)===normEmail(f.email)) : null;
  const dupCpfMsg = cpfOwner ? ("Este CPF já está cadastrado — "+cpfOwner.n+".") : null;
  const dupEmailMsg = emailOwner ? ("Este e-mail já está cadastrado — "+emailOwner.n+".") : null;

  const [busy,setBusy]=useState(false);
  const handleSave=async ()=>{
    const errs={};
    if(!f.nome || !f.nome.trim()) errs.nome="Informe o nome completo.";
    if(!f.whats) errs.whats="Informe o WhatsApp.";
    else if(!validaTelefone(f.whats)) errs.whats="WhatsApp inválido — use (DD) e 8 ou 9 dígitos.";
    if(f.nasc && !validaData(f.nasc)) errs.nasc="Data inválida — use DD/MM/AAAA.";
    if(!f.cpf) errs.cpf="Informe o CPF.";
    else if(!validaCPF(f.cpf)) errs.cpf="CPF inválido.";
    else if(dupCpfMsg) errs.cpf=dupCpfMsg;
    if(f.email && !validaEmail(f.email)) errs.email="E-mail inválido.";
    else if(dupEmailMsg) errs.email=dupEmailMsg;
    if(!f.endereco || !f.endereco.trim()) errs.endereco="Informe o endereço atual (rua e número).";
    if(!f.bairro || !f.bairro.trim()) errs.bairro="Informe o bairro.";
    if(!f.cidade || !f.cidade.trim()) errs.cidade="Informe a cidade.";
    if(!f.paiFalecido && f.paiTel && !validaTelefone(f.paiTel)) errs.paiTel="Telefone inválido.";
    if(!f.maeFalecida && f.maeTel && !validaTelefone(f.maeTel)) errs.maeTel="Telefone inválido.";
    if(f.fezCalifornia!==true && f.fezCalifornia!==false) errs.fezCalifornia="Responda se fez EJC no Califórnia.";
    else if(f.fezCalifornia===true && !f.anoEjc) errs.anoEjc="Selecione o ano que fez EJC.";
    if(!f.mjcAtual) errs.mjcAtual="Selecione a equipe atual (ou 'Não estou em nenhuma').";
    setErrors(errs);
    if(Object.keys(errs).length){
      setTimeout(()=>{ const el=document.querySelector(".has-error"); if(el) el.scrollIntoView({behavior:"smooth",block:"center"}); },30);
      return;
    }
    if(busy) return;
    setBusy(true);
    await (onSave&&onSave(f));
    setBusy(false);
  };

  useLucide();

  return <div style={{position:"fixed",inset:0,zIndex:60,background:"linear-gradient(180deg,var(--bg-top) 0%,var(--bg) 40%)",overflow:"auto"}}>
    {/* top bar */}
    <div style={{position:"sticky",top:0,zIndex:5,background:"color-mix(in oklch, var(--bg) 88%, transparent)",backdropFilter:"blur(8px)",borderBottom:"1px solid var(--hairline)"}}>
      <div style={{maxWidth:820,margin:"0 auto",padding:"14px 18px",display:"flex",alignItems:"center",gap:10,rowGap:10,flexWrap:"wrap"}}>
        <IconButton label="Voltar" variant="soft" onClick={onClose}><Icon name="arrow-left" size={18}/></IconButton>
        <div style={{marginRight:"auto",minWidth:0,flex:"1 1 140px"}}>
          <div className="mono-overline">{overline||"NOVA FICHA"}</div>
          <h1 style={{margin:"2px 0 0",fontSize:20,fontWeight:800,letterSpacing:"-.02em",overflowWrap:"anywhere"}}>{title||"Ficha do jovem"}</h1>
        </div>
        <Button variant="ghost" className="hide-mobile" onClick={onClose}>Cancelar</Button>
        <Button variant="primary" iconLeft={<Icon name="check" size={16}/>} onClick={handleSave} disabled={busy} style={{opacity:busy?.7:1}}>{busy?"Salvando...":(saveLabel||"Salvar ficha")}</Button>
      </div>
    </div>

    <div style={{maxWidth:820,margin:"0 auto",padding:"24px 22px 60px"}}>

      <Card style={{marginBottom:18}}>
        <PhotoUpload value={f.foto} name={f.nome} onChange={url=>set("foto",url)}/>
      </Card>

      {/* 1. Dados pessoais */}
      <Section title="Dados pessoais" icon="user" color="var(--cat-blue)">
        <div style={grid2}>
          <Field label="Nome completo" required span error={errors.nome}><Input value={f.nome||""} onChange={e=>set("nome",e.target.value)} error={!!errors.nome} placeholder="Nome e sobrenome"/></Field>
          <Field label="Apelido"><Input value={f.apelido||""} onChange={e=>set("apelido",e.target.value)} placeholder="Como te chamam"/></Field>
          <Field label="Data de nascimento" error={errors.nasc}><Input value={f.nasc||""} onChange={e=>set("nasc",maskData(e.target.value))} error={!!errors.nasc} inputMode="numeric" placeholder="DD/MM/AAAA"/></Field>
          <Field label="CPF" required error={errors.cpf||dupCpfMsg}><Input value={f.cpf||""} onChange={e=>set("cpf",maskCPF(e.target.value))} error={!!(errors.cpf||dupCpfMsg)} inputMode="numeric" placeholder="000.000.000-00"/></Field>
          <Field label="WhatsApp" required error={errors.whats}><Input value={f.whats||""} onChange={e=>set("whats",maskTelefone(e.target.value))} error={!!errors.whats} inputMode="tel" placeholder="(31) 90000-0000"/></Field>
          <Field label="E-mail" error={errors.email||dupEmailMsg}><Input type="email" value={f.email||""} onChange={e=>set("email",e.target.value)} error={!!(errors.email||dupEmailMsg)} placeholder="voce@email.com"/></Field>
          <Field label="Instagram"><Input value={f.insta||""} onChange={e=>set("insta",maskInstagram(e.target.value))} placeholder="@seu.usuario"/></Field>
        </div>
        <div style={{marginTop:16}}>
          <Field label="Endereço atual" required span error={errors.endereco} hint="Rua e número">
            <Input value={f.endereco||""} onChange={e=>set("endereco",e.target.value)} error={!!errors.endereco} placeholder="Ex: Rua Exemplo, 123"/>
          </Field>
        </div>
        <div style={{...grid2,marginTop:16}}>
          <Field label="Complemento" hint="Apto, bloco, casa..."><Input value={f.complemento||""} onChange={e=>set("complemento",e.target.value)} placeholder="Ex: Apto 202, Bloco B"/></Field>
          <Field label="Bairro" required error={errors.bairro}><Input value={f.bairro||""} onChange={e=>set("bairro",e.target.value)} error={!!errors.bairro} placeholder="Ex: Céu Azul"/></Field>
          <Field label="Cidade" required error={errors.cidade}><Input value={f.cidade||""} onChange={e=>set("cidade",e.target.value)} error={!!errors.cidade} placeholder="Ex: Belo Horizonte"/></Field>
        </div>
      </Section>

      {/* 2. Sacramentos */}
      <Section title="Sacramentos" icon="church" color="var(--cat-plum)" desc="Marque todos que já recebeu">
        <ChipGroup multi options={SACRAMENTOS} value={f.sacramentos} onChange={v=>set("sacramentos",v)}/>
      </Section>

      {/* 3. Família */}
      <Section title="Família" icon="users" color="var(--cat-terracotta)">
        <Field label="Pai e mãe são casados ou separados?">
          <ChipGroup options={["Casados","Separados","Outro"]} value={f.paisEstado} onChange={v=>set("paisEstado",v)}/>
        </Field>
        <div style={{marginTop:18,fontSize:13,fontWeight:700,color:"var(--text-2)",textTransform:"uppercase",letterSpacing:".04em"}}>Pais</div>
        <div style={{marginTop:12,display:"flex",flexDirection:"column",gap:16}}>
          {/* Pai: nome | telefone | falecido */}
          <div style={{display:"flex",gap:12,flexWrap:"wrap",alignItems:"flex-start"}}>
            <div style={{flex:"2 1 220px"}}>
              <Field label="Nome do pai"><Input value={f.paiNome||""} onChange={e=>set("paiNome",e.target.value)} placeholder="Nome do pai"/></Field>
            </div>
            <div style={{flex:"1 1 170px"}}>
              <Field label="Telefone do pai" error={errors.paiTel}><Input value={f.paiFalecido?"":(f.paiTel||"")} onChange={e=>set("paiTel",maskTelefone(e.target.value))} error={!!errors.paiTel} inputMode="tel" placeholder={f.paiFalecido?"—":"(31) 90000-0000"} style={{opacity:f.paiFalecido?.5:1}} disabled={f.paiFalecido}/></Field>
            </div>
            <label style={{flex:"0 0 auto",display:"inline-flex",alignItems:"center",gap:8,fontSize:13,color:"var(--text-2)",cursor:"pointer",paddingTop:34}}>
              <input type="checkbox" checked={f.paiFalecido} onChange={e=>set("paiFalecido",e.target.checked)}/> Falecido
            </label>
          </div>
          {/* Mãe: nome | telefone | falecida */}
          <div style={{display:"flex",gap:12,flexWrap:"wrap",alignItems:"flex-start"}}>
            <div style={{flex:"2 1 220px"}}>
              <Field label="Nome da mãe"><Input value={f.maeNome||""} onChange={e=>set("maeNome",e.target.value)} placeholder="Nome da mãe"/></Field>
            </div>
            <div style={{flex:"1 1 170px"}}>
              <Field label="Telefone da mãe" error={errors.maeTel}><Input value={f.maeFalecida?"":(f.maeTel||"")} onChange={e=>set("maeTel",maskTelefone(e.target.value))} error={!!errors.maeTel} inputMode="tel" placeholder={f.maeFalecida?"—":"(31) 90000-0000"} style={{opacity:f.maeFalecida?.5:1}} disabled={f.maeFalecida}/></Field>
            </div>
            <label style={{flex:"0 0 auto",display:"inline-flex",alignItems:"center",gap:8,fontSize:13,color:"var(--text-2)",cursor:"pointer",paddingTop:34}}>
              <input type="checkbox" checked={f.maeFalecida} onChange={e=>set("maeFalecida",e.target.checked)}/> Falecida
            </label>
          </div>
        </div>
      </Section>

      {/* 4. EJC no Califórnia */}
      <Section title="EJC no Califórnia" icon="cross" color="var(--brand-brown)">
        <Field label="Fez EJC no Califórnia?" required error={errors.fezCalifornia}>
          <YesNo value={f.fezCalifornia} onChange={v=>set("fezCalifornia",v)}/>
        </Field>
        {f.fezCalifornia===true && <div style={{marginTop:16}}>
          <Field label="Qual EJC você fez?" required error={errors.anoEjc}>
            <select value={f.anoEjc||""} onChange={e=>set("anoEjc",e.target.value)} style={{width:"100%",border:"none",background:errors.anoEjc?"var(--danger-soft)":"var(--surface-2)",borderRadius:"var(--r-md)",padding:"12px 14px",fontSize:14,fontFamily:"var(--font-sans)",color:"var(--text)",outline:"none"}}>
              <option value="">Selecione...</option>{EJC_YEARS.map(y=><option key={y}>{y}</option>)}
            </select>
          </Field>
          <div style={{marginTop:16}}>
            <Field label="Equipes que serviu no Califórnia" hint="Escolha a equipe de cada ano em que serviu — deixe em branco os anos que não serviu. Só aparecem anos depois do seu EJC.">
              <EquipesPorAno value={f.equipesCalifornia} onChange={v=>set("equipesCalifornia",v)} years={anosDepoisDoEjc(f.anoEjc)} needsYear={!f.anoEjc}/>
            </Field>
          </div>
          <div style={{marginTop:16}}>
            <Field label="Qual seu Círculo?">
              <ChipGroup options={CIRCULOS} value={f.circulo} onChange={v=>set("circulo",v)} leading={o=><CirculoDot nome={o}/>}/>
            </Field>
          </div>
          <div style={{marginTop:16}}>
            <Field label="Nome do casal de tio"><Input value={f.casalTio||""} onChange={e=>set("casalTio",e.target.value)} placeholder="Ex: Carlos e Rita"/></Field>
          </div>
        </div>}
        {f.fezCalifornia===false && <div style={{marginTop:16}}>
          <Field label="Qual seu EJC? (Número + nome)" hint="Onde você fez seu Encontro">
            <Input value={f.qualEjc||""} onChange={e=>set("qualEjc",e.target.value)} placeholder="X EJC Padre Eustáquio"/>
          </Field>
          <div style={{marginTop:16}}>
            <Field label="Equipe que serviu no Califórnia" hint="Adicione a equipe (ou equipes) em que serviu">
              <RepeatEquipeSimples value={f.equipesCalifornia} onChange={v=>set("equipesCalifornia",v)}/>
            </Field>
          </div>
          <label style={{display:"inline-flex",alignItems:"center",gap:9,fontSize:14,marginTop:16,cursor:"pointer"}}>
            <input type="checkbox" checked={!!f.quadranteTransferido} onChange={e=>set("quadranteTransferido",e.target.checked)}/> Quadrante transferido para Califórnia
          </label>
        </div>}
      </Section>

      {/* 6. MJC atual */}
      <Section title="Equipe atual do MJC" icon="layout-grid" color="var(--cat-terracotta)" desc="Obrigatório — escolha uma equipe ou 'Não estou em nenhuma'">
        <div className={errors.mjcAtual?"has-error":""}>
          <ChipGroup options={[...MJC_TEAMS,"Não estou em nenhuma"]} value={f.mjcAtual} onChange={v=>set("mjcAtual",v)}/>
          {errors.mjcAtual && <div style={{fontSize:12,color:"var(--brand-red)",marginTop:8,fontWeight:600,display:"flex",alignItems:"center",gap:5}}><Icon name="alert-circle" size={13}/>{errors.mjcAtual}</div>}
        </div>
      </Section>

      {/* 7. Música */}
      <Section title="Música" icon="music" color="var(--cat-plum)">
        <Field label="Músico?">
          <YesNo value={f.musico} onChange={v=>set("musico",v)}/>
        </Field>
        {f.musico===true && <div style={{marginTop:14}}>
          <Field label="O que toca ou canta?" hint="Pode marcar mais de uma opção">
            <ChipGroup multi options={INSTRUMENTOS} value={f.instrumentos} onChange={v=>set("instrumentos",v)}/>
          </Field>
        </div>}
      </Section>

      {/* 8. Saúde e restrições */}
      <Section title="Saúde e restrições" icon="heart-pulse" color="var(--brand-red)" desc="Dados sensíveis — usados só para cuidar de você no encontro">
        <Field label="Restrição física">
          <ChipGroup options={RESTR_FISICA} value={f.restrFisica} onChange={v=>set("restrFisica",v)}/>
        </Field>
        {f.restrFisica==="Outra" && <div style={{marginTop:10,marginBottom:6}}><Input value={f.restrFisicaOutra} onChange={e=>set("restrFisicaOutra",e.target.value)} placeholder="Descreva a restrição física"/></div>}

        <div style={{marginTop:18}}>
          <Field label="Restrição ou preferência alimentar">
            <ChipGroup options={RESTR_ALIM} value={f.restrAlim} onChange={v=>set("restrAlim",v)}/>
          </Field>
          {f.restrAlim==="Outra" && <div style={{marginTop:10}}><Input value={f.restrAlimOutra} onChange={e=>set("restrAlimOutra",e.target.value)} placeholder="Descreva a restrição alimentar"/></div>}
        </div>

        <div style={{marginTop:18}}>
          <Field label="Neurodivergências e saúde mental" hint="Marque o que se aplica">
            <ChipGroup multi options={NEURO} value={f.neuro} onChange={v=>set("neuro",v)}/>
          </Field>
          {f.neuro.includes("Outra") && <div style={{marginTop:10}}><Input value={f.neuroOutra} onChange={e=>set("neuroOutra",e.target.value)} placeholder="Descreva"/></div>}
        </div>
      </Section>

      <div style={{display:"flex",justifyContent:"flex-end",gap:10,marginTop:8}}>
        <Button variant="ghost" onClick={onClose}>Cancelar</Button>
        <Button variant="primary" iconLeft={<Icon name="check" size={16}/>} onClick={handleSave} disabled={busy} style={{opacity:busy?.7:1}}>{busy?"Salvando...":(saveLabel||"Salvar ficha")}</Button>
      </div>
    </div>
  </div>;
}

/* ======================================================================

function TiosForm({ onClose, onSave, initial, overline, title, saveLabel }){
  const [f,setF]=useState({
    tiaTelPrincipal:false, tioTelPrincipal:false,
    matrimonio:null, fezCalifornia:null, equipesEjc:[], equipesCalifornia:[],
    musico:null, musicoQuem:"", instrumentos:[],
    tiaRestrFisica:"", tiaRestrFisicaOutra:"", tiaRestrAlim:"", tiaRestrAlimOutra:"", tiaNeuro:[], tiaNeuroOutra:"",
    tioRestrFisica:"", tioRestrFisicaOutra:"", tioRestrAlim:"", tioRestrAlimOutra:"", tioNeuro:[], tioNeuroOutra:"",
    ...(initial||{}),
  });
  const set=(k,v)=>{ setF(s=>({...s,[k]:v})); setErrors(e=>{ if(!e[k]) return e; const n={...e}; delete n[k]; return n; }); };
  const [errors,setErrors]=useState({});
  const [busy,setBusy]=useState(false);
  useLucide();

  const handleSave=async ()=>{
    const errs={};
    if(!f.tiaNome||!f.tiaNome.trim()) errs.tiaNome="Informe o nome da tia.";
    if(!f.tioNome||!f.tioNome.trim()) errs.tioNome="Informe o nome do tio.";
    if(f.tiaTel && !validaTelefone(f.tiaTel)) errs.tiaTel="Telefone inválido.";
    if(f.tioTel && !validaTelefone(f.tioTel)) errs.tioTel="Telefone inválido.";
    if(f.tiaEmail && !validaEmail(f.tiaEmail)) errs.tiaEmail="E-mail inválido.";
    if(f.tioEmail && !validaEmail(f.tioEmail)) errs.tioEmail="E-mail inválido.";
    if(f.tiaNasc && !validaData(f.tiaNasc)) errs.tiaNasc="Data inválida — use DD/MM/AAAA.";
    if(f.tioNasc && !validaData(f.tioNasc)) errs.tioNasc="Data inválida — use DD/MM/AAAA.";
    setErrors(errs);
    if(Object.keys(errs).length){
      setTimeout(()=>{ const el=document.querySelector(".has-error"); if(el) el.scrollIntoView({behavior:"smooth",block:"center"}); },30);
      return;
    }
    setBusy(true);
    await (onSave&&onSave(f));
    setBusy(false);
  };

  const setPrincipal=(quem)=>{
    if(quem==="tia") setF(s=>({...s,tiaTelPrincipal:true,tioTelPrincipal:false}));
    else setF(s=>({...s,tiaTelPrincipal:false,tioTelPrincipal:true}));
  };

  return <div style={{position:"fixed",inset:0,zIndex:60,background:"linear-gradient(180deg,var(--bg-top) 0%,var(--bg) 40%)",overflow:"auto"}}>
    <div style={{position:"sticky",top:0,zIndex:5,background:"color-mix(in oklch, var(--bg) 88%, transparent)",backdropFilter:"blur(8px)",borderBottom:"1px solid var(--hairline)"}}>
      <div style={{maxWidth:820,margin:"0 auto",padding:"14px 18px",display:"flex",alignItems:"center",gap:10,rowGap:10,flexWrap:"wrap"}}>
        <IconButton label="Voltar" variant="soft" onClick={onClose}><Icon name="arrow-left" size={18}/></IconButton>
        <div style={{marginRight:"auto",minWidth:0,flex:"1 1 140px"}}>
          <div className="mono-overline">{overline||"NOVA FICHA · TIOS"}</div>
          <h1 style={{margin:"2px 0 0",fontSize:20,fontWeight:800,letterSpacing:"-.02em",overflowWrap:"anywhere"}}>{title||"Ficha dos tios"}</h1>
