<!-- @dsCard group="Components" viewport="700x300" name="Layout & listas" subtitle="Card · ListRow · Avatar" -->
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:24px;background:var(--bg)}</style>
</head><body><div id="root"></div>
<script type="text/babel" data-presets="react">
const NS = window.__DS__ || Object.values(window).find(o => o && o.Card && o.ListRow) || window;
const { Card, ListRow, Avatar, Badge, RatingBar } = NS;
ReactDOM.createRoot(document.getElementById('root')).render(
  <Card title="Membros" subtitle="Equipe Acolhida" action={<span style={{fontSize:13,fontWeight:600,color:'var(--brand-brown)'}}>Ver todos</span>}>
    <div style={{display:'flex',flexDirection:'column',gap:10}}>
      <ListRow avatar={<Avatar name="Ana Beatriz"/>} title="Ana Beatriz" subtitle="Coordenadora" trailing={<Badge tone="success" dot>Confirmado</Badge>}/>
      <ListRow avatar={<Avatar name="João Pedro" badge={2}/>} title="João Pedro" subtitle="Tio" trailing={<Badge tone="warning" dot>Pendente</Badge>}/>
      <ListRow icon="★" iconColor="var(--cat-terracotta)" title="Equipe Liturgia" subtitle="14 membros" trailing={<RatingBar value={4.6} size={15}/>}/>
    </div>
  </Card>
);
</script>
</body></html>
