<!-- @dsCard group="Components" viewport="700x220" name="Botões" subtitle="Button + IconButton — variantes e tamanhos" -->
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:24px;background:var(--bg)}</style>
</head><body><div id="root"></div>
<script type="text/babel" data-presets="react">
const NS = window.__DS__ || Object.values(window).find(o => o && o.Button && o.IconButton) || window;
const { Button, IconButton } = NS;
const Ico = () => <span style={{fontSize:18,lineHeight:0}}>＋</span>;
ReactDOM.createRoot(document.getElementById('root')).render(
  <div style={{display:'flex',flexDirection:'column',gap:18}}>
    <div style={{display:'flex',gap:12,alignItems:'center',flexWrap:'wrap'}}>
      <Button variant="primary">Salvar</Button>
      <Button variant="secondary">Cancelar</Button>
      <Button variant="ghost">Ver mais</Button>
      <Button variant="yellow">Destaque</Button>
      <Button variant="danger">Excluir</Button>
      <Button variant="primary" disabled>Desabilitado</Button>
    </div>
    <div style={{display:'flex',gap:12,alignItems:'center'}}>
      <Button size="sm">Small</Button>
      <Button size="md">Medium</Button>
      <Button size="lg">Large</Button>
      <span style={{width:16}}></span>
      <IconButton label="add"><Ico/></IconButton>
      <IconButton variant="dark" label="add"><Ico/></IconButton>
      <IconButton variant="soft" label="add"><Ico/></IconButton>
    </div>
  </div>
);
</script>
</body></html>
