<!-- @dsCard group="Colors" viewport="700x150" name="Semânticas" subtitle="Sucesso, atenção, perigo, info — com fundos suaves" -->
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--bg)}</style>
</head><body>
<div style="display:flex;gap:12px">
   
   <div style="flex:1;background:var(--success-soft);border-radius:var(--r-md);padding:12px;display:flex;flex-direction:column;gap:8px">
     <div style="width:20px;height:20px;border-radius:var(--r-pill);background:var(--success)"></div>
     <span style="font-size:13px;font-weight:600;color:var(--text)">Sucesso</span>
   </div>
   <div style="flex:1;background:var(--warning-soft);border-radius:var(--r-md);padding:12px;display:flex;flex-direction:column;gap:8px">
     <div style="width:20px;height:20px;border-radius:var(--r-pill);background:var(--warning)"></div>
     <span style="font-size:13px;font-weight:600;color:var(--text)">Atenção</span>
   </div>
   <div style="flex:1;background:var(--danger-soft);border-radius:var(--r-md);padding:12px;display:flex;flex-direction:column;gap:8px">
     <div style="width:20px;height:20px;border-radius:var(--r-pill);background:var(--danger)"></div>
     <span style="font-size:13px;font-weight:600;color:var(--text)">Perigo</span>
   </div>
   <div style="flex:1;background:var(--info-soft);border-radius:var(--r-md);padding:12px;display:flex;flex-direction:column;gap:8px">
     <div style="width:20px;height:20px;border-radius:var(--r-pill);background:var(--info)"></div>
     <span style="font-size:13px;font-weight:600;color:var(--text)">Info</span>
   </div>
 </div>
</body></html>
