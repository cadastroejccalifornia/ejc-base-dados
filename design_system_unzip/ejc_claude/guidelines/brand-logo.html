<!-- @dsCard group="Brand" viewport="700x300" name="Logo EJC" subtitle="Marca do Encontro de Jovens com Cristo — Califórnia BH" -->
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:24px;background:var(--bg)}</style>
</head><body>
<div style="display:flex;gap:24px;align-items:center">
  <div style="background:var(--surface);border-radius:var(--r-xl);padding:18px;box-shadow:var(--shadow-md);flex:0 0 auto">
    <img src="../assets/ejc-logo.png" alt="Logo EJC" style="height:200px;width:auto;display:block">
  </div>
  <div style="background:var(--brand-brown);border-radius:var(--r-xl);padding:18px;box-shadow:var(--shadow-md);flex:0 0 auto">
    <img src="../assets/ejc-logo.png" alt="Logo EJC sobre marrom" style="height:200px;width:auto;display:block;mix-blend-mode:multiply;filter:none">
  </div>
  <div style="flex:1">
    <div class="mono-overline">Marca</div>
    <div style="font-size:22px;font-weight:800;color:var(--text);letter-spacing:-.01em;margin-top:6px">Encontro de Jovens com Cristo</div>
    <div style="font-size:14px;color:var(--text-2);margin-top:4px">Califórnia — BH</div>
    <p style="font-size:13px;color:var(--text-2);line-height:1.5;margin:12px 0 0">Cruz marrom, letras EJC em amarelo com contorno vermelho. Use o PNG sobre fundo claro; sobre marrom, prefira uma versão sem fundo (pendente do usuário).</p>
  </div>
</div>
</body></html>
