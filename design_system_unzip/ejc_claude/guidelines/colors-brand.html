<!-- @dsCard group="Colors" viewport="700x150" name="Brand" subtitle="Cores da marca EJC — cruz, letras, contorno" -->
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--bg)}</style>
</head><body>
<div style="display:flex;gap:12px">
   <div style="flex:1;min-width:0">
  <div style="height:56px;border-radius:var(--r-md);background:var(--brand-brown);box-shadow:var(--shadow-xs);display:flex;align-items:flex-end;padding:6px 8px">
    <span style="font-family:var(--font-mono);font-size:10px;color:rgba(255,255,255,.85)">var(--brand-brown)</span></div>
  <div style="font-size:12px;font-weight:600;margin-top:6px;color:var(--text)">Marrom (cruz)</div>
</div>
   <div style="flex:1;min-width:0">
  <div style="height:56px;border-radius:var(--r-md);background:var(--brand-brown-deep);box-shadow:var(--shadow-xs);display:flex;align-items:flex-end;padding:6px 8px">
    <span style="font-family:var(--font-mono);font-size:10px;color:rgba(255,255,255,.85)">var(--brand-brown-deep)</span></div>
  <div style="font-size:12px;font-weight:600;margin-top:6px;color:var(--text)">Marrom fundo</div>
</div>
   <div style="flex:1;min-width:0">
  <div style="height:56px;border-radius:var(--r-md);background:var(--brand-yellow);box-shadow:var(--shadow-xs);display:flex;align-items:flex-end;padding:6px 8px">
    <span style="font-family:var(--font-mono);font-size:10px;color:#4a2e12">var(--brand-yellow)</span></div>
  <div style="font-size:12px;font-weight:600;margin-top:6px;color:var(--text)">Amarelo</div>
</div>
   <div style="flex:1;min-width:0">
  <div style="height:56px;border-radius:var(--r-md);background:var(--brand-yellow-vivid);box-shadow:var(--shadow-xs);display:flex;align-items:flex-end;padding:6px 8px">
    <span style="font-family:var(--font-mono);font-size:10px;color:#4a2e12">var(--brand-yellow-vivid)</span></div>
  <div style="font-size:12px;font-weight:600;margin-top:6px;color:var(--text)">Amarelo vívido</div>
</div>
   <div style="flex:1;min-width:0">
  <div style="height:56px;border-radius:var(--r-md);background:var(--brand-red);box-shadow:var(--shadow-xs);display:flex;align-items:flex-end;padding:6px 8px">
    <span style="font-family:var(--font-mono);font-size:10px;color:rgba(255,255,255,.85)">var(--brand-red)</span></div>
  <div style="font-size:12px;font-weight:600;margin-top:6px;color:var(--text)">Vermelho</div>
</div>
 </div>
</body></html>
