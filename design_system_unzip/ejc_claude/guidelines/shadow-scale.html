<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--bg)}</style>
</head><body>
<div style="display:flex;gap:22px;align-items:center;padding:12px 4px">
   
   <div style="display:flex;flex-direction:column;align-items:center;gap:12px">
     <div style="width:90px;height:70px;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-xs)"></div>
     <span style="font-family:var(--font-mono);font-size:10px;color:var(--text-2)">shadow-xs</span>
   </div>
   <div style="display:flex;flex-direction:column;align-items:center;gap:12px">
     <div style="width:90px;height:70px;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-sm)"></div>
     <span style="font-family:var(--font-mono);font-size:10px;color:var(--text-2)">shadow-sm</span>
   </div>
   <div style="display:flex;flex-direction:column;align-items:center;gap:12px">
     <div style="width:90px;height:70px;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-md)"></div>
     <span style="font-family:var(--font-mono);font-size:10px;color:var(--text-2)">shadow-md</span>
   </div>
   <div style="display:flex;flex-direction:column;align-items:center;gap:12px">
     <div style="width:90px;height:70px;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-lg)"></div>
     <span style="font-family:var(--font-mono);font-size:10px;color:var(--text-2)">shadow-lg</span>
   </div>
 </div>
</body></html>
