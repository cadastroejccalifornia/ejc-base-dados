<!-- @dsCard group="Colors" viewport="700x150" name="Superfícies neutras" subtitle="Canvas quente, cards e insets" -->
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--bg)}</style>
</head><body>
<div style="display:flex;gap:12px">
   <div style="flex:1;min-width:0">
  <div style="height:56px;border-radius:var(--r-md);background:var(--bg);box-shadow:var(--shadow-xs);display:flex;align-items:flex-end;padding:6px 8px">
    <span style="font-family:var(--font-mono);font-size:10px;color:#7a6a58">var(--bg)</span></div>
  <div style="font-size:12px;font-weight:600;margin-top:6px;color:var(--text)">Canvas</div>
</div>
   <div style="flex:1;min-width:0">
  <div style="height:56px;border-radius:var(--r-md);background:var(--surface);box-shadow:var(--shadow-xs);display:flex;align-items:flex-end;padding:6px 8px">
    <span style="font-family:var(--font-mono);font-size:10px;color:#7a6a58">var(--surface)</span></div>
  <div style="font-size:12px;font-weight:600;margin-top:6px;color:var(--text)">Card</div>
</div>
   <div style="flex:1;min-width:0">
  <div style="height:56px;border-radius:var(--r-md);background:var(--surface-2);box-shadow:var(--shadow-xs);display:flex;align-items:flex-end;padding:6px 8px">
    <span style="font-family:var(--font-mono);font-size:10px;color:#7a6a58">var(--surface-2)</span></div>
  <div style="font-size:12px;font-weight:600;margin-top:6px;color:var(--text)">Inset / pill</div>
</div>
   <div style="flex:1;min-width:0">
  <div style="height:56px;border-radius:var(--r-md);background:var(--surface-3);box-shadow:var(--shadow-xs);display:flex;align-items:flex-end;padding:6px 8px">
    <span style="font-family:var(--font-mono);font-size:10px;color:#7a6a58">var(--surface-3)</span></div>
  <div style="font-size:12px;font-weight:600;margin-top:6px;color:var(--text)">Pressed</div>
</div>
   <div style="flex:1;min-width:0">
  <div style="height:56px;border-radius:var(--r-md);background:var(--hairline);box-shadow:var(--shadow-xs);display:flex;align-items:flex-end;padding:6px 8px">
    <span style="font-family:var(--font-mono);font-size:10px;color:#7a6a58">var(--hairline)</span></div>
  <div style="font-size:12px;font-weight:600;margin-top:6px;color:var(--text)">Hairline</div>
</div>
 </div>
</body></html>
